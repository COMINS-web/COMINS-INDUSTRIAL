// ═══════════════════════════════════════════════════════════════
// COMINS INDUSTRIAL — Sistema Operativo
// Parte 1: Base + Login + Dashboard
// ═══════════════════════════════════════════════════════════════

const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ── FIREBASE helpers ─────────────────────────────────────────────
function fbCol(col) {
  return window._db ? window._db.collection(col) : null;
}
function fbSet(col, key, val) {
  try { if(window._db) window._db.collection(col).doc(key).set({v: val}); } catch(e){ console.warn("fbSet:",e); }
}
function fbGet(col, key, cb) {
  try {
    if(window._db) window._db.collection(col).doc(key).get()
      .then(d => { if(d.exists) cb(d.data().v); })
      .catch(e => console.warn("fbGet:",e));
  } catch(e){ console.warn("fbGet:",e); }
}

// ── useStored: Firebase + localStorage (v2 robusta) ─────────────
// Protecciones contra pérdida de datos:
//  1. Cada guardado lleva un número de revisión (rev). Un snapshot con rev
//     más viejo que el local NUNCA sobrescribe (mata la condición de carrera).
//  2. Los ecos locales de Firestore (hasPendingWrites) se ignoran.
//  3. Si el documento no existe en la nube pero hay datos locales, se SUBEN
//     a la nube — jamás se borra lo local con el seed vacío.
//  4. Contador de escrituras pendientes (no booleano) para ráfagas de cambios.
function useStored(key, seed, colName="comins_data") {
  const [val, setVal] = useState(() => {
    try {
      const s = localStorage.getItem("comins:"+key);
      if(s !== null) {
        const parsed = JSON.parse(s);
        // Formato nuevo {v, rev} o formato viejo (valor directo)
        if(parsed && typeof parsed === "object" && "v" in parsed && "rev" in parsed) return parsed.v;
        return parsed;
      }
    } catch(e){}
    return seed;
  });
  const [ready, setReady] = useState(false);
  const revRef = useRef((() => {
    try {
      const s = localStorage.getItem("comins:"+key);
      if(s !== null) { const p = JSON.parse(s); if(p && typeof p==="object" && "rev" in p) return p.rev; }
    } catch(e){}
    return 0;
  })());
  const pendingRef = useRef(0);
  const valRef = useRef(val);
  useEffect(() => { valRef.current = val; }, [val]);

  const persistLocal = (v, rev) => {
    try { localStorage.setItem("comins:"+key, JSON.stringify({v, rev})); } catch(e){}
  };

  const pushToCloud = (v, rev) => {
    pendingRef.current++;
    try {
      if(window._db) {
        window._db.collection(colName).doc(key).set({v, rev})
          .then(() => { pendingRef.current = Math.max(0, pendingRef.current-1); })
          .catch((e) => {
            pendingRef.current = Math.max(0, pendingRef.current-1);
            console.warn("Firestore write error ["+key+"]:", e);
            fireToast("⚠ Sin conexión — cambio guardado localmente");
          });
      } else { pendingRef.current = Math.max(0, pendingRef.current-1); }
    } catch(e) { pendingRef.current = Math.max(0, pendingRef.current-1); }
  };

  useEffect(() => {
    let unsub;
    const t = setTimeout(() => setReady(true), 5000);
    try {
      if(window._db) {
        unsub = window._db.collection(colName).doc(key).onSnapshot(
          { includeMetadataChanges: false },
          doc => {
            clearTimeout(t); setReady(true);
            // Ignorar ecos de escrituras propias aún no confirmadas por el servidor
            if(doc.metadata && doc.metadata.hasPendingWrites) return;
            // Si tenemos escrituras en vuelo, no aceptar snapshots (llegará el definitivo)
            if(pendingRef.current > 0) return;
            if(doc.exists && doc.data() && doc.data().v !== undefined) {
              const data = doc.data();
              const rev = data.rev || 0;
              // Solo aplicar si es igual o más nuevo que lo local
              if(rev >= revRef.current) {
                revRef.current = rev;
                setVal(data.v); valRef.current = data.v;
                persistLocal(data.v, rev);
              }
            } else {
              // El doc NO existe en la nube. Si hay datos locales, subirlos. NUNCA borrar.
              const local = valRef.current;
              const hasLocal = Array.isArray(local) ? local.length > 0
                : (local && typeof local === "object") ? Object.keys(local).length > 0
                : local !== undefined && local !== null && local !== "";
              if(hasLocal) {
                const rev = revRef.current || Date.now();
                revRef.current = rev;
                pushToCloud(local, rev);
              }
            }
          },
          err => { clearTimeout(t); setReady(true); console.warn("Firestore read error ["+key+"]:", err); }
        );
      } else { clearTimeout(t); setReady(true); }
    } catch(e) { clearTimeout(t); setReady(true); }
    return () => { clearTimeout(t); if(unsub) unsub(); };
  }, [key]);

  const save = useCallback(updater => {
    const next = typeof updater === "function" ? updater(valRef.current) : updater;
    const rev = Math.max(Date.now(), revRef.current + 1); // monotónico
    revRef.current = rev;
    setVal(next); valRef.current = next;
    persistLocal(next, rev);
    pushToCloud(next, rev);
  }, [key]);

  return [val, save, ready];
}

// ── TOAST ────────────────────────────────────────────────────────
function fireToast(msg) {
  window.__toastMsg = msg;
  window.dispatchEvent(new Event("showtoast"));
}

// Folio secuencial irrepetible: busca el máximo existente y suma 1
function nextFolio(list, prefix) {
  const max = (list||[]).reduce((m,x) => {
    const n = parseInt(String(x.folio||"").split("-").pop());
    return isNaN(n) ? m : Math.max(m,n);
  }, 0);
  return prefix + "-" + String(max+1).padStart(3,"0");
}

const today = (() => {

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
})();

const fmtD = d => d ? new Date(d+"T12:00:00").toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const cur  = n => `$${Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const pct  = n => `${Math.round(n||0)}%`;

function Toast() {
  const [msg, setMsg] = useState("");
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const fn = () => { setMsg(window.__toastMsg||""); setVis(true); setTimeout(()=>setVis(false),2800); };
    window.addEventListener("showtoast", fn);
    return () => window.removeEventListener("showtoast", fn);
  }, []);
  return (
    <div style={{
      position:"fixed", bottom:24, left:"50%", transform:`translateX(-50%) translateY(${vis?0:20}px)`,
      background:C.dark, color:"#fff", padding:"11px 22px", borderRadius:12,
      fontSize:14, fontWeight:600, boxShadow:C.shadowLg,
      opacity:vis?1:0, transition:"all .25s", pointerEvents:"none", zIndex:9999,
      whiteSpace:"nowrap", maxWidth:"90vw"
    }}>{msg}</div>
  );
}

function Card({children, style={}, onClick}) {
  const [hov, setHov] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{
        background:C.surface, border:`1px solid ${C.border}`, borderRadius:14,
        padding:"16px 18px", boxShadow:hov&&onClick?C.shadowMd:C.shadow,
        transition:"box-shadow .15s, transform .15s",
        transform:hov&&onClick?"translateY(-1px)":"none",
        cursor:onClick?"pointer":"default", ...style
      }}
    >{children}</div>
  );
}

function Btn({ch, onClick, v="primary", sm=false, style={}, disabled=false}) {
  const [hov, setHov] = useState(false);
  const base = {
    border:"none", borderRadius:9, fontFamily:"inherit", fontWeight:700,
    cursor:disabled?"not-allowed":"pointer", display:"inline-flex", alignItems:"center",
    justifyContent:"center", gap:6, transition:"all .15s",
    padding: sm?"7px 14px":"10px 20px", fontSize: sm?12:14,
    opacity: disabled?0.5:1,
  };
  const variants = {
    primary: { background:hov?C.accentD:C.accent, color:"#fff" },
    ghost:   { background:hov?C.surfaceAlt:"transparent", color:C.sub, border:`1.5px solid ${C.border}` },
    danger:  { background:hov?"#B91C1C":C.red, color:"#fff" },
    green:   { background:hov?"#15803D":C.green, color:"#fff" },
    dark:    { background:hov?C.darkSub:C.dark, color:"#fff" },
    soft:    { background:hov?C.accentBg:"#FEF5F5", color:C.accent, border:`1.5px solid ${C.accentBg}` },
  };
  return (
    <button
      onClick={disabled?undefined:onClick}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{...base, ...variants[v]||variants.primary, ...style}}
    >{ch}</button>
  );
}

function Inp({label, value, onChange, placeholder="", type="text", style={}, ...rest}) {
  return (
    <div style={{marginBottom:12}}>
      {label && <div style={{color:C.muted, fontSize:11, fontWeight:700, letterSpacing:.5, textTransform:"uppercase", marginBottom:5}}>{label}</div>}
      <input
        type={type} value={value} onChange={onChange} placeholder={placeholder}
        style={{
          width:"100%", background:C.surfaceAlt, border:`1.5px solid ${C.border}`,
          borderRadius:9, padding:"10px 13px", fontSize:14, fontFamily:"inherit",
          color:C.text, boxSizing:"border-box", ...style
        }}
        {...rest}
      />
    </div>
  );
}

function Lbl({t}) {
  return <div style={{color:C.muted, fontSize:11, fontWeight:700, letterSpacing:.5, textTransform:"uppercase", marginBottom:5}}>{t}</div>;
}

function Modal({title, onClose, children, wide=false}) {
  useEffect(() => {
    const fn = e => e.key==="Escape" && onClose();
    document.addEventListener("keydown", fn);
    return () => document.removeEventListener("keydown", fn);
  }, [onClose]);
  return (
    <div style={{
      position:"fixed", inset:0, background:"rgba(0,0,0,.45)", zIndex:1000,
      display:"flex", alignItems:"flex-end", justifyContent:"center",
      backdropFilter:"blur(2px)"
    }} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{
        background:C.surface, borderRadius:"20px 20px 0 0", width:"100%",
        maxWidth: wide?720:520, maxHeight:"92vh", overflow:"auto",
        boxShadow:C.shadowLg, padding:"20px 20px 32px"
      }}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18}}>
          <div style={{fontWeight:800, fontSize:17, color:C.text}}>{title}</div>
          <button onClick={onClose} style={{background:C.surfaceAlt, border:"none", borderRadius:8, width:32, height:32, cursor:"pointer", fontSize:16, color:C.muted}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Bdg({label, color, bg, icon}) {

    <span style={{background:bg||color+"18", color, borderRadius:7, padding:"3px 9px", fontSize:11, fontWeight:700, display:"inline-flex", alignItems:"center", gap:4}}>

  );
}

// ── PANTALLA DE LOGIN ──
function LoginScreen({onLogin, usuarios}) {
  const [usuario, setUsuario] = useState("");
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const pinRef = useRef();

  const entrar = () => {
    if(!usuario || !pin) return;
    setError(""); setLoading(true);
    setTimeout(() => {
      const lista = (usuarios&&usuarios.length) ? usuarios : USUARIOS_DEFAULT;
      const u = lista.find(x => x.usuario.toLowerCase() === usuario.toLowerCase() && String(x.pin) === String(pin));
      if(u) { onLogin(u); fireToast(`Bienvenido, ${u.nombre} 👋`); }
      else  { setError("Usuario o PIN incorrecto"); setPin(""); }
      setLoading(false);
    }, 400);
  };

  return (
    <div style={{
      minHeight:"100vh", background:C.bg,
      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
      padding:24, fontFamily:"'Inter',-apple-system,'Segoe UI',sans-serif", position:"relative", overflow:"hidden"
    }}>
      {/* Banda chevrón diagonal — firma de marca COMINS */}
      <div style={{position:"absolute", top:0, left:0, right:0, height:6,
        background:`repeating-linear-gradient(-55deg, ${C.accent} 0 28px, ${C.dark} 28px 56px)`}}/>
      <div style={{position:"absolute", top:-140, right:-140, width:420, height:420, borderRadius:"50%",
        background:`radial-gradient(circle, ${C.accentBg} 0%, transparent 65%)`, pointerEvents:"none"}}/>

      {/* Logo */}
      <div style={{marginBottom:34, textAlign:"center", position:"relative"}}>
        <div style={{
          width:76, height:76, background:`linear-gradient(135deg, ${C.accent}, ${C.accentD})`,
          borderRadius:20, display:"flex", alignItems:"center", justifyContent:"center",
          fontSize:34, margin:"0 auto 16px", color:"#fff",
          boxShadow:`0 12px 32px ${C.accent}35`
        }}>⚙</div>
        <div style={{color:C.text, fontSize:30, fontWeight:900, letterSpacing:-1}}>COMINS</div>
        <div style={{color:C.muted, fontSize:12, fontWeight:700, letterSpacing:4, marginTop:2}}>INDUSTRIAL</div>
      </div>

      {/* Card login */}
      <div style={{
        background:C.surface, border:`1px solid ${C.border}`, borderRadius:22,
        padding:"30px 28px 26px", width:"100%", maxWidth:370,
        boxShadow:C.shadowLg, position:"relative"
      }}>
        <div style={{fontWeight:800, fontSize:19, color:C.text, marginBottom:3}}>Iniciar sesión</div>
        <div style={{color:C.muted, fontSize:13, marginBottom:22}}>Sistema de administración de obra</div>

        <Lbl t="Usuario"/>
        <input
          value={usuario}
          onChange={e=>setUsuario(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&pinRef.current?.focus()}
          placeholder="tu usuario" autoCapitalize="none"
          style={{width:"100%", background:C.surfaceAlt, border:`1.5px solid ${error?C.accent:C.border}`,
            borderRadius:11, padding:"12px 14px", fontSize:14, fontFamily:"inherit",
            color:C.text, boxSizing:"border-box", outline:"none", marginBottom:14}}
        />

        <Lbl t="PIN"/>
        <input
          ref={pinRef} type="password" value={pin}
          onChange={e=>setPin(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&entrar()}
          placeholder="••••" maxLength={8} inputMode="numeric"
          style={{width:"100%", background:C.surfaceAlt, border:`1.5px solid ${error?C.accent:C.border}`,
            borderRadius:11, padding:"11px 14px", fontSize:22, fontFamily:"inherit",
            color:C.text, boxSizing:"border-box", letterSpacing:8, outline:"none", marginBottom:18}}
        />

        {error && (
          <div style={{background:C.accentBg, borderRadius:10, padding:"10px 13px",
            marginBottom:14, color:C.accent, fontSize:13, fontWeight:700}}>
            ⚠ {error}
          </div>
        )}

        <button
          onClick={entrar}
          disabled={loading||!usuario||!pin}
          style={{width:"100%", background:`linear-gradient(135deg, ${C.accent}, ${C.accentD})`,
            color:"#fff", border:"none", borderRadius:12, padding:"14px",
            fontSize:15, fontWeight:800, fontFamily:"inherit",
            cursor:loading||!usuario||!pin?"not-allowed":"pointer",
            opacity:loading||!usuario||!pin?.55:1, transition:"all .15s",
            boxShadow:`0 6px 20px ${C.accent}30`}}
        >
          {loading ? "Verificando..." : "Entrar →"}
        </button>

        <div style={{textAlign:"center", marginTop:18, color:C.muted, fontSize:11}}>
          COMINS · Ciudad Madero, Tamaulipas
        </div>
      </div>
    </div>
  );
}

// ── DASHBOARD ────────────────────────────────────────────────────
function DashboardTab({obras, proyectos, finanzas, compras, usuario}) {
  const rol = usuario?.rol;

  // KPIs calculados
  const obrasActivas   = obras.filter(o => o.status === "en_proceso");
  const obrasPausadas  = obras.filter(o => o.status === "pausada");
  const cobrosTotal    = obrasActivas.reduce((s,o) => s + (o.montoContrato||0), 0);
  const cobrado        = obrasActivas.reduce((s,o) => s + (o.cobrado||0), 0);
  const pendienteCobro = cobrosTotal - cobrado;
  const gastosTotal    = obrasActivas.reduce((s,o) => s + (o.gastos||0), 0);
  const utilidad       = cobrado - gastosTotal;
  const solicitudesPendientes = compras.filter(c => c.status === "pendiente").length;

  // Avance promedio obras activas
  const avgAvance = obrasActivas.length
    ? Math.round(obrasActivas.reduce((s,o) => s + (o.avance||0), 0) / obrasActivas.length)
    : 0;

  return (
    <div>
      {/* Saludo */}
      <div style={{padding:"20px 20px 0"}}>
        <div style={{fontWeight:900, fontSize:22, color:C.text, marginBottom:2}}>
          {new Date().getHours() < 12 ? "Buenos días" : new Date().getHours() < 19 ? "Buenas tardes" : "Buenas noches"}, {usuario?.nombre} 👋
        </div>
        <div style={{color:C.muted, fontSize:13, marginBottom:20}}>
          {today ? fmtD(today) : ""} · {obrasActivas.length} obra{obrasActivas.length!==1?"s":""} activa{obrasActivas.length!==1?"s":""}
        </div>

        {/* KPIs principales — solo director y asistente ven montos */}
        {(rol==="director"||rol==="asistente") && (
          <div style={{display:"flex", gap:10, marginBottom:16, flexWrap:"wrap"}}>
            <KpiCard icon="🏗"  label="Obras activas"    value={obrasActivas.length}  sub={obrasPausadas.length>0?`${obrasPausadas.length} pausada${obrasPausadas.length>1?"s":""}`:"Sin pausas"} color={C.blue}/>
            <KpiCard icon="💸" label="Por cobrar"        value={cur(pendienteCobro)}   sub="saldo pendiente"        color={pendienteCobro>0?C.orange:C.green}/>
            <KpiCard icon="📈" label="Utilidad acum."    value={cur(utilidad)}         sub="obras activas"          color={utilidad>=0?C.green:C.red}/>
          </div>
        )}

        {/* Supervisor solo ve avance y solicitudes */}
        {rol==="supervisor" && (
          <div style={{display:"flex", gap:10, marginBottom:16, flexWrap:"wrap"}}>
            <KpiCard icon="🏗"  label="Obras activas"        value={obrasActivas.length}        color={C.blue}/>
            <KpiCard icon="📊" label="Avance promedio"       value={pct(avgAvance)}             color={avgAvance>=70?C.green:C.orange}/>
            <KpiCard icon="🛒" label="Solicitudes pendientes" value={solicitudesPendientes}      color={solicitudesPendientes>0?C.orange:C.green}/>
          </div>
        )}

        {/* Obras activas — lista */}
        <div style={{marginBottom:8, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
          <div style={{fontWeight:800, fontSize:16}}>Obras en proceso</div>
          {(rol==="director"||rol==="asistente") && (
            <div style={{fontSize:12, color:C.muted, fontWeight:600}}>Contrato · Cobrado · Gasto</div>
          )}
        </div>

        {obrasActivas.length === 0 && (
          <Card style={{textAlign:"center", padding:32}}>
            <div style={{fontSize:32, marginBottom:8}}>🏗</div>
            <div style={{fontWeight:700, color:C.muted}}>Sin obras activas</div>
            <div style={{fontSize:13, color:C.muted, marginTop:4}}>Agrega un proyecto en la sección Proyectos</div>
          </Card>
        )}

        {obrasActivas.map(obra => (
          <Card key={obra.id} style={{marginBottom:10}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10, marginBottom:10}}>
              <div style={{flex:1}}>
                <div style={{display:"flex", gap:6, alignItems:"center", marginBottom:4, flexWrap:"wrap"}}>
                  <span style={{fontWeight:900, fontSize:15}}>{obra.nombre}</span>
                  <Bdg label={OBRA_TIPOS.find(t=>t===obra.tipo)||obra.tipo||"—"} color={C.blue} bg={C.blueBg}/>
                </div>
                <div style={{color:C.muted, fontSize:12}}>{obra.cliente} · {obra.ubicacion||"Sin ubicación"}</div>
              </div>
              {(rol==="director"||rol==="asistente") && (
                <div style={{textAlign:"right", flexShrink:0}}>
                  <div style={{fontSize:12, color:C.muted}}>Contrato</div>
                  <div style={{fontWeight:900, fontSize:16, color:C.text}}>{cur(obra.montoContrato||0)}</div>
                </div>
              )}
            </div>

            {/* Barra de avance */}
            <div style={{marginBottom:(rol==="director"||rol==="asistente")?10:0}}>
              <div style={{display:"flex", justifyContent:"space-between", marginBottom:4}}>
                <span style={{fontSize:11, color:C.muted, fontWeight:700}}>AVANCE FÍSICO</span>
                {obra.fechaFin && <span style={{fontSize:11, color:C.muted}}>Término: {fmtD(obra.fechaFin)}</span>}
              </div>
              <Semaforo p={obra.avance||0}/>
            </div>

            {/* Financiero — solo director y asistente */}
            {(rol==="director"||rol==="asistente") && (
              <div style={{display:"flex", gap:8, marginTop:6}}>
                <div style={{flex:1, background:C.greenBg, borderRadius:8, padding:"6px 10px"}}>
                  <div style={{fontSize:10, color:C.green, fontWeight:700}}>COBRADO</div>
                  <div style={{fontWeight:800, fontSize:13, color:C.green}}>{cur(obra.cobrado||0)}</div>
                </div>
                <div style={{flex:1, background:C.redBg, borderRadius:8, padding:"6px 10px"}}>
                  <div style={{fontSize:10, color:C.red, fontWeight:700}}>GASTADO</div>
                  <div style={{fontWeight:800, fontSize:13, color:C.red}}>{cur(obra.gastos||0)}</div>
                </div>
                <div style={{flex:1, background:((obra.cobrado||0)-(obra.gastos||0))>=0?C.greenBg:C.redBg, borderRadius:8, padding:"6px 10px"}}>
                  <div style={{fontSize:10, color:((obra.cobrado||0)-(obra.gastos||0))>=0?C.green:C.red, fontWeight:700}}>UTILIDAD</div>
                  <div style={{fontWeight:800, fontSize:13, color:((obra.cobrado||0)-(obra.gastos||0))>=0?C.green:C.red}}>
                    {cur((obra.cobrado||0)-(obra.gastos||0))}
                  </div>
                </div>
              </div>
            )}
          </Card>
        ))}

        {/* Alertas rápidas */}
        {(rol==="director"||rol==="asistente") && solicitudesPendientes > 0 && (
          <div style={{background:C.orangeBg, border:`1px solid ${C.orange}33`, borderRadius:12, padding:"12px 16px", marginTop:8, display:"flex", alignItems:"center", gap:10}}>
            <span style={{fontSize:22}}>🛒</span>
            <div>
              <div style={{fontWeight:800, fontSize:13, color:C.orange}}>{solicitudesPendientes} solicitud{solicitudesPendientes>1?"es":""} de compra pendiente{solicitudesPendientes>1?"s":""}</div>
              <div style={{fontSize:12, color:C.darkMuted}}>Revisa y aprueba en el módulo de Compras</div>
            </div>
          </div>
        )}

        {obrasPausadas.length > 0 && (
          <div style={{background:C.orangeBg, border:`1px solid ${C.orange}33`, borderRadius:12, padding:"12px 16px", marginTop:8, display:"flex", alignItems:"center", gap:10}}>
            <span style={{fontSize:22}}>⏸</span>
            <div>
              <div style={{fontWeight:800, fontSize:13, color:C.orange}}>{obrasPausadas.length} obra{obrasPausadas.length>1?"s":""} pausada{obrasPausadas.length>1?"s":""}</div>
              <div style={{fontSize:12, color:C.darkMuted}}>{obrasPausadas.map(o=>o.nombre).join(", ")}</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const OBRA_STATUS = {
  prospecto:  { label:"Prospecto",  color:"#8A95A3", bg:"#F0F2F5", icon:"🔍" },
  en_proceso: { label:"En proceso", color:"#2563EB", bg:"#EFF6FF", icon:"🏗"  },
  pausada:    { label:"Pausada",    color:"#D97706", bg:"#FFFBEB", icon:"⏸"  },
  terminada:  { label:"Terminada",  color:"#16A34A", bg:"#F0FDF4", icon:"✅"  },
  cancelada:  { label:"Cancelada",  color:"#DC2626", bg:"#FEF2F2", icon:"❌"  },
};

const OBRA_TIPOS = [
  "Eléctrico Industrial","Civil","Refrigeración",
  "Mantenimiento Integral","Instalaciones Especiales","Otro"
];

const ETAPAS_DEFAULT = ["Preliminares","Cimentación","Estructura","Instalaciones","Acabados","Entrega"];

const BITA_TIPOS = {
  avance:    {label:"Avance",    color:C.green,  bg:C.greenBg,  icon:"📊"},
  material:  {label:"Material",  color:C.blue,   bg:C.blueBg,   icon:"📦"},
  incidencia:{label:"Incidencia",color:C.red,    bg:C.redBg,    icon:"⚠"},
  visita:    {label:"Visita",    color:C.purple, bg:C.purpleBg, icon:"👥"},
  nota:      {label:"Nota",      color:C.muted,  bg:C.surfaceAlt,icon:"📝"},
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function Sel({label,value,onChange,options=[]}) {
  return <div style={{marginBottom:12}}>
    {label&&<Lbl t={label}/>}
    <select value={value} onChange={onChange}
      style={{width:"100%",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:9,
        padding:"10px 13px",fontSize:14,fontFamily:"inherit",color:C.text,boxSizing:"border-box"}}>
      {options.map(o=><option key={o.v||o} value={o.v||o}>{o.l||o}</option>)}
    </select>
  </div>;
}

function Semaforo({p,showLabel=true}) {
  const color=p>=80?C.green:p>=40?C.orange:C.red;
  return <div style={{display:"flex",alignItems:"center",gap:8}}>
    <div style={{flex:1,height:7,background:C.border,borderRadius:4,overflow:"hidden"}}>
      <div style={{width:`${Math.min(p,100)}%`,height:"100%",background:color,borderRadius:4,transition:"width .4s"}}/>
    </div>
    {showLabel&&<span style={{fontSize:12,fontWeight:800,color,minWidth:34}}>{Math.round(p)}%</span>}
  </div>;
}

function BitacoraModal({onClose,onSave,autor}) {
  const [nota,setNota]=useState("");
  const [tipo,setTipo]=useState("avance");
  const [fecha,setFecha]=useState(today);
  return <Modal title="📝 Registro de bitácora" onClose={onClose}>
    <Sel label="Tipo" value={tipo} onChange={e=>setTipo(e.target.value)}
      options={Object.entries(BITA_TIPOS).map(([v,{label,icon}])=>({v,l:`${icon} ${label}`}))}/>
    <Inp label="Fecha" type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/>
    <div style={{marginBottom:12}}>
      <Lbl t="Descripción"/>
      <textarea value={nota} onChange={e=>setNota(e.target.value)}
        placeholder="Describe el avance, material, incidencia o nota..." rows={4}
        style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:9,
          padding:"10px 13px",fontSize:14,fontFamily:"inherit",color:C.text,boxSizing:"border-box",resize:"vertical"}}/>
    </div>
    <div style={{display:"flex",gap:10}}>
      <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
      <Btn ch="✅ Guardar" v="primary" onClick={()=>{ if(!nota.trim()) return; onSave({id:uid(),fecha,autor,nota,tipo}); onClose(); }} style={{flex:1}}/>
    </div>
  </Modal>;
}

function ObraModal({onClose,onSave,editObra=null,folioNext="OBR-001"}) {
  const [form,setForm]=useState(editObra||{nombre:"",cliente:"",tipo:OBRA_TIPOS[0],ubicacion:"",descripcion:"",supervisor:"",fechaInicio:today,fechaFin:"",montoContrato:"",status:"prospecto"});
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const [etapas,setEtapas]=useState(editObra?.etapas||[]);
  const [newEtapa,setNewEtapa]=useState("");
  const addEtapa=()=>{ if(!newEtapa.trim()) return; setEtapas(p=>[...p,{id:uid(),nombre:newEtapa.trim(),avance:0,fechaInicio:"",fechaFin:""}]); setNewEtapa(""); };
  const guardar=()=>{
    if(!form.nombre.trim()||!form.cliente.trim()) return fireToast("⚠ Nombre y cliente son obligatorios");
    onSave({...form,id:editObra?.id||uid(),folio:editObra?.folio||folioNext,montoContrato:parseFloat(form.montoContrato)||0,cobrado:editObra?.cobrado||0,gastos:editObra?.gastos||0,avance:editObra?.avance||0,etapas,bitacora:editObra?.bitacora||[]});
    onClose();
  };
  return <Modal title={editObra?"✏ Editar proyecto":"🏗 Nuevo proyecto"} onClose={onClose} wide>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 16px"}}>
      <div style={{gridColumn:"1/-1"}}><Inp label="Nombre del proyecto *" value={form.nombre} onChange={e=>set("nombre",e.target.value)} placeholder="Ej: Subestación CFE Tampico"/></div>
      <Inp label="Cliente *" value={form.cliente} onChange={e=>set("cliente",e.target.value)} placeholder="Nombre del cliente"/>
      <Inp label="Ubicación" value={form.ubicacion} onChange={e=>set("ubicacion",e.target.value)} placeholder="Ciudad, Estado"/>
      <Sel label="Tipo de obra" value={form.tipo} onChange={e=>set("tipo",e.target.value)} options={OBRA_TIPOS}/>
      <Sel label="Estatus" value={form.status} onChange={e=>set("status",e.target.value)} options={Object.entries(OBRA_STATUS).map(([v,{label,icon}])=>({v,l:`${icon} ${label}`}))}/>
      <Inp label="Fecha inicio" type="date" value={form.fechaInicio} onChange={e=>set("fechaInicio",e.target.value)}/>
      <Inp label="Fecha término" type="date" value={form.fechaFin} onChange={e=>set("fechaFin",e.target.value)}/>
      <Inp label="Monto de contrato $" type="number" value={form.montoContrato} onChange={e=>set("montoContrato",e.target.value)} placeholder="0.00"/>
      <Inp label="Supervisor asignado" value={form.supervisor} onChange={e=>set("supervisor",e.target.value)} placeholder="Nombre del supervisor"/>
      <div style={{gridColumn:"1/-1"}}>
        <div style={{marginBottom:12}}>
          <Lbl t="Descripción del proyecto"/>
          <textarea value={form.descripcion} onChange={e=>set("descripcion",e.target.value)} placeholder="Alcance general..." rows={3}
            style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"10px 13px",fontSize:14,fontFamily:"inherit",color:C.text,boxSizing:"border-box",resize:"vertical"}}/>
        </div>
      </div>
    </div>
    <div style={{borderTop:`1px solid ${C.border}`,paddingTop:16,marginTop:4}}>
      <Lbl t="Etapas de la obra"/>
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <input value={newEtapa} onChange={e=>setNewEtapa(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addEtapa()}
          placeholder="Nombre de etapa... (Enter para agregar)"
          style={{flex:1,background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"9px 13px",fontSize:13,fontFamily:"inherit",color:C.text}}/>
        <Btn ch="+ Agregar" v="dark" sm onClick={addEtapa}/>
      </div>
      {etapas.length===0&&(
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:6}}>Sugerencias rápidas:</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {ETAPAS_DEFAULT.map(e=><button key={e} onClick={()=>setEtapas(p=>[...p,{id:uid(),nombre:e,avance:0,fechaInicio:"",fechaFin:""}])}
              style={{background:C.surfaceAlt,border:`1px solid ${C.border}`,borderRadius:20,padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit",color:C.sub}}>+ {e}</button>)}
          </div>
        </div>
      )}
      {etapas.map((et,i)=><div key={et.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:C.surfaceAlt,borderRadius:9,marginBottom:6}}>
        <span style={{fontSize:13,fontWeight:600,flex:1}}>{i+1}. {et.nombre}</span>
        <button onClick={()=>setEtapas(p=>p.filter(x=>x.id!==et.id))} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:16,padding:"0 4px"}}>×</button>
      </div>)}
    </div>
    <div style={{display:"flex",gap:10,marginTop:16}}>
      <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
      <Btn ch={editObra?"✅ Guardar cambios":"✅ Crear proyecto"} v="primary" onClick={guardar} style={{flex:1}}/>
    </div>
  </Modal>;
}

function EtapaCard({etapa, i, rol, onSaveAvance}) {
  const [editing, setEditing] = useState(false);
  const [tmpAvance, setTmpAvance] = useState(String(etapa.avance||0));
  return <Card style={{marginBottom:10}}>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
      <span style={{background:C.dark,color:"#fff",borderRadius:6,width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,flexShrink:0}}>{i+1}</span>
      <span style={{fontWeight:800,fontSize:15,flex:1}}>{etapa.nombre}</span>
      {etapa.avance>=100&&<span>✅</span>}
    </div>
    <Semaforo p={etapa.avance||0}/>
    {(rol==="director"||rol==="supervisor")&&<div style={{marginTop:10}}>
      {editing?(
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input type="range" min={0} max={100} step={5} value={tmpAvance} onChange={e=>setTmpAvance(e.target.value)} style={{flex:1,accentColor:C.accent}}/>
          <span style={{fontWeight:800,fontSize:14,minWidth:40,textAlign:"right",color:C.accent}}>{tmpAvance}%</span>
          <Btn ch="✅" v="green" sm onClick={()=>{onSaveAvance(etapa.id,tmpAvance);setEditing(false);}}/>
          <Btn ch="✕" v="ghost" sm onClick={()=>setEditing(false)}/>

      )}
    </div>}
  </Card>;
}

function ObraDetalle({obra,onClose,onSave,onEdit,onDelete,usuario}) {
  const [tab,setTab]=useState("general");
  const [showBita,setShowBita]=useState(false);
  const [editEtapaId,setEditEtapaId]=useState(null);
  const rol=usuario?.rol;
  const saveEtapaAvance=(etapaId,nuevoAvance)=>{
    const etapas=obra.etapas.map(e=>e.id===etapaId?{...e,avance:parseInt(nuevoAvance)||0}:e);
    const avg=etapas.length?Math.round(etapas.reduce((s,e)=>s+e.avance,0)/etapas.length):0;
    onSave({...obra,etapas,avance:avg});
  };
  const addBitacora=(registro)=>onSave({...obra,bitacora:[registro,...(obra.bitacora||[])]});
  const st=OBRA_STATUS[obra.status]||OBRA_STATUS.prospecto;
  const diasRestantes=obra.fechaFin?(Math.ceil((new Date(obra.fechaFin+"T12:00:00")-new Date())/(1000*60*60*24))):null;
  return <div style={{position:"fixed",inset:0,background:C.bg,zIndex:900,overflowY:"auto",fontFamily:"-apple-system,'SF Pro Display','Segoe UI',sans-serif"}}>
    <div style={{background:C.dark,padding:"14px 20px",position:"sticky",top:0,zIndex:10,boxShadow:"0 2px 12px rgba(0,0,0,.3)"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
        <button onClick={onClose} style={{background:"rgba(255,255,255,.1)",border:"none",borderRadius:8,width:36,height:36,cursor:"pointer",color:"#fff",fontSize:18}}>←</button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{color:"#ffffff55",fontSize:11,fontWeight:700,letterSpacing:1}}>{obra.folio}</div>
          <div style={{color:"#fff",fontWeight:900,fontSize:17,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{obra.nombre}</div>
        </div>
        <Bdg label={st.label} color={st.color} bg={st.bg} icon={st.icon}/>
        {(usuario?.rol==="director"||usuario?.rol==="asistente")&&<>
          <button onClick={()=>onEdit&&onEdit(obra)} title="Editar proyecto"
            style={{background:"rgba(255,255,255,.1)",border:"none",borderRadius:8,width:34,height:34,cursor:"pointer",color:"#fff",fontSize:15}}>✏</button>
          <button onClick={()=>{if(window.confirm(`¿Eliminar el proyecto ${obra.folio} — ${obra.nombre}? Esta acción no se puede deshacer.`)) onDelete&&onDelete(obra.id);}} title="Eliminar proyecto"
            style={{background:"rgba(255,80,80,.25)",border:"none",borderRadius:8,width:34,height:34,cursor:"pointer",color:"#ffb4b4",fontSize:15}}>🗑</button>
        </>}
      </div>
      <div style={{display:"flex",gap:4}}>
        {[{v:"general",l:"General"},{v:"etapas",l:"Etapas"},{v:"bitacora",l:"Bitácora"}].map(t=>(
          <button key={t.v} onClick={()=>setTab(t.v)} style={{background:tab===t.v?"rgba(255,255,255,.15)":"transparent",border:`1px solid ${tab===t.v?"rgba(255,255,255,.3)":"transparent"}`,borderRadius:8,padding:"6px 14px",cursor:"pointer",fontFamily:"inherit",color:tab===t.v?"#fff":"#ffffff66",fontSize:12,fontWeight:700}}>{t.l}</button>
        ))}
      </div>
    </div>
    <div style={{padding:"20px 20px 40px",maxWidth:640,margin:"0 auto"}}>
      {tab==="general"&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
          {[{icon:"🏢",label:"Cliente",value:obra.cliente},{icon:"📍",label:"Ubicación",value:obra.ubicacion||"—"},{icon:"🔧",label:"Tipo",value:obra.tipo},{icon:"🦺",label:"Supervisor",value:obra.supervisor||"—"},{icon:"📅",label:"Inicio",value:fmtD(obra.fechaInicio)},{icon:"🏁",label:"Término",value:fmtD(obra.fechaFin)}].map(item=>(
            <div key={item.label} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:11,padding:"12px 14px",boxShadow:C.shadow}}>
              <div style={{fontSize:10,color:C.muted,fontWeight:700,marginBottom:3}}>{item.icon} {item.label}</div>
              <div style={{fontWeight:700,fontSize:13,color:C.text}}>{item.value}</div>
            </div>
          ))}
        </div>
        <Card style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:15}}>Avance general</div>
            {diasRestantes!==null&&<span style={{fontSize:12,fontWeight:700,color:diasRestantes<7?C.red:diasRestantes<30?C.orange:C.green}}>{diasRestantes>0?`${diasRestantes} días restantes`:"Fecha vencida"}</span>}
          </div>
          <Semaforo p={obra.avance||0}/>
        </Card>
        {(rol==="director"||rol==="asistente")&&<Card style={{marginBottom:12}}>
          <div style={{fontWeight:800,fontSize:15,marginBottom:12}}>Financiero</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {[{label:"Contrato",value:cur(obra.montoContrato||0),color:C.blue,bg:C.blueBg},{label:"Cobrado",value:cur(obra.cobrado||0),color:C.green,bg:C.greenBg},{label:"Gastado",value:cur(obra.gastos||0),color:C.red,bg:C.redBg}].map(f=>(
              <div key={f.label} style={{background:f.bg,borderRadius:10,padding:"10px 12px"}}>
                <div style={{fontSize:10,color:f.color,fontWeight:700}}>{f.label}</div>
                <div style={{fontWeight:900,fontSize:14,color:f.color}}>{f.value}</div>
              </div>
            ))}
          </div>
          <div style={{marginTop:10,background:(obra.cobrado||0)-(obra.gastos||0)>=0?C.greenBg:C.redBg,borderRadius:10,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontWeight:700,fontSize:13,color:(obra.cobrado||0)-(obra.gastos||0)>=0?C.green:C.red}}>Utilidad del proyecto</span>
            <span style={{fontWeight:900,fontSize:16,color:(obra.cobrado||0)-(obra.gastos||0)>=0?C.green:C.red}}>{cur((obra.cobrado||0)-(obra.gastos||0))}</span>
          </div>
        </Card>}
        {obra.descripcion&&<Card><div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:6}}>DESCRIPCIÓN</div><div style={{fontSize:14,color:C.sub,lineHeight:1.6}}>{obra.descripcion}</div></Card>}
      </>}
      {tab==="etapas"&&<>

const UNIDADES = ["PZA","LOTE","M","M2","M3","ML","KG","TON","JOR","HR","DÍA","SALIDA","PUNTO","SERV"];
const num = v => parseFloat(v)||0;

const PRES_ST = {
  borrador:   {label:"Borrador",   color:"#8A95A3", bg:"#F0F2F5", icon:"📝"},
  seguimiento:{label:"Enviado",    color:"#2563EB", bg:"#EFF6FF", icon:"📤"},
  autorizada: {label:"Autorizado", color:"#16A34A", bg:"#F0FDF4", icon:"✅"},
  rechazada:  {label:"Rechazado",  color:"#DC2626", bg:"#FEF2F2", icon:"❌"},
};

// PU = (Σmateriales + Σmano_obra + Σequipo) × (1 + indirectos%)
function calcAPU(apu) {
  if(!apu) return {mat:0,mo:0,eq:0,directo:0,indirecto:0,pu:0};
  const mat = (apu.materiales||[]).reduce((s,m)=>s+num(m.cantidad)*num(m.precio),0);
  const mo  = (apu.manoObra||[]).reduce((s,m)=>s+num(m.cantidad)*num(m.costo),0);
  const eq  = (apu.equipo||[]).reduce((s,m)=>s+num(m.cantidad)*num(m.costo),0);
  const directo = mat+mo+eq;
  const indirecto = directo*(num(apu.indirectosPct)/100);
  return {mat,mo,eq,directo,indirecto,pu:directo+indirecto};
}

        <div style={{color:"#ffffff99",fontSize:14,fontWeight:800,textAlign:"right"}}>{cur(calc.pu*num(concepto.cantidad))}</div>

    <div style={{display:"flex",gap:10}}>
      <Btn ch="Cancelar" v="ghost" onClick={onClose}/>

    </div>
  </Modal>;
}

function buildPresupuestoHTML(p, getPU) {
  const dateStr = new Date((p.fecha||today)+"T12:00:00").toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"});
  const subtotal = p.grupos.reduce((s,g)=>s+g.conceptos.reduce((s2,c)=>s2+getPU(c)*num(c.cantidad),0),0);
  const ivaM = p.iva ? subtotal*0.16 : 0;
  const total = subtotal + ivaM;
  const ivaLabel = p.iva ? "IVA 16%" : "Sin IVA";

  let rowsHTML = "";
  p.grupos.forEach((g,gi)=>{
    const letra = String.fromCharCode(65+gi);
    rowsHTML += "<tr><td colspan='6' style='background:#E8EDF2;color:#374151;padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.3px;border-left:3px solid #8B1A1A'>"+letra+". "+(g.nombre||"")+"</td></tr>";

      const pu = getPU(c);

  });

  const clausSrc = p.clausulasSelec||[];

      + "</div>" : "";

  const st = PRES_ST[p.status]||PRES_ST.borrador;
  const sBg = p.status==="autorizada"?"#D1FAE5":p.status==="rechazada"?"#FEE2E2":"#FEF3C7";

function imprimirPresupuesto(p, getPU) {
  const html = buildPresupuestoHTML(p, getPU);
  try {
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    let clienteNombre = (p.cliente||"Cliente").trim().replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g,"").replace(/ +/g,"_").slice(0,30) || "Cliente";
    const fechaArchivo = (p.fecha||today).replace(/-/g,"");
    a.download = p.folio+"_"+clienteNombre+"_"+fechaArchivo+".html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    fireToast("📄 Descargado — ábrelo y usa Ctrl+P para PDF");
  } catch(e) {
    fireToast("⚠ Error al generar — intenta de nuevo");
  }
}

function PresupuestosTab({presupuestos,setPresupuestos,clausulas,setClausulas}) {
  const [editor,setEditor]=useState(null);
  const [filtro,setFiltro]=useState("todos");
  const getPUof=p=>c=>c.usaAPU&&c.apu?calcAPU(c.apu).pu:num(c.puManual);
  const getTotal=p=>{
    const g=getPUof(p);
    const sub=p.grupos.reduce((s,gr)=>s+gr.conceptos.reduce((s2,c)=>s2+g(c)*num(c.cantidad),0),0);
    return p.iva?sub*1.16:sub;
  };
  const filtrados=filtro==="todos"?presupuestos:presupuestos.filter(p=>p.status===filtro);
  const savePres=(pres)=>{
    setPresupuestos(prev=>{const idx=prev.findIndex(x=>x.id===pres.id);return idx>=0?prev.map(x=>x.id===pres.id?pres:x):[pres,...prev];});
    fireToast("✅ Presupuesto guardado");
    setEditor(null);
  };
  const deletePres=(id)=>{
    setPresupuestos(prev=>prev.filter(x=>x.id!==id));
    fireToast("🗑 Presupuesto eliminado");
  };
  if(editor!==null) return <PresupuestoEditor presupuesto={editor.presupuesto} onSave={savePres} onDelete={deletePres}
    onClose={()=>setEditor(null)} folioNext={nextFolio(presupuestos,"PRES")} clausulas={clausulas} setClausulas={setClausulas}/>;
  return <div style={{padding:"20px 20px 40px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div>
        <div style={{fontWeight:900,fontSize:22}}>Presupuestos</div>
        <div style={{color:C.muted,fontSize:13}}>{presupuestos.length} presupuesto{presupuestos.length!==1?"s":""} · Siguiente folio: {nextFolio(presupuestos,"PRES")}</div>
      </div>
      <Btn ch="+ Nuevo" v="primary" onClick={()=>setEditor({presupuesto:null})}/>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto"}}>
      {[{v:"todos",label:"Todos",color:C.dark},...Object.entries(PRES_ST).map(([v,s])=>({v,...s}))].map(s=>(
        <button key={s.v} onClick={()=>setFiltro(s.v)}
          style={{background:filtro===s.v?(s.bg||C.surfaceAlt):"transparent",border:`1.5px solid ${filtro===s.v?s.color:C.border}`,color:filtro===s.v?s.color:C.muted,borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>
          {s.icon||""} {s.label}
        </button>
      ))}
    </div>
    {filtrados.length===0&&<Card style={{textAlign:"center",padding:40}}><div style={{fontSize:40,marginBottom:10}}>📄</div><div style={{fontWeight:700,color:C.muted}}>Sin presupuestos</div></Card>}
    {filtrados.map(p=>{
      const st=PRES_ST[p.status]||PRES_ST.borrador;
      const numConceptos=p.grupos.reduce((s,g)=>s+g.conceptos.length,0);
      const conAPU=p.grupos.reduce((s,g)=>s+g.conceptos.filter(c=>c.usaAPU).length,0);
      return <Card key={p.id} style={{marginBottom:12}} onClick={()=>setEditor({presupuesto:p})}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
              <span style={{color:C.muted,fontSize:11,fontWeight:700}}>{p.folio}</span>
              <Bdg label={st.label} color={st.color} bg={st.bg} icon={st.icon}/>
              {conAPU>0&&<Bdg label={`${conAPU} APU`} color="#0D9488" bg="#F0FDFA" icon="⚙"/>}
              {(p.clausulasSelec||[]).length>0&&<Bdg label={`${p.clausulasSelec.length} cláusula${p.clausulasSelec.length>1?"s":""}`} color={C.purple} bg={C.purpleBg} icon="📜"/>}
            </div>
            <div style={{fontWeight:900,fontSize:16}}>{p.cliente}</div>
            {p.obra&&<div style={{color:C.sub,fontSize:13}}>{p.obra}</div>}
            <div style={{color:C.muted,fontSize:12,marginTop:2}}>{fmtD(p.fecha)} · {p.grupos.length} partida{p.grupos.length!==1?"s":""} · {numConceptos} concepto{numConceptos!==1?"s":""}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
            <div>
              <div style={{fontWeight:900,fontSize:18,color:C.accent}}>{cur(getTotal(p))}</div>
              <div style={{fontSize:11,color:C.muted}}>{p.iva?"IVA incluido":"Sin IVA"}</div>
            </div>
            <button onClick={e=>{e.stopPropagation();imprimirPresupuesto(p,getPUof(p));}}
              style={{background:C.dark,border:"none",borderRadius:8,padding:"6px 12px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>🖨 PDF</button>
          </div>
        </div>
      </Card>;
    })}
  </div>;
}

const TIPOS_COBRO = {
  anticipo:   {label:"Anticipo",   icon:"🟢", color:C.green},
  estimacion: {label:"Estimación", icon:"📊", color:C.blue},
  finiquito:  {label:"Finiquito",  icon:"🏁", color:C.purple},
  otro:       {label:"Otro cobro", icon:"💵", color:"#0D9488"},
};
const CAT_GASTO = ["Materiales","Mano de obra","Renta equipo","Fletes","Combustible","Herramienta","Subcontrato","Viáticos","Otros"];
const METODOS = {
  efectivo:{label:"Efectivo",icon:"💵"},
  transferencia:{label:"SPEI",icon:"🏦"},
  cheque:{label:"Cheque",icon:"📃"},
  tarjeta:{label:"Tarjeta",icon:"💳"},
};

function MovModal({onClose,onSave,obras,editMov=null,obraPre=""}) {
  const [tipo,setTipo]=useState(editMov?.tipo||"ingreso");
  const [form,setForm]=useState(editMov||{obraId:obraPre||obras[0]?.id||"",subtipo:"anticipo",categoria:CAT_GASTO[0],concepto:"",monto:"",fecha:today,metodo:"transferencia",status:"realizado"});
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  return <Modal title={editMov?"✏ Editar movimiento":tipo==="ingreso"?"💰 Registrar cobro":"📤 Registrar gasto"} onClose={onClose}>
    {!editMov&&<div style={{display:"flex",background:C.surfaceAlt,borderRadius:12,padding:4,gap:4,marginBottom:16}}>
      {[{v:"ingreso",l:"💰 Cobro"},{v:"egreso",l:"📤 Gasto"}].map(t=>(
        <button key={t.v} onClick={()=>setTipo(t.v)} style={{flex:1,background:tipo===t.v?C.surface:"transparent",border:"none",borderRadius:9,padding:"10px 12px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:tipo===t.v?(t.v==="ingreso"?C.green:C.red):C.muted,boxShadow:tipo===t.v?C.shadow:"none"}}>{t.l}</button>
      ))}
    </div>}
    <Sel label="Obra / Proyecto *" value={form.obraId} onChange={e=>set("obraId",e.target.value)} options={obras.map(o=>({v:o.id,l:`${o.folio} — ${o.nombre}`}))}/>
    {tipo==="ingreso"
      ?<Sel label="Tipo de cobro" value={form.subtipo} onChange={e=>set("subtipo",e.target.value)} options={Object.entries(TIPOS_COBRO).map(([v,{label,icon}])=>({v,l:`${icon} ${label}`}))}/>
      :<Sel label="Categoría de gasto" value={form.categoria} onChange={e=>set("categoria",e.target.value)} options={CAT_GASTO}/>}
    <Inp label="Concepto *" value={form.concepto} onChange={e=>set("concepto",e.target.value)} placeholder={tipo==="ingreso"?"Ej: Anticipo 50% contrato":"Ej: Cemento 20 bultos"}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
      <Inp label="Monto $ *" type="number" value={form.monto} onChange={e=>set("monto",e.target.value)} placeholder="0.00" step="0.01"/>
      <Inp label="Fecha" type="date" value={form.fecha} onChange={e=>set("fecha",e.target.value)}/>
      <Sel label="Método" value={form.metodo} onChange={e=>set("metodo",e.target.value)} options={Object.entries(METODOS).map(([v,{label,icon}])=>({v,l:`${icon} ${label}`}))}/>
      <Sel label="Estatus" value={form.status} onChange={e=>set("status",e.target.value)} options={[{v:"realizado",l:"✅ Realizado"},{v:"pendiente",l:"⏳ Pendiente"}]}/>
    </div>
    <div style={{display:"flex",gap:10,marginTop:6}}>
      <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
      <Btn ch="✅ Guardar" v={tipo==="ingreso"?"green":"primary"} style={{flex:1}} onClick={()=>{
        if(!form.concepto.trim()||!num(form.monto)) return fireToast("⚠ Falta concepto o monto");
        onSave({...form,id:editMov?.id||uid(),tipo,monto:num(form.monto)});
        onClose();
      }}/>
    </div>
  </Modal>;
}

function FinanzasTab({obras,movs,setMovs}) {
  const [vista,setVista]=useState("obras");
  const [obraSel,setObraSel]=useState("todas");
  const [modal,setModal]=useState(false);
  const [editMov,setEditMov]=useState(null);
  const resumenObra=(obraId)=>{
    const m=movs.filter(x=>x.obraId===obraId&&x.status==="realizado");
    const cobrado=m.filter(x=>x.tipo==="ingreso").reduce((s,x)=>s+x.monto,0);
    const gastado=m.filter(x=>x.tipo==="egreso").reduce((s,x)=>s+x.monto,0);
    const pendientes=movs.filter(x=>x.obraId===obraId&&x.status==="pendiente"&&x.tipo==="ingreso").reduce((s,x)=>s+x.monto,0);
    return {cobrado,gastado,utilidad:cobrado-gastado,pendientes};
  };
  const global=useMemo(()=>{
    const realizados=movs.filter(x=>x.status==="realizado");
    const ingresos=realizados.filter(x=>x.tipo==="ingreso").reduce((s,x)=>s+x.monto,0);
    const egresos=realizados.filter(x=>x.tipo==="egreso").reduce((s,x)=>s+x.monto,0);
    const porCobrar=obras.reduce((s,o)=>{const r=resumenObra(o.id);return s+Math.max(0,(o.montoContrato||0)-r.cobrado);},0);
    return {ingresos,egresos,flujo:ingresos-egresos,porCobrar};
  },[movs,obras]);
  const movsFiltrados=useMemo(()=>{
    let r=[...movs].sort((a,b)=>b.fecha.localeCompare(a.fecha));
    if(obraSel!=="todas") r=r.filter(m=>m.obraId===obraSel);
    return r;
  },[movs,obraSel]);
  const saveMov=(mov)=>{setMovs(p=>{const i=p.findIndex(x=>x.id===mov.id);return i>=0?p.map(x=>x.id===mov.id?mov:x):[mov,...p];});fireToast("✅ Movimiento guardado");};
  const delMov=(id)=>{setMovs(p=>p.filter(x=>x.id!==id));fireToast("🗑 Eliminado");};
  return <div style={{padding:"20px 20px 40px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div>
        <div style={{fontWeight:900,fontSize:22}}>Finanzas</div>
        <div style={{color:C.muted,fontSize:13}}>Flujo por obra y global</div>
      </div>
      <Btn ch="+ Movimiento" v="primary" onClick={()=>{setEditMov(null);setModal(true);}}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:18}}>
      {[
        {label:"Ingresos",value:cur(global.ingresos),color:C.green,bg:C.greenBg,icon:"📈"},
        {label:"Egresos",value:cur(global.egresos),color:C.red,bg:C.redBg,icon:"📉"},
        {label:"Flujo neto",value:cur(global.flujo),color:global.flujo>=0?C.green:C.red,bg:global.flujo>=0?C.greenBg:C.redBg,icon:"💰"},
        {label:"Por cobrar",value:cur(global.porCobrar),color:C.orange,bg:C.orangeBg,icon:"⏳"},
      ].map(k=>(
        <div key={k.label} style={{background:k.bg,borderRadius:14,padding:"14px 16px"}}>
          <div style={{fontSize:18,marginBottom:6}}>{k.icon}</div>
          <div style={{fontSize:10,color:k.color,fontWeight:700,letterSpacing:.5,textTransform:"uppercase"}}>{k.label}</div>
          <div style={{fontWeight:900,fontSize:17,color:k.color}}>{k.value}</div>
        </div>
      ))}
    </div>
    <div style={{display:"flex",background:C.surfaceAlt,borderRadius:12,padding:4,gap:4,marginBottom:16}}>
      {[{v:"obras",l:"📊 Por obra"},{v:"movimientos",l:"📋 Movimientos"}].map(t=>(
        <button key={t.v} onClick={()=>setVista(t.v)} style={{flex:1,background:vista===t.v?C.surface:"transparent",border:"none",borderRadius:9,padding:"9px 12px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:vista===t.v?C.accent:C.muted,boxShadow:vista===t.v?C.shadow:"none"}}>{t.l}</button>
      ))}
    </div>
    {vista==="obras"&&obras.map(obra=>{
      const r=resumenObra(obra.id);
      const pctCobrado=obra.montoContrato>0?Math.min(100,Math.round(r.cobrado/obra.montoContrato*100)):0;
      return <Card key={obra.id} style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div>
            <div style={{fontSize:11,color:C.muted,fontWeight:700}}>{obra.folio}</div>
            <div style={{fontWeight:800,fontSize:15}}>{obra.nombre}</div>
            <div style={{fontSize:12,color:C.muted}}>{obra.cliente}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,color:C.muted}}>Contrato</div>
            <div style={{fontWeight:900,fontSize:16}}>{cur(obra.montoContrato)}</div>
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontSize:11,color:C.muted,fontWeight:700}}>COBRADO VS CONTRATO</span>
            <span style={{fontSize:11,fontWeight:800,color:C.blue}}>{pctCobrado}%</span>
          </div>
          <div style={{height:8,background:C.surfaceAlt,borderRadius:4,overflow:"hidden"}}>
            <div style={{width:`${pctCobrado}%`,height:"100%",background:C.blue,borderRadius:4,transition:"width .4s"}}/>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8}}>
          {[
            {label:"Cobrado",value:cur(r.cobrado),color:C.green,bg:C.greenBg},
            {label:"Gastado",value:cur(r.gastado),color:C.red,bg:C.redBg},
            {label:"Utilidad",value:cur(r.utilidad),color:r.utilidad>=0?C.green:C.red,bg:r.utilidad>=0?C.greenBg:C.redBg},
            {label:"Por cobrar",value:cur(Math.max(0,obra.montoContrato-r.cobrado)),color:C.orange,bg:C.orangeBg},
          ].map(f=>(
            <div key={f.label} style={{background:f.bg,borderRadius:10,padding:"8px 10px"}}>
              <div style={{fontSize:9,color:f.color,fontWeight:700,textTransform:"uppercase"}}>{f.label}</div>
              <div style={{fontWeight:800,fontSize:12,color:f.color}}>{f.value}</div>
            </div>
          ))}
        </div>
        {r.pendientes>0&&<div style={{marginTop:10,background:C.orangeBg,borderRadius:10,padding:"8px 12px",fontSize:12,fontWeight:700,color:C.orange}}>⏳ {cur(r.pendientes)} en cobros pendientes</div>}
        <Btn ch="+ Movimiento en esta obra" v="ghost" sm style={{width:"100%",marginTop:10}}
          onClick={()=>{setEditMov({obraId:obra.id,_pre:true});setModal(true);}}/>
      </Card>;
    })}
    {vista==="movimientos"&&<>
      <div style={{display:"flex",gap:8,marginBottom:14,overflowX:"auto",paddingBottom:4}}>
        {[{id:"todas",folio:"Todas"},...obras].map(o=>(
          <button key={o.id} onClick={()=>setObraSel(o.id)} style={{background:obraSel===o.id?C.accentBg:"transparent",border:`1.5px solid ${obraSel===o.id?C.accent:C.border}`,color:obraSel===o.id?C.accent:C.muted,borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>{o.folio}</button>
        ))}
      </div>
      {movsFiltrados.length===0&&<Card style={{textAlign:"center",padding:40}}><div style={{fontSize:40,marginBottom:10}}>💸</div><div style={{fontWeight:700,color:C.muted}}>Sin movimientos</div></Card>}
      {movsFiltrados.map(m=>{
        const obra=obras.find(o=>o.id===m.obraId);
        const esIngreso=m.tipo==="ingreso";
        const sub=esIngreso?TIPOS_COBRO[m.subtipo]:null;
        return <Card key={m.id} style={{marginBottom:10,borderLeft:`3px solid ${esIngreso?C.green:C.red}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:3,flexWrap:"wrap"}}>
                {sub&&<Bdg label={sub.label} color={sub.color} icon={sub.icon}/>}
                {!esIngreso&&<Bdg label={m.categoria} color={C.purple} bg={C.purpleBg}/>}
                {m.status==="pendiente"&&<Bdg label="Pendiente" color={C.orange} bg={C.orangeBg} icon="⏳"/>}
              </div>
              <div style={{fontWeight:700,fontSize:14}}>{m.concepto}</div>
              <div style={{fontSize:12,color:C.muted,marginTop:2}}>{fmtD(m.fecha)} · {obra?.folio||"—"} · {METODOS[m.metodo]?.icon} {METODOS[m.metodo]?.label}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{fontWeight:900,fontSize:16,color:esIngreso?C.green:C.red,whiteSpace:"nowrap"}}>{esIngreso?"+":"−"}{cur(m.monto)}</div>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                <button onClick={()=>{setEditMov(m);setModal(true);}} style={{background:C.blueBg,border:"none",borderRadius:7,padding:"4px 8px",color:C.blue,fontSize:11,fontWeight:700,cursor:"pointer"}}>✏</button>
                <button onClick={()=>delMov(m.id)} style={{background:C.redBg,border:"none",borderRadius:7,padding:"4px 8px",color:C.red,fontSize:11,fontWeight:700,cursor:"pointer"}}>🗑</button>
              </div>
            </div>
          </div>
        </Card>;
      })}
    </>}
    {modal&&<MovModal onClose={()=>{setModal(false);setEditMov(null);}} onSave={saveMov} obras={obras}
      editMov={editMov?._pre?null:editMov} obraPre={editMov?._pre?editMov.obraId:""}/>}
  </div>;
}

// COMINS INDUSTRIAL — Parte 5: Compras (solicitud→aprobación→orden→recepción)

const UNIDADES_COMPRA = ["PZA","BULTO","M","M2","M3","ML","KG","TON","LT","CAJA","ROLLO","JGO","LOTE"];

const COMPRA_ST = {
  solicitada: {label:"Solicitada", color:"#D03801", bg:"#FFF8F1", icon:"📩", paso:1},
  aprobada:   {label:"Aprobada",   color:"#3F83F8", bg:"#EBF5FF", icon:"👍", paso:2},
  ordenada:   {label:"Ordenada",   color:"#9061F9", bg:"#F6F5FF", icon:"🛒", paso:3},
  recibida:   {label:"Recibida",   color:"#0E9F6E", bg:"#F3FAF7", icon:"📦", paso:4},
  rechazada:  {label:"Rechazada",  color:"#F05252", bg:"#FDF2F2", icon:"❌", paso:0},
};

const URGENCIAS = {
  normal:  {label:"Normal",  color:"#9CA3AF", bg:"#F2F4F7"},
  urgente: {label:"Urgente", color:"#D03801", bg:"#FFF8F1"},
  critica: {label:"Crítica", color:"#F05252", bg:"#FDF2F2"},
};

function FlowStepper({status}) {
  const pasos=[
    {key:"solicitada",label:"Solicitada",icon:"📩"},
    {key:"aprobada",label:"Aprobada",icon:"👍"},
    {key:"ordenada",label:"Ordenada",icon:"🛒"},
    {key:"recibida",label:"Recibida",icon:"📦"},
  ];
  const pasoActual=COMPRA_ST[status]?.paso||0;
  if(status==="rechazada") return <div style={{background:C.redBg,borderRadius:10,padding:"8px 14px",textAlign:"center",color:C.red,fontWeight:700,fontSize:12}}>❌ Solicitud rechazada</div>;
  return <div style={{display:"flex",alignItems:"center",gap:0}}>
    {pasos.map((p,i)=>{
      const done=i+1<=pasoActual;
      return <div key={p.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",position:"relative"}}>
        {i>0&&<div style={{position:"absolute",left:"-50%",top:13,width:"100%",height:2.5,background:done?C.green:C.border,zIndex:0}}/>}
        <div style={{width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,zIndex:1,background:done?C.green:C.surfaceAlt,border:`2px solid ${done?C.green:C.border}`,color:done?"#fff":C.muted}}>{done?"✓":p.icon}</div>
        <div style={{fontSize:9,fontWeight:700,marginTop:4,color:done?C.green:C.muted}}>{p.label}</div>
      </div>;
    })}
  </div>;
}

function SolicitudModal({onClose,onSave,obras,usuario,editSol=null,folioNext="SC-001"}) {
  const [form,setForm]=useState(editSol||{obraId:obras[0]?.id||"",urgencia:"normal",notas:""});
  const [items,setItems]=useState(editSol?.items||[{id:uid(),desc:"",unidad:"PZA",cantidad:1,precio:""}]);
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const addItem=()=>setItems(p=>[...p,{id:uid(),desc:"",unidad:"PZA",cantidad:1,precio:""}]);
  const setItem=(id,c,v)=>setItems(p=>p.map(i=>i.id===id?{...i,[c]:v}:i));
  const delItem=(id)=>setItems(p=>p.filter(i=>i.id!==id));
  const esSupervisor=usuario?.rol==="supervisor";
  return <Modal title={editSol?"✏ Editar solicitud":"📩 Nueva solicitud de compra"} onClose={onClose} wide>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
      <Sel label="Obra *" value={form.obraId} onChange={e=>set("obraId",e.target.value)} options={obras.map(o=>({v:o.id,l:`${o.folio} — ${o.nombre}`}))}/>
      <Sel label="Urgencia" value={form.urgencia} onChange={e=>set("urgencia",e.target.value)} options={Object.entries(URGENCIAS).map(([v,{label}])=>({v,l:label}))}/>
    </div>
    <Lbl t="Materiales solicitados"/>
    {items.map(item=>(
      <div key={item.id} style={{display:"grid",gridTemplateColumns:esSupervisor?"1fr 75px 70px 30px":"1fr 75px 70px 90px 30px",gap:6,marginBottom:6,alignItems:"center"}}>
        <input value={item.desc} onChange={e=>setItem(item.id,"desc",e.target.value)} placeholder="Descripción del material"
          style={{background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"9px 11px",fontSize:13,fontFamily:"inherit",color:C.text}}/>
        <select value={item.unidad} onChange={e=>setItem(item.id,"unidad",e.target.value)}
          style={{background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"9px 4px",fontSize:12,fontFamily:"inherit",color:C.text}}>
          {UNIDADES_COMPRA.map(u=><option key={u} value={u}>{u}</option>)}
        </select>

function ComprasTab({compras,setCompras,obras,usuario}) {
  const [filtro,setFiltro]=useState("activas");
  const [obraSel,setObraSel]=useState("todas");
  const [modal,setModal]=useState(false);
  const [detalle,setDetalle]=useState(null);
  const rol=usuario?.rol;
  const filtradas=useMemo(()=>{
    let r=[...compras].sort((a,b)=>b.fecha.localeCompare(a.fecha));
    if(obraSel!=="todas") r=r.filter(c=>c.obraId===obraSel);
    if(filtro==="activas") r=r.filter(c=>!["recibida","rechazada"].includes(c.status));
    else if(filtro!=="todas") r=r.filter(c=>c.status===filtro);
    return r;
  },[compras,filtro,obraSel]);
  const totalObra=useMemo(()=>{
    if(obraSel==="todas") return null;
    return compras.filter(c=>c.obraId===obraSel&&["aprobada","ordenada","recibida"].includes(c.status))
      .reduce((s,c)=>s+c.items.reduce((s2,i)=>s2+num(i.cantidad)*num(i.precio),0),0);
  },[compras,obraSel]);
  const save=(sol)=>{
    setCompras(p=>{const i=p.findIndex(x=>x.id===sol.id);return i>=0?p.map(x=>x.id===sol.id?sol:x):[sol,...p];});
    fireToast("✅ Guardado");
  };
  const pendientesCount=compras.filter(c=>c.status==="solicitada").length;
  return <div style={{padding:"20px 20px 40px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div>
        <div style={{fontWeight:900,fontSize:22}}>Compras</div>
        <div style={{color:C.muted,fontSize:13}}>{pendientesCount>0?`${pendientesCount} solicitud${pendientesCount>1?"es":""} por aprobar`:"Sin pendientes"}</div>
      </div>
      <Btn ch="+ Solicitud" v="primary" onClick={()=>setModal(true)}/>
    </div>
    {/* Filtro por proyecto/obra */}
    <div style={{display:"flex",gap:8,marginBottom:10,overflowX:"auto",paddingBottom:4}}>
      {[{id:"todas",folio:"🏗 Todas las obras"},...obras].map(o=>(
        <button key={o.id} onClick={()=>setObraSel(o.id)}
          style={{background:obraSel===o.id?C.accentBg:"transparent",border:`1.5px solid ${obraSel===o.id?C.accent:C.border}`,color:obraSel===o.id?C.accent:C.muted,borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>
          {o.id==="todas"?o.folio:`${o.folio} — ${(o.nombre||"").slice(0,18)}${(o.nombre||"").length>18?"…":""}`}
        </button>
      ))}
    </div>
    {obraSel!=="todas"&&totalObra!==null&&rol!=="supervisor"&&(
      <div style={{background:C.blueBg,borderRadius:12,padding:"10px 16px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:13,fontWeight:700,color:C.blue}}>💰 Total comprado en esta obra</span>
        <span style={{fontSize:16,fontWeight:900,color:C.blue}}>{cur(totalObra)}</span>
      </div>
    )}
    <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
      {[{v:"activas",label:"Activas",color:C.text},{v:"todas",label:"Todas",color:C.text},...Object.entries(COMPRA_ST).map(([v,s])=>({v,...s}))].map(s=>(
        <button key={s.v} onClick={()=>setFiltro(s.v)}
          style={{background:filtro===s.v?(s.bg||C.surfaceAlt):"transparent",border:`1.5px solid ${filtro===s.v?s.color:C.border}`,color:filtro===s.v?s.color:C.muted,borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>
          {s.icon||""} {s.label}
        </button>
      ))}
    </div>
    {filtradas.length===0&&<Card style={{textAlign:"center",padding:40}}><div style={{fontSize:40,marginBottom:10}}>🛒</div><div style={{fontWeight:700,color:C.muted}}>Sin solicitudes en este filtro</div></Card>}
    {filtradas.map(sol=>{
      const st=COMPRA_ST[sol.status];
      const urg=URGENCIAS[sol.urgencia];
      const obra=obras.find(o=>o.id===sol.obraId);
      const total=sol.items.reduce((s,i)=>s+num(i.cantidad)*num(i.precio),0);
      return <Card key={sol.id} style={{marginBottom:12}} onClick={()=>setDetalle(sol)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
              <span style={{color:C.muted,fontSize:11,fontWeight:700}}>{sol.folio}</span>
              <Bdg label={st.label} color={st.color} bg={st.bg} icon={st.icon}/>
              {sol.urgencia!=="normal"&&<Bdg label={urg.label} color={urg.color} bg={urg.bg} icon="⚡"/>}
            </div>
            <div style={{fontWeight:800,fontSize:14,marginBottom:2}}>
              {sol.items.length} material{sol.items.length!==1?"es":""} — {sol.items.slice(0,2).map(i=>i.desc).join(", ")}{sol.items.length>2?"...":""}
            </div>
            <div style={{fontSize:12,color:C.muted}}>🏗 {obra?.folio} · {sol.solicitante} · {fmtD(sol.fecha)}</div>
          </div>
          {rol!=="supervisor"&&total>0&&(
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:10,color:C.muted}}>Estimado</div>

            </div>

        </div>
        <FlowStepper status={sol.status}/>
      </Card>;
    })}
    {modal&&<SolicitudModal onClose={()=>setModal(false)} onSave={save} obras={obras} usuario={usuario} folioNext={nextFolio(compras,"SC")}/>}
    {detalle&&<SolicitudDetalle sol={detalle} onClose={()=>setDetalle(null)} onSave={save} obras={obras} usuario={usuario}/>}
  </div>;
}

function semanaActual() {
  const d = new Date();
  const dia = d.getDay()||7;
  const lunes = new Date(d); lunes.setDate(d.getDate()-dia+1);
  const dias = [];
  for(let i=0;i<7;i++){
    const x = new Date(lunes); x.setDate(lunes.getDate()+i);
    dias.push(x.toISOString().split("T")[0]);
  }
  return dias;
}
const DIAS_CORTOS = ["L","M","M","J","V","S","D"];

    const key=`${empId}_${fecha}`;
    setAsistencia(p=>({...p,[key]:!p[key]}));

  const nominaSemana=(emp)=>{
    const diasTrabajados=dias.filter(d=>asistencia[`${emp.id}_${d}`]).length;

  const saveEmp=(emp)=>{

          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
            {dias.map((d,i)=>{
              const marcado=asistencia[`${emp.id}_${d}`];
              const esHoy=d===today;
              return <button key={d} onClick={()=>toggleAsistencia(emp.id,d)}
                style={{background:marcado?C.green:C.surfaceAlt,border:`2px solid ${esHoy?C.accent:marcado?C.green:C.border}`,borderRadius:10,padding:"8px 2px",cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:2,transition:"all .15s"}}>
                <span style={{fontSize:10,fontWeight:700,color:marcado?"#ffffffbb":C.muted}}>{DIAS_CORTOS[i]}</span>
                <span style={{fontSize:13,fontWeight:800,color:marcado?"#fff":C.sub}}>{d.split("-")[2]}</span>
              </button>;
            })}
          </div>
        </Card>;
      })}
    </>}
    {vista==="destajos"&&<>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
        <Btn ch="+ Destajo" v="primary" sm onClick={()=>setModalDest(true)}/>
      </div>
      {destajos.length===0&&<Card style={{textAlign:"center",padding:32}}><div style={{fontSize:32,marginBottom:8}}>🔨</div><div style={{fontWeight:700,color:C.muted}}>Sin destajos</div></Card>}
      {destajos.map(d=>{
        const emp=empleados.find(e=>e.id===d.empleadoId);
        const obra=obras.find(o=>o.id===d.obraId);
        const stColors={asignado:{c:C.blue,bg:C.blueBg,l:"Asignado",i:"📋"},terminado:{c:C.orange,bg:C.orangeBg,l:"Terminado — por pagar",i:"✅"},pagado:{c:C.green,bg:C.greenBg,l:"Pagado",i:"💵"}};
        const st=stColors[d.status];
        return <Card key={d.id} style={{marginBottom:10,borderLeft:`3px solid ${st.c}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:8}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:6,marginBottom:4,flexWrap:"wrap"}}>
                <Bdg label={st.l} color={st.c} bg={st.bg} icon={st.i}/>
                <Bdg label={obra?.folio||"—"} color={C.purple} bg={C.purpleBg}/>
              </div>
              <div style={{fontWeight:700,fontSize:14}}>{d.desc}</div>
              <div style={{fontSize:12,color:C.muted,marginTop:2}}>👷 {emp?.nombre||"—"} · {fmtD(d.fecha)}</div>
            </div>
            {verMontos&&<div style={{fontWeight:900,fontSize:16,color:st.c,whiteSpace:"nowrap"}}>{cur(d.monto)}</div>}
          </div>
          <div style={{display:"flex",gap:8}}>
            {d.status==="asignado"&&<Btn ch="✅ Marcar terminado" v="ghost" sm style={{flex:1}} onClick={()=>cambiarStatusDestajo(d.id,"terminado")}/>}
            {d.status==="terminado"&&verMontos&&<Btn ch="💵 Marcar pagado" v="green" sm style={{flex:1}} onClick={()=>cambiarStatusDestajo(d.id,"pagado")}/>}
          </div>
        </Card>;
      })}
    </>}
    {vista==="plantilla"&&<>
      {empleados.map(emp=>{
        const obra=obras.find(o=>o.id===emp.obraId);
        return <Card key={emp.id} style={{marginBottom:10,opacity:emp.activo?1:.5}} onClick={verMontos?()=>{setEditEmp(emp);setModalEmp(true);}:undefined}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:3}}>
                <span style={{fontWeight:800,fontSize:14}}>{emp.nombre}</span>
                <Bdg label={emp.tipo==="jornal"?"Jornal":"Destajo"} color={emp.tipo==="jornal"?C.blue:C.orange} bg={emp.tipo==="jornal"?C.blueBg:C.orangeBg} icon={emp.tipo==="jornal"?"📅":"🔨"}/>
                {!emp.activo&&<Bdg label="Inactivo" color={C.muted} bg={C.surfaceAlt}/>}
              </div>
              <div style={{fontSize:12,color:C.muted}}>{emp.puesto} · 🏗 {obra?.folio||"Sin obra"}</div>
            </div>
            {verMontos&&emp.tipo==="jornal"&&(
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:10,color:C.muted}}>Por día</div>
                <div style={{fontWeight:900,fontSize:15}}>{cur(emp.salarioDia)}</div>
              </div>
            )}
          </div>
        </Card>;
      })}
    </>}
    {modalEmp&&<EmpleadoModal onClose={()=>{setModalEmp(false);setEditEmp(null);}} onSave={saveEmp} obras={obras} editEmp={editEmp}/>}
    {modalDest&&<DestajoModal onClose={()=>setModalDest(false)} obras={obras} empleados={empleados} verMontos={verMontos}
      onSave={(d)=>{setDestajos(p=>[d,...p]);fireToast("✅ Destajo asignado");}}/>}
  </div>;
}

function InventarioModal({onClose,onSave,obras,editItem=null}) {
  const [form,setForm]=useState(editItem||{nombre:"",unidad:"PZA",cantidad:"",min:"",obraId:obras[0]?.id||"",categoria:"Material"});
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  return <Modal title={editItem?"✏ Editar artículo":"📦 Nuevo artículo"} onClose={onClose}>
    <Inp label="Nombre *" value={form.nombre} onChange={e=>set("nombre",e.target.value)} placeholder="Ej: Cable THHN #12"/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
      <Sel label="Categoría" value={form.categoria} onChange={e=>set("categoria",e.target.value)} options={["Material","Herramienta","Consumible","Equipo"]}/>
      <Sel label="Unidad" value={form.unidad} onChange={e=>set("unidad",e.target.value)} options={["PZA","BULTO","M","ML","KG","LT","CAJA","ROLLO","JGO","LOTE"]}/>
      <Inp label="Cantidad actual" type="number" value={form.cantidad} onChange={e=>set("cantidad",e.target.value)} placeholder="0"/>
      <Inp label="Stock mínimo" type="number" value={form.min} onChange={e=>set("min",e.target.value)} placeholder="0"/>
    </div>
    <Sel label="Obra" value={form.obraId} onChange={e=>set("obraId",e.target.value)} options={obras.map(o=>({v:o.id,l:`${o.folio} — ${o.nombre}`}))}/>
    <div style={{display:"flex",gap:10,marginTop:6}}>
      <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
      <Btn ch="✅ Guardar" v="primary" style={{flex:1}} onClick={()=>{
        if(!form.nombre.trim()) return fireToast("⚠ Falta el nombre");
        onSave({...form,id:editItem?.id||uid(),cantidad:num(form.cantidad),min:num(form.min)});
        onClose();
      }}/>
    </div>
  </Modal>;
}

function InventarioTab({inventario,setInventario,obras}) {
  const [obraSel,setObraSel]=useState("todas");
  const [modal,setModal]=useState(false);
  const [editItem,setEditItem]=useState(null);
  const filtrados=obraSel==="todas"?inventario:inventario.filter(i=>i.obraId===obraSel);
  const bajos=inventario.filter(i=>i.cantidad<=i.min);
  const ajustar=(id,delta)=>setInventario(p=>p.map(i=>i.id===id?{...i,cantidad:Math.max(0,i.cantidad+delta)}:i));
  const save=(item)=>{
    setInventario(p=>{const i=p.findIndex(x=>x.id===item.id);return i>=0?p.map(x=>x.id===item.id?item:x):[item,...p];});
    fireToast("✅ Guardado");
  };
  return <div style={{padding:"20px 20px 40px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div>
        <div style={{fontWeight:900,fontSize:22}}>Inventario</div>
        <div style={{color:C.muted,fontSize:13}}>{inventario.length} artículo{inventario.length!==1?"s":""} en control</div>
      </div>
      <Btn ch="+ Artículo" v="primary" onClick={()=>{setEditItem(null);setModal(true);}}/>
    </div>
    {bajos.length>0&&(
      <div style={{background:C.redBg,border:`1px solid ${C.red}33`,borderRadius:14,padding:"12px 16px",marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:22}}>⚠</span>
        <div>
          <div style={{fontWeight:800,fontSize:13,color:C.red}}>{bajos.length} artículo{bajos.length>1?"s":""} en stock bajo</div>
          <div style={{fontSize:12,color:C.sub}}>{bajos.map(b=>b.nombre).join(", ")}</div>
        </div>
      </div>
    )}
    <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
      {[{id:"todas",folio:"Todas"},...obras].map(o=>(
        <button key={o.id} onClick={()=>setObraSel(o.id)}
          style={{background:obraSel===o.id?C.accentBg:"transparent",border:`1.5px solid ${obraSel===o.id?C.accent:C.border}`,color:obraSel===o.id?C.accent:C.muted,borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>{o.folio}</button>
      ))}
    </div>
    {filtrados.length===0&&<Card style={{textAlign:"center",padding:40}}><div style={{fontSize:40,marginBottom:10}}>📦</div><div style={{fontWeight:700,color:C.muted}}>Sin artículos</div></Card>}
    {filtrados.map(item=>{
      const bajo=item.cantidad<=item.min;
      const obra=obras.find(o=>o.id===item.obraId);
      return <Card key={item.id} style={{marginBottom:10,borderLeft:bajo?`3px solid ${C.red}`:"none"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
          <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>{setEditItem(item);setModal(true);}}>
            <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:3,flexWrap:"wrap"}}>
              <span style={{fontWeight:800,fontSize:14}}>{item.nombre}</span>
              <Bdg label={item.categoria} color={item.categoria==="Herramienta"?C.purple:"#0694A2"} bg={item.categoria==="Herramienta"?C.purpleBg:"#EDFAFA"} icon={item.categoria==="Herramienta"?"🔧":"🧱"}/>
              {bajo&&<Bdg label="Stock bajo" color={C.red} bg={C.redBg} icon="⚠"/>}
            </div>
            <div style={{fontSize:12,color:C.muted}}>🏗 {obra?.folio||"—"} · Mínimo: {item.min} {item.unidad}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={()=>ajustar(item.id,-1)} style={{background:C.redBg,border:"none",borderRadius:9,width:32,height:32,color:C.red,fontSize:16,fontWeight:800,cursor:"pointer"}}>−</button>
            <div style={{textAlign:"center",minWidth:52}}>
              <div style={{fontWeight:900,fontSize:18,color:bajo?C.red:C.text}}>{item.cantidad}</div>
              <div style={{fontSize:9,color:C.muted,fontWeight:700}}>{item.unidad}</div>
            </div>
            <button onClick={()=>ajustar(item.id,1)} style={{background:C.greenBg,border:"none",borderRadius:9,width:32,height:32,color:C.green,fontSize:16,fontWeight:800,cursor:"pointer"}}>+</button>
          </div>
        </div>
      </Card>;
    })}
    {modal&&<InventarioModal onClose={()=>{setModal(false);setEditItem(null);}} onSave={save} obras={obras} editItem={editItem}/>}
  </div>;
}
