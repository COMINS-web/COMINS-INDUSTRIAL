        var l = document.getElementById('loader'); if(l) l.style.display = 'none';
      } catch(e){}
    });

  <script type="text/babel" data-presets="env,react">
// ═══════════════════════════════════════════════════════════════
// COMINS INDUSTRIAL — Sistema Operativo
// Parte 1: Base + Login + Dashboard
// ═══════════════════════════════════════════════════════════════

const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ── FIREBASE helpers ─────────────────────────────────────────────
function fbCol(col) {
  return window._db ? window._db.collection(col) : null;
}
function fbSet(col, key, val) {
  try { if(window._db) window._db.collection(col).doc(key).set({v: val}); } catch(e){ console.warn("fbSet:",e); }
}
function fbGet(col, key, cb) {
  try {
    if(window._db) window._db.collection(col).doc(key).get()
      .then(d => { if(d.exists) cb(d.data().v); })
      .catch(e => console.warn("fbGet:",e));
  } catch(e){ console.warn("fbGet:",e); }
}

// ── useStored: Firebase + localStorage (v2 robusta) ─────────────
// Protecciones contra pérdida de datos:
//  1. Cada guardado lleva un número de revisión (rev). Un snapshot con rev
//     más viejo que el local NUNCA sobrescribe (mata la condición de carrera).
//  2. Los ecos locales de Firestore (hasPendingWrites) se ignoran.
//  3. Si el documento no existe en la nube pero hay datos locales, se SUBEN
//     a la nube — jamás se borra lo local con el seed vacío.
//  4. Contador de escrituras pendientes (no booleano) para ráfagas de cambios.
function useStored(key, seed, colName="comins_data") {
  const [val, setVal] = useState(() => {
    try {
      const s = localStorage.getItem("comins:"+key);
      if(s !== null) {
        const parsed = JSON.parse(s);
        // Formato nuevo {v, rev} o formato viejo (valor directo)
        if(parsed && typeof parsed === "object" && "v" in parsed && "rev" in parsed) return parsed.v;
        return parsed;
      }
    } catch(e){}
    return seed;
  });
  const [ready, setReady] = useState(false);
  const revRef = useRef((() => {
    try {
      const s = localStorage.getItem("comins:"+key);
      if(s !== null) { const p = JSON.parse(s); if(p && typeof p==="object" && "rev" in p) return p.rev; }
    } catch(e){}
    return 0;
  })());
  const pendingRef = useRef(0);
  const valRef = useRef(val);
  useEffect(() => { valRef.current = val; }, [val]);

  const persistLocal = (v, rev) => {
    try { localStorage.setItem("comins:"+key, JSON.stringify({v, rev})); } catch(e){}
  };

  const pushToCloud = (v, rev) => {
    pendingRef.current++;
    try {
      if(window._db) {
        window._db.collection(colName).doc(key).set({v, rev})
          .then(() => { pendingRef.current = Math.max(0, pendingRef.current-1); })
          .catch((e) => {
            pendingRef.current = Math.max(0, pendingRef.current-1);
            console.warn("Firestore write error ["+key+"]:", e);
            fireToast("⚠ Sin conexión — cambio guardado localmente");
          });
      } else { pendingRef.current = Math.max(0, pendingRef.current-1); }
    } catch(e) { pendingRef.current = Math.max(0, pendingRef.current-1); }
  };

  useEffect(() => {
    let unsub;
    const t = setTimeout(() => setReady(true), 5000);
    try {
      if(window._db) {
        unsub = window._db.collection(colName).doc(key).onSnapshot(
          { includeMetadataChanges: false },
          doc => {
            clearTimeout(t); setReady(true);
            // Ignorar ecos de escrituras propias aún no confirmadas por el servidor
            if(doc.metadata && doc.metadata.hasPendingWrites) return;
            // Si tenemos escrituras en vuelo, no aceptar snapshots (llegará el definitivo)
            if(pendingRef.current > 0) return;
            if(doc.exists && doc.data() && doc.data().v !== undefined) {
              const data = doc.data();
              const rev = data.rev || 0;
              // Solo aplicar si es igual o más nuevo que lo local
              if(rev >= revRef.current) {
                revRef.current = rev;
                setVal(data.v); valRef.current = data.v;
                persistLocal(data.v, rev);
              }
            } else {
              // El doc NO existe en la nube. Si hay datos locales, subirlos. NUNCA borrar.
              const local = valRef.current;
              const hasLocal = Array.isArray(local) ? local.length > 0
                : (local && typeof local === "object") ? Object.keys(local).length > 0
                : local !== undefined && local !== null && local !== "";
              if(hasLocal) {
                const rev = revRef.current || Date.now();
                revRef.current = rev;
                pushToCloud(local, rev);
              }
            }
          },
          err => { clearTimeout(t); setReady(true); console.warn("Firestore read error ["+key+"]:", err); }
        );
      } else { clearTimeout(t); setReady(true); }
    } catch(e) { clearTimeout(t); setReady(true); }
    return () => { clearTimeout(t); if(unsub) unsub(); };
  }, [key]);

  const save = useCallback(updater => {
    const next = typeof updater === "function" ? updater(valRef.current) : updater;
    const rev = Math.max(Date.now(), revRef.current + 1); // monotónico
    revRef.current = rev;
    setVal(next); valRef.current = next;
    persistLocal(next, rev);
    pushToCloud(next, rev);
  }, [key]);

  return [val, save, ready];
}

function fireToast(msg) {
  window.__toastMsg = msg;
  window.dispatchEvent(new Event("showtoast"));
}

// Folio secuencial irrepetible: busca el máximo existente y suma 1
function nextFolio(list, prefix) {
  const max = (list||[]).reduce((m,x) => {
    const n = parseInt(String(x.folio||"").split("-").pop());
    return isNaN(n) ? m : Math.max(m,n);
  }, 0);
  return prefix + "-" + String(max+1).padStart(3,"0");
}

function Toast() {
  const [msg, setMsg] = useState("");
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const fn = () => { setMsg(window.__toastMsg||""); setVis(true); setTimeout(()=>setVis(false),2800); };
    window.addEventListener("showtoast", fn);
    return () => window.removeEventListener("showtoast", fn);
  }, []);
  return (
    <div style={{
      position:"fixed", bottom:24, left:"50%", transform:`translateX(-50%) translateY(${vis?0:20}px)`,
      background:C.dark, color:"#fff", padding:"11px 22px", borderRadius:12,
      fontSize:14, fontWeight:600, boxShadow:C.shadowLg,
      opacity:vis?1:0, transition:"all .25s", pointerEvents:"none", zIndex:9999,
      whiteSpace:"nowrap", maxWidth:"90vw"
    }}>{msg}</div>
  );
}

function Card({children, style={}, onClick}) {
  const [hov, setHov] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{
        background:C.surface, border:`1px solid ${C.border}`, borderRadius:14,
        padding:"16px 18px", boxShadow:hov&&onClick?C.shadowMd:C.shadow,
        transition:"box-shadow .15s, transform .15s",
        transform:hov&&onClick?"translateY(-1px)":"none",
        cursor:onClick?"pointer":"default", ...style
      }}
    >{children}</div>
  );
}

function Btn({ch, onClick, v="primary", sm=false, style={}, disabled=false}) {
  const [hov, setHov] = useState(false);
  const base = {
    border:"none", borderRadius:9, fontFamily:"inherit", fontWeight:700,
    cursor:disabled?"not-allowed":"pointer", display:"inline-flex", alignItems:"center",
    justifyContent:"center", gap:6, transition:"all .15s",
    padding: sm?"7px 14px":"10px 20px", fontSize: sm?12:14,
    opacity: disabled?0.5:1,
  };
  const variants = {
    primary: { background:hov?C.accentD:C.accent, color:"#fff" },
    ghost:   { background:hov?C.surfaceAlt:"transparent", color:C.sub, border:`1.5px solid ${C.border}` },
    danger:  { background:hov?"#B91C1C":C.red, color:"#fff" },
    green:   { background:hov?"#15803D":C.green, color:"#fff" },
    dark:    { background:hov?C.surfaceAlt:C.surface, color:C.text, border:`1.5px solid ${C.borderStrong}` },
    soft:    { background:hov?C.accentBg:"#FEF5F5", color:C.accent, border:`1.5px solid ${C.accentBg}` },
  };
  return (
    <button
      onClick={disabled?undefined:onClick}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{...base, ...variants[v]||variants.primary, ...style}}
    >{ch}</button>
  );
}

function Inp({label, value, onChange, placeholder="", type="text", style={}, ...rest}) {
  return (
    <div style={{marginBottom:12}}>
      {label && <div style={{color:C.muted, fontSize:11, fontWeight:700, letterSpacing:.5, textTransform:"uppercase", marginBottom:5}}>{label}</div>}
      <input
        type={type} value={value} onChange={onChange} placeholder={placeholder}
        style={{
          width:"100%", background:C.surfaceAlt, border:`1.5px solid ${C.border}`,
          borderRadius:9, padding:"10px 13px", fontSize:14, fontFamily:"inherit",
          color:C.text, boxSizing:"border-box", ...style
        }}
        {...rest}
      />
    </div>
  );
}

function Lbl({t}) {
  return <div style={{color:C.muted, fontSize:11, fontWeight:700, letterSpacing:.5, textTransform:"uppercase", marginBottom:5}}>{t}</div>;
}

function Modal({title, onClose, children, wide=false}) {
  useEffect(() => {
    const fn = e => e.key==="Escape" && onClose();
    document.addEventListener("keydown", fn);
    return () => document.removeEventListener("keydown", fn);
  }, [onClose]);
  return (
    <div style={{
      position:"fixed", inset:0, background:"rgba(0,0,0,.45)", zIndex:1000,
      display:"flex", alignItems:"flex-end", justifyContent:"center",
      backdropFilter:"blur(2px)"
    }} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{
        background:C.surface, borderRadius:"20px 20px 0 0", width:"100%",
        maxWidth: wide?720:520, maxHeight:"92vh", overflow:"auto",
        boxShadow:C.shadowLg, padding:"20px 20px 32px"
      }}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18}}>
          <div style={{fontWeight:800, fontSize:17, color:C.text}}>{title}</div>
          <button onClick={onClose} style={{background:C.surfaceAlt, border:"none", borderRadius:8, width:32, height:32, cursor:"pointer", fontSize:16, color:C.muted}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Bdg({label, color, bg, icon}) {
  return (
    <span style={{background:bg||color+"18", color, borderRadius:7, padding:"3px 9px", fontSize:11, fontWeight:700, display:"inline-flex", alignItems:"center", gap:4}}>
      {icon}{label}
    </span>
  );
}

  const [usuario, setUsuario] = useState("");
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const pinRef = useRef();

  const entrar = () => {
    if(!usuario || !pin) return;
    setError(""); setLoading(true);
    setTimeout(() => {
      const lista = (usuarios&&usuarios.length) ? usuarios : USUARIOS_DEFAULT;
      const u = lista.find(x => x.usuario.toLowerCase() === usuario.toLowerCase() && String(x.pin) === String(pin));
      if(u) { onLogin(u); fireToast(`Bienvenido, ${u.nombre} 👋`); }
      else  { setError("Usuario o PIN incorrecto"); setPin(""); }
      setLoading(false);
    }, 400);
  };

  return (
    <div style={{
      minHeight:"100vh", background:C.bg,
      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
      padding:24, fontFamily:"'Inter',-apple-system,'Segoe UI',sans-serif", position:"relative", overflow:"hidden"
    }}>
      {/* Banda chevrón diagonal — firma de marca COMINS */}
      <div style={{position:"absolute", top:0, left:0, right:0, height:6,
        background:`repeating-linear-gradient(-55deg, ${C.accent} 0 28px, ${C.dark} 28px 56px)`}}/>
      <div style={{position:"absolute", top:-140, right:-140, width:420, height:420, borderRadius:"50%",
        background:`radial-gradient(circle, ${C.accentBg} 0%, transparent 65%)`, pointerEvents:"none"}}/>

      {/* Logo */}
      <div style={{marginBottom:34, textAlign:"center", position:"relative"}}>
        <div style={{
          width:76, height:76, background:`linear-gradient(135deg, ${C.accent}, ${C.accentD})`,
          borderRadius:20, display:"flex", alignItems:"center", justifyContent:"center",
          fontSize:34, margin:"0 auto 16px", color:"#fff",
          boxShadow:`0 12px 32px ${C.accent}35`
        }}>⚙</div>
        <div style={{color:C.text, fontSize:30, fontWeight:900, letterSpacing:-1}}>COMINS</div>
        <div style={{color:C.muted, fontSize:12, fontWeight:700, letterSpacing:4, marginTop:2}}>INDUSTRIAL</div>
      </div>

      {/* Card login */}
      <div style={{
        background:C.surface, border:`1px solid ${C.border}`, borderRadius:22,
        padding:"30px 28px 26px", width:"100%", maxWidth:370,
        boxShadow:C.shadowLg, position:"relative"
      }}>
        <div style={{fontWeight:800, fontSize:19, color:C.text, marginBottom:3}}>Iniciar sesión</div>
        <div style={{color:C.muted, fontSize:13, marginBottom:22}}>Sistema de administración de obra</div>

        <Lbl t="Usuario"/>
        <input
          value={usuario}
          onChange={e=>setUsuario(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&pinRef.current?.focus()}
          placeholder="tu usuario" autoCapitalize="none"
          style={{width:"100%", background:C.surfaceAlt, border:`1.5px solid ${error?C.accent:C.border}`,
            borderRadius:11, padding:"12px 14px", fontSize:14, fontFamily:"inherit",
            color:C.text, boxSizing:"border-box", outline:"none", marginBottom:14}}
        />

        <Lbl t="PIN"/>
        <input
          ref={pinRef} type="password" value={pin}
          onChange={e=>setPin(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&entrar()}
          placeholder="••••" maxLength={8} inputMode="numeric"
          style={{width:"100%", background:C.surfaceAlt, border:`1.5px solid ${error?C.accent:C.border}`,
            borderRadius:11, padding:"11px 14px", fontSize:22, fontFamily:"inherit",
            color:C.text, boxSizing:"border-box", letterSpacing:8, outline:"none", marginBottom:18}}
        />

        {error && (
          <div style={{background:C.accentBg, borderRadius:10, padding:"10px 13px",
            marginBottom:14, color:C.accent, fontSize:13, fontWeight:700}}>
            ⚠ {error}
          </div>
        )}

        <button
          onClick={entrar}
          disabled={loading||!usuario||!pin}
          style={{width:"100%", background:`linear-gradient(135deg, ${C.accent}, ${C.accentD})`,
            color:"#fff", border:"none", borderRadius:12, padding:"14px",
            fontSize:15, fontWeight:800, fontFamily:"inherit",
            cursor:loading||!usuario||!pin?"not-allowed":"pointer",
            opacity:loading||!usuario||!pin?.55:1, transition:"all .15s",
            boxShadow:`0 6px 20px ${C.accent}30`}}
        >
          {loading ? "Verificando..." : "Entrar →"}
        </button>

        <div style={{textAlign:"center", marginTop:18, color:C.muted, fontSize:11}}>
          COMINS · Ciudad Madero, Tamaulipas
        </div>
      </div>
    </div>
  );
}

// ── KPI CARD ─────────────────────────────────────────────────────
function KpiCard({icon, label, value, sub, color, onClick}) {
  const [hov, setHov] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{
        background:C.surface, border:`1px solid ${C.border}`, borderRadius:14,
        padding:"16px 18px", flex:1, minWidth:140,
        boxShadow:hov&&onClick?C.shadowMd:C.shadow,
        transform:hov&&onClick?"translateY(-1px)":"none",
        transition:"all .15s", cursor:onClick?"pointer":"default"
      }}
    >
      <div style={{fontSize:22, marginBottom:8}}>{icon}</div>
      <div style={{fontSize:11, color:C.muted, fontWeight:700, letterSpacing:.5, textTransform:"uppercase", marginBottom:4}}>{label}</div>
      <div style={{fontSize:22, fontWeight:900, color:color||C.text, lineHeight:1}}>{value}</div>
      {sub && <div style={{fontSize:11, color:C.muted, marginTop:4}}>{sub}</div>}
    </div>
  );
}

// ── DASHBOARD ────────────────────────────────────────────────────
function DashboardTab({obras, proyectos, finanzas, compras, usuario}) {
  const rol = usuario?.rol;

  // KPIs calculados
  const obrasActivas   = obras.filter(o => o.status === "en_proceso");
  const obrasPausadas  = obras.filter(o => o.status === "pausada");
  const cobrosTotal    = obrasActivas.reduce((s,o) => s + (o.montoContrato||0), 0);
  const cobrado        = obrasActivas.reduce((s,o) => s + (o.cobrado||0), 0);
  const pendienteCobro = cobrosTotal - cobrado;
  const gastosTotal    = obrasActivas.reduce((s,o) => s + (o.gastos||0), 0);
  const utilidad       = cobrado - gastosTotal;
  const solicitudesPendientes = compras.filter(c => c.status === "pendiente").length;

  // Avance promedio obras activas
  const avgAvance = obrasActivas.length
    ? Math.round(obrasActivas.reduce((s,o) => s + (o.avance||0), 0) / obrasActivas.length)
    : 0;

  return (
    <div>
      {/* Saludo */}
      <div style={{padding:"20px 20px 0"}}>
        <div style={{fontWeight:900, fontSize:22, color:C.text, marginBottom:2}}>
          {new Date().getHours() < 12 ? "Buenos días" : new Date().getHours() < 19 ? "Buenas tardes" : "Buenas noches"}, {usuario?.nombre} 👋
        </div>
        <div style={{color:C.muted, fontSize:13, marginBottom:20}}>
          {today ? fmtD(today) : ""} · {obrasActivas.length} obra{obrasActivas.length!==1?"s":""} activa{obrasActivas.length!==1?"s":""}
        </div>

        {/* KPIs principales — solo director y asistente ven montos */}
        {rol==="director" && (
          <div style={{display:"flex", gap:10, marginBottom:16, flexWrap:"wrap"}}>
            <KpiCard icon="🏗"  label="Obras activas"    value={obrasActivas.length}  sub={obrasPausadas.length>0?`${obrasPausadas.length} pausada${obrasPausadas.length>1?"s":""}`:"Sin pausas"} color={C.blue}/>
            <KpiCard icon="💸" label="Por cobrar"        value={cur(pendienteCobro)}   sub="saldo pendiente"        color={pendienteCobro>0?C.orange:C.green}/>
            <KpiCard icon="📈" label="Utilidad acum."    value={cur(utilidad)}         sub="sin contar préstamos"   color={utilidad>=0?C.green:C.red}/>
            {(()=>{const tp=resumenPrestamos(finanzas).totalPorPagar;
              return tp>0.5?<KpiCard icon="🤝" label="Préstamos por pagar" value={cur(tp)} sub="suma de todos los proyectos" color={C.orange}/>:null;})()}
          </div>
        )}

        {/* Supervisor solo ve avance y solicitudes */}
        {rol==="director" && (
          <Card style={{marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:10}}>
              <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:.5,textTransform:"uppercase"}}>💼 Saldos en cajas — todas las obras</div>
            </div>
            <SaldosCajasRow movs={finanzas}/>
          </Card>
        )}
        {rol!=="director" && (
          <div style={{display:"flex", gap:10, marginBottom:16, flexWrap:"wrap"}}>
            <KpiCard icon="🏗"  label="Obras activas"        value={obrasActivas.length}        color={C.blue}/>
            <KpiCard icon="📊" label="Avance promedio"       value={pct(avgAvance)}             color={avgAvance>=70?C.green:C.orange}/>
            <KpiCard icon="🛒" label="Solicitudes pendientes" value={solicitudesPendientes}      color={solicitudesPendientes>0?C.orange:C.green}/>
          </div>
        )}

        {/* Obras activas — lista */}
        <div style={{marginBottom:8, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
          <div style={{fontWeight:800, fontSize:16}}>Obras en proceso</div>
          {rol==="director" && (
            <div style={{fontSize:12, color:C.muted, fontWeight:600}}>Contrato · Cobrado · Gasto</div>
          )}
        </div>

        {obrasActivas.length === 0 && (
          <Card style={{textAlign:"center", padding:32}}>
            <div style={{fontSize:32, marginBottom:8}}>🏗</div>
            <div style={{fontWeight:700, color:C.muted}}>Sin obras activas</div>
            <div style={{fontSize:13, color:C.muted, marginTop:4}}>Agrega un proyecto en la sección Proyectos</div>
          </Card>
        )}

        {obrasActivas.map(obra => (
          <Card key={obra.id} style={{marginBottom:10}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10, marginBottom:10}}>
              <div style={{flex:1}}>
                <div style={{display:"flex", gap:6, alignItems:"center", marginBottom:4, flexWrap:"wrap"}}>
                  <span style={{fontWeight:900, fontSize:15}}>{obra.nombre}</span>
                  <Bdg label={OBRA_TIPOS.find(t=>t===obra.tipo)||obra.tipo||"—"} color={C.blue} bg={C.blueBg}/>
                </div>
                <div style={{color:C.muted, fontSize:12}}>{obra.cliente} · {obra.ubicacion||"Sin ubicación"}</div>
              </div>
              {rol==="director" && (
                <div style={{textAlign:"right", flexShrink:0}}>
                  <div style={{fontSize:12, color:C.muted}}>Contrato</div>
                  <div style={{fontWeight:900, fontSize:16, color:C.text}}>{cur(obra.montoContrato||0)}</div>
                </div>
              )}
            </div>

            {/* Barra de avance */}
            <div style={{marginBottom:rol==="director"?10:0}}>
              <div style={{display:"flex", justifyContent:"space-between", marginBottom:4}}>
                <span style={{fontSize:11, color:C.muted, fontWeight:700}}>AVANCE FÍSICO</span>
                {obra.fechaFin && <span style={{fontSize:11, color:C.muted}}>Término: {fmtD(obra.fechaFin)}</span>}
              </div>
              <Semaforo p={obra.avance||0}/>
            </div>

            {/* Financiero — solo director y asistente */}
            {rol==="director" && (
              <div style={{display:"flex", gap:8, marginTop:6}}>
                <div style={{flex:1, background:C.greenBg, borderRadius:8, padding:"6px 10px"}}>
                  <div style={{fontSize:10, color:C.green, fontWeight:700}}>COBRADO</div>
                  <div style={{fontWeight:800, fontSize:13, color:C.green}}>{cur(obra.cobrado||0)}</div>
                </div>
                <div style={{flex:1, background:C.redBg, borderRadius:8, padding:"6px 10px"}}>
                  <div style={{fontSize:10, color:C.red, fontWeight:700}}>GASTADO</div>
                  <div style={{fontWeight:800, fontSize:13, color:C.red}}>{cur(obra.gastos||0)}</div>
                </div>
                <div style={{flex:1, background:((obra.cobrado||0)-(obra.gastos||0))>=0?C.greenBg:C.redBg, borderRadius:8, padding:"6px 10px"}}>
                  <div style={{fontSize:10, color:((obra.cobrado||0)-(obra.gastos||0))>=0?C.green:C.red, fontWeight:700}}>UTILIDAD</div>
                  <div style={{fontWeight:800, fontSize:13, color:((obra.cobrado||0)-(obra.gastos||0))>=0?C.green:C.red}}>
                    {cur((obra.cobrado||0)-(obra.gastos||0))}
                  </div>
                </div>
              </div>
            )}
          </Card>
        ))}

        {/* Alertas rápidas */}
        {(rol==="director"||rol==="asistente") && solicitudesPendientes > 0 && (
          <div style={{background:C.orangeBg, border:`1px solid ${C.orange}33`, borderRadius:12, padding:"12px 16px", marginTop:8, display:"flex", alignItems:"center", gap:10}}>
            <span style={{fontSize:22}}>🛒</span>
            <div>
              <div style={{fontWeight:800, fontSize:13, color:C.orange}}>{solicitudesPendientes} solicitud{solicitudesPendientes>1?"es":""} de compra pendiente{solicitudesPendientes>1?"s":""}</div>
              <div style={{fontSize:12, color:C.darkMuted}}>Revisa y aprueba en el módulo de Compras</div>
            </div>
          </div>
        )}

        {obrasPausadas.length > 0 && (
          <div style={{background:C.orangeBg, border:`1px solid ${C.orange}33`, borderRadius:12, padding:"12px 16px", marginTop:8, display:"flex", alignItems:"center", gap:10}}>
            <span style={{fontSize:22}}>⏸</span>
            <div>
              <div style={{fontWeight:800, fontSize:13, color:C.orange}}>{obrasPausadas.length} obra{obrasPausadas.length>1?"s":""} pausada{obrasPausadas.length>1?"s":""}</div>
              <div style={{fontSize:12, color:C.darkMuted}}>{obrasPausadas.map(o=>o.nombre).join(", ")}</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

  "Eléctrico Industrial","Civil","Refrigeración",
  "Mantenimiento Integral","Instalaciones Especiales","Otro"

const ETAPAS_DEFAULT = ["Preliminares","Cimentación","Estructura","Instalaciones","Acabados","Entrega"];

const BITA_TIPOS = {

};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function Sel({label,value,onChange,options=[]}) {
  return <div style={{marginBottom:12}}>
    {label&&<Lbl t={label}/>}
    <select value={value} onChange={onChange}
      style={{width:"100%",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:9,
        padding:"10px 13px",fontSize:14,fontFamily:"inherit",color:C.text,boxSizing:"border-box"}}>
      {options.map(o=><option key={o.v||o} value={o.v||o}>{o.l||o}</option>)}
    </select>
  </div>;
}

function Semaforo({p,showLabel=true}) {
  const color=p>=80?C.green:p>=40?C.orange:C.red;
  return <div style={{display:"flex",alignItems:"center",gap:8}}>
    <div style={{flex:1,height:7,background:C.border,borderRadius:4,overflow:"hidden"}}>
      <div style={{width:`${Math.min(p,100)}%`,height:"100%",background:color,borderRadius:4,transition:"width .4s"}}/>
    </div>
    {showLabel&&<span style={{fontSize:12,fontWeight:800,color,minWidth:34}}>{Math.round(p)}%</span>}
  </div>;
}

function ConceptoAvanceRow({concepto, etapaId, rol, onUpdateEtapa}) {
  const [editing, setEditing] = useState(false);
  const [tmp, setTmp] = useState(String(concepto.avance||0));
  const puedeEditar = rol==="director"||rol==="supervisor";
  return <div style={{background:C.surfaceAlt,borderRadius:9,padding:"8px 12px",marginBottom:6}}>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
      <span style={{fontSize:12,fontWeight:700,flex:1,color:C.sub}}>{concepto.nombre}</span>
      {concepto.avance>=100&&<span style={{fontSize:12}}>✅</span>}
      {puedeEditar&&!editing&&(
        <button onClick={()=>{setTmp(String(concepto.avance||0));setEditing(true);}}
          style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:C.sub}}>✏</button>
      )}
      {puedeEditar&&(
        <button onClick={()=>{if(window.confirm(`¿Eliminar el concepto "${concepto.nombre}"?`)) onUpdateEtapa(etapaId, e=>({...e, conceptos:(e.conceptos||[]).filter(c=>c.id!==concepto.id)}));}}
          style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:14,padding:"0 2px"}}>×</button>
      )}
    </div>
    {editing?(
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <input type="range" min={0} max={100} step={5} value={tmp} onChange={e=>setTmp(e.target.value)} style={{flex:1,accentColor:C.accent}}/>
        <span style={{fontWeight:800,fontSize:12,minWidth:36,textAlign:"right",color:C.accent}}>{tmp}%</span>
        <Btn ch="✅" v="green" sm onClick={()=>{
          onUpdateEtapa(etapaId, e=>({...e, conceptos:(e.conceptos||[]).map(c=>c.id===concepto.id?{...c,avance:parseInt(tmp)||0}:c)}));
          setEditing(false);
        }}/>
        <Btn ch="✕" v="ghost" sm onClick={()=>setEditing(false)}/>
      </div>
    ):(
      <Semaforo p={concepto.avance||0} showLabel={true}/>
    )}
  </div>;
}

function EtapaCard({etapa, i, rol, onSaveAvance, onUpdateEtapa}) {
  const [editing, setEditing] = useState(false);
  const [tmpAvance, setTmpAvance] = useState(String(etapa.avance||0));
  const [nuevoConcepto, setNuevoConcepto] = useState("");
  const [showConceptos, setShowConceptos] = useState((etapa.conceptos||[]).length>0);
  const tieneConceptos = (etapa.conceptos||[]).length>0;
  const puedeEditar = rol==="director"||rol==="supervisor";

  const addConcepto = () => {
    if(!nuevoConcepto.trim()) return;
    onUpdateEtapa(etapa.id, e=>({...e, conceptos:[...(e.conceptos||[]),{id:uid(),nombre:nuevoConcepto.trim(),avance:0}]}));
    setNuevoConcepto("");
    setShowConceptos(true);
  };

  return <Card style={{marginBottom:10}}>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
      <span style={{background:C.accent,color:"#fff",borderRadius:6,width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,flexShrink:0}}>{i+1}</span>
      <span style={{fontWeight:800,fontSize:15,flex:1}}>{etapa.nombre}</span>
      {tieneConceptos&&<Bdg label={`${(etapa.conceptos||[]).length} conceptos`} color={C.blue} bg={C.blueBg}/>}
      {etapa.avance>=100&&<span>✅</span>}
    </div>
    <Semaforo p={etapa.avance||0}/>
    {tieneConceptos&&<div style={{fontSize:10,color:C.muted,marginTop:4,fontWeight:600}}>Avance calculado como promedio de sus conceptos</div>}

    {/* Avance directo de partida — solo si NO tiene conceptos */}
    {puedeEditar&&!tieneConceptos&&<div style={{marginTop:10}}>
      {editing?(
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input type="range" min={0} max={100} step={5} value={tmpAvance} onChange={e=>setTmpAvance(e.target.value)} style={{flex:1,accentColor:C.accent}}/>
          <span style={{fontWeight:800,fontSize:14,minWidth:40,textAlign:"right",color:C.accent}}>{tmpAvance}%</span>
          <Btn ch="✅" v="green" sm onClick={()=>{onSaveAvance(etapa.id,tmpAvance);setEditing(false);}}/>
          <Btn ch="✕" v="ghost" sm onClick={()=>setEditing(false)}/>
        </div>
      ):(
        <button onClick={()=>{setTmpAvance(String(etapa.avance||0));setEditing(true);}}
          style={{background:C.surfaceAlt,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:C.sub,width:"100%",textAlign:"center"}}>✏ Actualizar avance de partida</button>
      )}
    </div>}

    {/* Conceptos */}
    {(tieneConceptos||puedeEditar)&&<div style={{marginTop:10,borderTop:`1px solid ${C.border}`,paddingTop:10}}>
      <button onClick={()=>setShowConceptos(p=>!p)}
        style={{background:showConceptos?C.blueBg:C.surfaceAlt,border:`1.5px solid ${showConceptos?C.blue+"55":C.border}`,
          borderRadius:9,cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:800,color:C.blue,
          padding:"8px 14px",width:"100%",textAlign:"left",marginBottom:showConceptos?10:0}}>
        {showConceptos?"▾":"▸"} 📋 Avance por concepto {tieneConceptos?`(${(etapa.conceptos||[]).length})`:"— toca para agregar"}
      </button>
      {showConceptos&&<>
        {(etapa.conceptos||[]).map(c=>(
          <ConceptoAvanceRow key={c.id} concepto={c} etapaId={etapa.id} rol={rol} onUpdateEtapa={onUpdateEtapa}/>
        ))}
        {puedeEditar&&(
          <div style={{display:"flex",gap:6,marginTop:6}}>
            <input value={nuevoConcepto} onChange={e=>setNuevoConcepto(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&addConcepto()}
              placeholder="Nuevo concepto... (Enter)"
              style={{flex:1,background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"7px 11px",fontSize:12,fontFamily:"inherit",color:C.text}}/>
            <Btn ch="+" v="dark" sm onClick={addConcepto}/>
          </div>
        )}
      </>}
    </div>}
  </Card>;
}

function ObraDetalle({obra,onClose,onSave,onEdit,onDelete,usuario,movs=[],usuarios=[],setMovs,empleados=[],setEmpleados,asistencia={},setAsistencia,destajos=[],setDestajos,presupuestos=[],categorias,facturas=[],facturasApi}) {
  const [tab,setTab]=useState("general");
  const [showBita,setShowBita]=useState(false);
  const [nuevaNota,setNuevaNota]=useState("");
  const [modalMovObra,setModalMovObra]=useState(false);
  const [editMovObra,setEditMovObra]=useState(null);
  const esDir=usuario?.rol==="director";
  // Movimientos de esta obra según rol: director todo; demás solo SUS gastos
  const movsObra=useMemo(()=>{
    let r=movs.filter(m=>m.obraId===obra.id);
    if(!esDir) r=r.filter(m=>m.tipo==="egreso"&&!esPagoPrestamo(m)&&registroPropio(m,usuario));
    return r.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  },[movs,obra.id,usuario]);
  const presVinculado=presupuestos.find(p=>p.id===obra.presupuestoId);
  const [editEtapaId,setEditEtapaId]=useState(null);
  const rol=usuario?.rol;
  const recomputeObra=(etapas)=>{
    const avg=etapas.length?Math.round(etapas.reduce((s,e)=>s+(e.avance||0),0)/etapas.length):0;
    onSave({...obra,etapas,avance:avg});
  };
  const saveEtapaAvance=(etapaId,nuevoAvance)=>{
    recomputeObra(obra.etapas.map(e=>e.id===etapaId?{...e,avance:parseInt(nuevoAvance)||0}:e));
  };
  const updateEtapa=(etapaId,fn)=>{
    const etapas=obra.etapas.map(e=>{
      if(e.id!==etapaId) return e;
      let ne=fn(e);
      if(ne.conceptos&&ne.conceptos.length>0){
        ne={...ne,avance:Math.round(ne.conceptos.reduce((s,c)=>s+(c.avance||0),0)/ne.conceptos.length)};
      }
      return ne;
    });
    recomputeObra(etapas);
  };
  const addBitacora=(registro)=>onSave({...obra,bitacora:[registro,...(obra.bitacora||[])]});
  const st=OBRA_STATUS[obra.status]||OBRA_STATUS.prospecto;
  const diasRestantes=obra.fechaFin?(Math.ceil((new Date(obra.fechaFin+"T12:00:00")-new Date())/(1000*60*60*24))):null;
  return <div style={{position:"fixed",inset:0,background:C.bg,zIndex:900,overflowY:"auto",fontFamily:"-apple-system,'SF Pro Display','Segoe UI',sans-serif"}}>
    <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,zIndex:10,boxShadow:C.shadow}}>
      <div style={{maxWidth:720,margin:"0 auto",padding:"14px 20px 0"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
          <button onClick={onClose} style={{background:C.surfaceAlt,border:"none",borderRadius:10,width:38,height:38,cursor:"pointer",color:C.text,fontSize:18,flexShrink:0}}>←</button>
          <div style={{flex:1,minWidth:0}}>
            <div style={{color:C.accent,fontSize:11,fontWeight:800,letterSpacing:1.5}}>{obra.folio}</div>
            <div style={{color:C.text,fontWeight:900,fontSize:19,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",letterSpacing:-.3}}>{obra.nombre}</div>
          </div>
          <Bdg label={st.label} color={st.color} bg={st.bg} icon={st.icon}/>
          {(usuario?.rol==="director"||usuario?.rol==="asistente")&&<>
            <button onClick={()=>onEdit&&onEdit(obra)} title="Editar proyecto"
              style={{background:C.surfaceAlt,border:`1px solid ${C.border}`,borderRadius:10,width:36,height:36,cursor:"pointer",color:C.sub,fontSize:15,flexShrink:0}}>✏</button>
            <button onClick={()=>{if(window.confirm(`¿Eliminar el proyecto ${obra.folio} — ${obra.nombre}? Esta acción no se puede deshacer.`)) onDelete&&onDelete(obra.id);}} title="Eliminar proyecto"
              style={{background:C.redBg,border:`1px solid ${C.red}22`,borderRadius:10,width:36,height:36,cursor:"pointer",color:C.red,fontSize:15,flexShrink:0}}>🗑</button>
          </>}
        </div>
        <div style={{display:"flex",gap:2,overflowX:"auto"}}>
          {[{v:"general",l:"General"},{v:"etapas",l:"Etapas"},{v:"finanzas",l:"💰 Finanzas"},{v:"manoobra",l:"👷 Mano de obra"},{v:"insumos",l:"📦 Insumos"},{v:"facturas",l:"🧾 Facturas"},{v:"bitacora",l:"Bitácora"},{v:"notas",l:"Notas"}].filter(t=>t.v!=="facturas"||rol!=="supervisor").map(t=>(

              <div key={item.label}>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:15}}>Avance general</div>
            {diasRestantes!==null&&<span style={{fontSize:12,fontWeight:700,color:diasRestantes<7?C.red:diasRestantes<30?C.orange:C.green}}>{diasRestantes>0?`${diasRestantes} días restantes`:"Fecha vencida"}</span>}
          </div>
          <Semaforo p={obra.avance||0}/>
        </Card>
        {rol==="director"&&<Card style={{marginBottom:12}}>
          <div style={{fontWeight:800,fontSize:15,marginBottom:12}}>Financiero</div>

              <div key={f.label} style={{background:f.bg,borderRadius:12,padding:"12px 14px"}}>
                <div style={{fontSize:10,color:f.color,fontWeight:700,letterSpacing:.6,textTransform:"uppercase"}}>{f.label}</div>
                <div style={{fontWeight:900,fontSize:14,color:f.color}}>{f.value}</div>
              </div>
            ))}
          </div>
          <div style={{marginTop:10,background:(obra.cobrado||0)-(obra.gastos||0)>=0?C.greenBg:C.redBg,borderRadius:10,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontWeight:700,fontSize:13,color:(obra.cobrado||0)-(obra.gastos||0)>=0?C.green:C.red}}>Utilidad del proyecto</span>
            <span style={{fontWeight:900,fontSize:16,color:(obra.cobrado||0)-(obra.gastos||0)>=0?C.green:C.red}}>{cur((obra.cobrado||0)-(obra.gastos||0))}</span>
          </div>
          {/* ¿En qué se ha gastado? — desglose por categoría */}
          {(()=>{
            const gastos=movs.filter(x=>x.obraId===obra.id&&x.tipo==="egreso"&&x.status==="realizado");
            if(gastos.length===0) return null;
            const porCat={};
            gastos.forEach(g=>{const c=g.categoria||"Otros";porCat[c]=(porCat[c]||0)+g.monto;});
            const total=Object.values(porCat).reduce((s,v)=>s+v,0);
            const ordenado=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
            const colores=[C.red,C.orange,C.blue,C.purple,"#0D9488",C.green,"#DB2777","#65A30D",C.muted];
            return <div style={{marginTop:14}}>
              <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:.5,textTransform:"uppercase",marginBottom:10}}>¿En qué se ha gastado?</div>
              {ordenado.map(([cat,monto],i)=>{
                const pct=total>0?Math.round(monto/total*100):0;
                const color=colores[i%colores.length];
                return <div key={cat} style={{marginBottom:9}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                    <span style={{fontWeight:700,color:C.sub}}>{cat}</span>
                    <span style={{fontWeight:800,color:C.text}}>{cur(monto)} <span style={{color:C.muted,fontWeight:600}}>({pct}%)</span></span>
                  </div>
                  <div style={{height:8,background:C.surfaceAlt,borderRadius:4,overflow:"hidden"}}>
                    <div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:4,transition:"width .3s"}}/>
                  </div>
                </div>;
              })}
            </div>;
          })()}
          <div style={{marginTop:14}}>
            <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:.5,textTransform:"uppercase",marginBottom:8}}>Saldos en cajas de esta obra</div>
            <SaldosCajasRow movs={movs} obraId={obra.id}/>
          </div>
        </Card>}

        {/* Cotización vinculada al proyecto */}
        {rol==="director"&&(
          <Card style={{marginBottom:12}}>
            <div style={{fontWeight:800,fontSize:15,marginBottom:3}}>🔗 Cotización vinculada</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Alimenta la explosión de insumos y conecta el contrato con su presupuesto</div>
            {presVinculado?(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,background:C.greenBg,borderRadius:11,padding:"11px 14px"}}>
                <div>
                  <div style={{fontWeight:800,fontSize:14,color:C.green}}>📄 {presVinculado.folio}</div>
                  <div style={{fontSize:12,color:C.sub}}>{presVinculado.cliente}{presVinculado.obra?` · ${presVinculado.obra}`:""}</div>
                </div>
                <Btn ch="✕ Desvincular" v="ghost" sm onClick={()=>{
                  if(window.confirm("¿Desvincular esta cotización del proyecto? La explosión de insumos dejará de mostrarse.")){
                    onSave({...obra,presupuestoId:null});
                    fireToast("🔗 Cotización desvinculada");
                  }}}/>
              </div>
            ):(
              presupuestos.length>0?(
                <select onChange={e=>{if(e.target.value){onSave({...obra,presupuestoId:e.target.value});fireToast("🔗 Cotización vinculada");}}} defaultValue=""
                  style={{width:"100%",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"10px 13px",fontSize:14,fontFamily:"inherit",color:C.text}}>
                  <option value="">Selecciona la cotización de esta obra...</option>
                  {presupuestos.map(p=><option key={p.id} value={p.id}>{p.folio} — {p.cliente}{p.obra?` (${p.obra})`:""}</option>)}
                </select>
              ):(
                <div style={{fontSize:13,color:C.muted,textAlign:"center",padding:8}}>Aún no hay presupuestos creados</div>
              )
            )}
          </Card>
        )}

        {/* Acceso al proyecto: qué supervisores/asistentes pueden verlo */}
        {rol==="director"&&(
          <Card style={{marginBottom:12}}>
            <div style={{fontWeight:800,fontSize:15,marginBottom:3}}>🔑 Acceso al proyecto</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Solo los usuarios palomeados pueden ver esta obra (proyectos, gastos, compras, personal). Tú siempre la ves.</div>
            {usuarios.filter(u=>u.rol!=="director").length===0&&(
              <div style={{fontSize:13,color:C.muted,textAlign:"center",padding:10}}>No hay usuarios de equipo — créalos en 👥 Usuarios y PINs</div>
            )}
            {usuarios.filter(u=>u.rol!=="director").map(u=>{
              const tiene=(obra.acceso||[]).includes(u.id);
              return <div key={u.id} onClick={()=>{
                  const acceso=tiene?(obra.acceso||[]).filter(x=>x!==u.id):[...(obra.acceso||[]),u.id];
                  onSave({...obra,acceso});
                  fireToast(tiene?`🔒 ${u.nombre} ya no ve esta obra`:`✅ ${u.nombre} ahora tiene acceso`);
                }}
                style={{display:"flex",alignItems:"center",gap:10,border:`1.5px solid ${tiene?C.green:C.border}`,
                  background:tiene?C.greenBg:C.surface,borderRadius:11,padding:"10px 14px",marginBottom:8,cursor:"pointer",transition:"all .15s"}}>
                <div style={{width:20,height:20,borderRadius:6,border:`2px solid ${tiene?C.green:C.borderStrong}`,
                  background:tiene?C.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center",
                  color:"#fff",fontSize:12,fontWeight:800,flexShrink:0}}>{tiene?"✓":""}</div>
                <div style={{flex:1}}>
                  <span style={{fontWeight:800,fontSize:13}}>{ROLES[u.rol]?.icon} {u.nombre}</span>
                  <span style={{fontSize:11,color:C.muted,marginLeft:8}}>{ROLES[u.rol]?.label}</span>
                </div>
              </div>;
            })}
          </Card>
        )}
        {obra.descripcion&&<Card><div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:6}}>DESCRIPCIÓN</div><div style={{fontSize:14,color:C.sub,lineHeight:1.6}}>{obra.descripcion}</div></Card>}
      </>}
      {tab==="etapas"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:16}}>Etapas de obra</div>
          <div style={{fontSize:12,color:C.muted}}>{obra.etapas?.filter(e=>e.avance>=100).length||0}/{obra.etapas?.length||0} completadas</div>
        </div>
        {(!obra.etapas||obra.etapas.length===0)&&<Card style={{textAlign:"center",padding:32}}><div style={{fontSize:32,marginBottom:8}}>📋</div><div style={{fontWeight:700,color:C.muted}}>Sin etapas definidas</div></Card>}
        {(obra.etapas||[]).map((etapa,i)=><EtapaCard key={etapa.id} etapa={etapa} i={i} rol={rol} onSaveAvance={saveEtapaAvance} onUpdateEtapa={updateEtapa}/>)}
      </>}
      {tab==="bitacora"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:16}}>Bitácora de obra</div>
          <Btn ch="+ Registro" v="primary" sm onClick={()=>setShowBita(true)}/>
        </div>
        {(!obra.bitacora||obra.bitacora.length===0)&&<Card style={{textAlign:"center",padding:32}}><div style={{fontSize:32,marginBottom:8}}>📒</div><div style={{fontWeight:700,color:C.muted}}>Sin registros aún</div></Card>}
        {(obra.bitacora||[]).map(reg=>{const bt=BITA_TIPOS[reg.tipo]||BITA_TIPOS.nota;return <Card key={reg.id} style={{marginBottom:10,borderLeft:`3px solid ${bt.color}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:6}}>
            <Bdg label={bt.label} color={bt.color} bg={bt.bg} icon={bt.icon}/>
            <div style={{textAlign:"right"}}><div style={{fontSize:12,fontWeight:700}}>{fmtD(reg.fecha)}</div><div style={{fontSize:11,color:C.muted}}>{reg.autor}</div></div>
          </div>
          <div style={{fontSize:14,color:C.sub,lineHeight:1.6}}>{reg.nota}</div>
        </Card>;})}
      </>}

      {tab==="finanzas"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div>
            <div style={{fontWeight:800,fontSize:16}}>Finanzas de esta obra</div>
            <div style={{fontSize:12,color:C.muted}}>{esDir?"Todos los movimientos":"Tus gastos registrados"}</div>
          </div>
          {setMovs&&<Btn ch="+ Movimiento" v="primary" sm onClick={()=>{setEditMovObra(null);setModalMovObra(true);}}/>}
        </div>
        {esDir&&(
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:C.muted,fontWeight:700,marginBottom:6}}>SALDO EN CAJAS (HISTÓRICO)</div>
            <SaldosCajasRow movs={movs} obraId={obra.id} compact={true}/>
          </div>
        )}
        {movsObra.length===0&&<Card style={{textAlign:"center",padding:32}}><div style={{fontSize:32,marginBottom:8}}>💸</div><div style={{fontWeight:700,color:C.muted}}>Sin movimientos</div></Card>}
        {movsObra.map(m=>{
          const esIngreso=m.tipo==="ingreso";
          return <Card key={m.id} style={{marginBottom:8,padding:"12px 16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:2}}>
                  <span style={{fontWeight:700,fontSize:13}}>{m.concepto}</span>
                  {m.status==="pendiente"&&<Bdg label="Pendiente" color={C.orange} bg={C.orangeBg} icon="⏳"/>}
                  {esIngreso&&m.subtipo&&<Bdg label={TIPOS_COBRO[m.subtipo]?.label||m.subtipo} color={TIPOS_COBRO[m.subtipo]?.color||C.green} bg={C.greenBg}/>}
                  {!esIngreso&&m.categoria&&<Bdg label={m.categoria} color={C.blue} bg={C.blueBg}/>}
                </div>
                <div style={{fontSize:11,color:C.muted}}>{fmtD(m.fecha)} · {METODOS[m.metodo]?.icon} {METODOS[m.metodo]?.label}{m.prestamista?` · 🤝 ${m.prestamista}`:""}{m.registro?` · ✍ ${m.registro}`:""}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{fontWeight:900,fontSize:15,color:esIngreso?C.green:C.red,whiteSpace:"nowrap"}}>{esIngreso?"+":"−"}{cur(m.monto)}</div>
                {(esDir||registroPropio(m,usuario))&&setMovs&&(
                  <button onClick={()=>{setEditMovObra(m);setModalMovObra(true);}}
                    style={{background:C.surfaceAlt,border:"none",borderRadius:7,padding:"5px 9px",fontSize:12,cursor:"pointer",color:C.sub}}>✏</button>
                )}
              </div>
            </div>
          </Card>;
        })}
        {modalMovObra&&setMovs&&<MovModal onClose={()=>{setModalMovObra(false);setEditMovObra(null);}}
          onSave={(mv)=>{setMovs(p=>{const i=p.findIndex(x=>x.id===mv.id);return i>=0?p.map(x=>x.id===mv.id?mv:x):[mv,...p];});fireToast("✅ Movimiento guardado");}}
          obras={[obra]} obraPre={obra.id} usuario={usuario} categorias={categorias||CAT_GASTO_DEFAULT}
          editMov={editMovObra} prestamistas={resumenPrestamos(movs).lista.map(x=>x.prestamista)}/>}
      </>}

      {tab==="manoobra"&&<>
        {setEmpleados
          ? <div style={{margin:"-20px -20px 0"}}>
              <PersonalTab empleados={empleados} setEmpleados={setEmpleados}
                asistencia={asistencia} setAsistencia={setAsistencia}
                destajos={destajos} setDestajos={setDestajos}
                obras={[obra]} usuario={usuario} soloObraId={obra.id}
                onAddGasto={setMovs?(g)=>setMovs(p=>[g,...p]):null}
                onEditGasto={setMovs?(id,cambios)=>setMovs(p=>p.map(x=>x.id===id?{...x,...cambios}:x)):null}
                onRemoveGasto={setMovs?(id)=>setMovs(p=>p.filter(x=>x.id!==id)):null} embedded={true}/>
            </div>
          : <Card style={{textAlign:"center",padding:32}}><div style={{fontWeight:700,color:C.muted}}>Módulo no disponible</div></Card>}
      </>}

      {tab==="insumos"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,gap:10,flexWrap:"wrap"}}>
          <div>
            <div style={{fontWeight:800,fontSize:16}}>Explosión de insumos</div>
            <div style={{fontSize:12,color:C.muted}}>Materiales por concepto, calculados desde los APUs de la cotización</div>
          </div>
          {presVinculado&&<Btn ch="🖨 PDF" v="dark" sm onClick={()=>imprimirInsumos(obra,presVinculado)}/>}
        </div>
        {!presVinculado&&<>
          <Card style={{textAlign:"center",padding:28,marginBottom:14}}>
            <div style={{fontSize:32,marginBottom:8}}>🔗</div>
            <div style={{fontWeight:700,color:C.muted}}>Sin presupuesto vinculado</div>
            <div style={{fontSize:13,color:C.muted,marginTop:4}}>Vincula la cotización de esta obra para generar la explosión</div>
          </Card>
          {rol==="director"&&presupuestos.length>0&&(
            <Card>
              <Lbl t="Vincular presupuesto"/>
              <select onChange={e=>{if(e.target.value){onSave({...obra,presupuestoId:e.target.value});fireToast("🔗 Presupuesto vinculado");}}} defaultValue=""
                style={{width:"100%",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:10,padding:"10px 13px",fontSize:14,fontFamily:"inherit",color:C.text}}>
                <option value="">Selecciona un presupuesto...</option>
                {presupuestos.map(p=><option key={p.id} value={p.id}>{p.folio} — {p.cliente}{p.obra?` (${p.obra})`:""}</option>)}
              </select>
            </Card>
          )}
        </>}
        {presVinculado&&(()=>{
          const grupos=presVinculado.grupos.map((g,gi)=>({...g,letra:String.fromCharCode(65+gi),
            conAPU:g.conceptos.filter(c=>c.desc&&c.usaAPU&&c.apu&&(c.apu.materiales||[]).length>0)})).filter(g=>g.conAPU.length>0);
          if(grupos.length===0) return <Card style={{textAlign:"center",padding:28}}>
            <div style={{fontSize:32,marginBottom:8}}>📦</div>
            <div style={{fontWeight:700,color:C.muted}}>El presupuesto {presVinculado.folio} no tiene conceptos con APU</div>
            <div style={{fontSize:13,color:C.muted,marginTop:4}}>Los materiales se calculan desde los análisis de precio unitario</div>
          </Card>;
          return <>
            <div style={{fontSize:12,color:C.muted,marginBottom:10}}>🔗 Vinculado a <b>{presVinculado.folio}</b></div>
            {grupos.map(g=>(
              <Card key={g.id} style={{marginBottom:14,padding:0,overflow:"hidden"}}>
                <div style={{background:C.surfaceAlt,borderBottom:`1px solid ${C.border}`,padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
                  <span style={{background:C.accent,color:"#fff",borderRadius:6,minWidth:24,height:24,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,padding:"0 6px"}}>{g.letra}</span>
                  <span style={{flex:1,color:C.text,fontWeight:800,fontSize:14}}>{g.nombre}</span>
                </div>
                {g.conAPU.map((c,ci)=>(
                  <div key={c.id}>
                    <div style={{background:C.accentLight,padding:"8px 16px",fontSize:12,fontWeight:800,color:C.accent}}>
                      {g.letra}.{ci+1} {c.clave?c.clave+" — ":""}{c.desc} <span style={{color:C.muted,fontWeight:600}}>· Volumen: {c.cantidad} {c.unidad}</span>
                    </div>
                    {(c.apu.materiales||[]).map((mat,mi)=>(
                      <div key={mat.id||mi} style={{display:"grid",gridTemplateColumns:"1fr 70px 100px",gap:10,padding:"8px 16px",alignItems:"center",background:mi%2?C.surfaceAlt:C.surface,fontSize:13,borderBottom:`1px solid ${C.border}`}}>
                        <div style={{fontWeight:600}}>{mat.desc}</div>
                        <div style={{color:C.muted,textAlign:"center",fontSize:12}}>{mat.unidad}</div>
                        <div style={{textAlign:"right",fontWeight:800}}>{(num(mat.cantidad)*num(c.cantidad)).toLocaleString("es-MX",{maximumFractionDigits:2})}</div>
                      </div>
                    ))}
                  </div>
                ))}
              </Card>
            ))}
          </>;
        })()}
      </>}

      {tab==="facturas"&&rol!=="supervisor"&&(
        facturasApi
          ? <div style={{margin:"-20px -20px 0"}}>
              <FacturasTab facturas={facturas.filter(f=>f.obraId===obra.id)} facturasApi={facturasApi}
                obras={[obra]} usuario={usuario}/>
            </div>
          : <Card style={{textAlign:"center",padding:32}}><div style={{fontWeight:700,color:C.muted}}>Módulo no disponible</div></Card>
      )}

      {tab==="notas"&&<>
        <div style={{marginBottom:14}}>
          <div style={{fontWeight:800,fontSize:16}}>Notas y lecciones aprendidas</div>
          <div style={{fontSize:12,color:C.muted}}>Qué considerar o mejorar para próximas obras</div>
        </div>
        <Card style={{marginBottom:14}}>
          <textarea value={nuevaNota} onChange={e=>setNuevaNota(e.target.value)}
            placeholder="Ej: El proveedor X tardó 5 días más de lo prometido — pedir con anticipación. / Considerar renta de grúa desde el inicio..."
            rows={3}
            style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:9,padding:"10px 13px",fontSize:14,fontFamily:"inherit",color:C.text,boxSizing:"border-box",resize:"vertical",marginBottom:10}}/>
          <Btn ch="📌 Agregar nota" v="primary" sm style={{width:"100%"}} onClick={()=>{
            if(!nuevaNota.trim()) return;
            onSave({...obra,lecciones:[{id:uid(),fecha:today,autor:usuario?.nombre||"—",texto:nuevaNota.trim()},...(obra.lecciones||[])]});
            setNuevaNota("");
            fireToast("📌 Nota guardada");
          }}/>
        </Card>
        {(!obra.lecciones||obra.lecciones.length===0)&&(
          <Card style={{textAlign:"center",padding:32}}>
            <div style={{fontSize:32,marginBottom:8}}>📌</div>
            <div style={{fontWeight:700,color:C.muted}}>Sin notas aún</div>
            <div style={{fontSize:13,color:C.muted,marginTop:4}}>Anota aquí lo que hay que considerar en futuras obras</div>
          </Card>
        )}
        {(obra.lecciones||[]).map(n=>(
          <Card key={n.id} style={{marginBottom:10,borderLeft:`3px solid ${C.purple}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:6}}>
              <div style={{fontSize:12,color:C.muted}}><b style={{color:C.text}}>{n.autor}</b> · {fmtD(n.fecha)}</div>
              {(rol==="director"||n.autor===usuario?.nombre)&&(
                <button onClick={()=>{if(window.confirm("¿Eliminar esta nota?")) onSave({...obra,lecciones:obra.lecciones.filter(x=>x.id!==n.id)});}}
                  style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:14}}>×</button>
              )}
            </div>
            <div style={{fontSize:14,color:C.sub,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{n.texto}</div>
          </Card>
        ))}
      </>}
    </div>
    {showBita&&<BitacoraModal onClose={()=>setShowBita(false)} onSave={addBitacora} autor={usuario?.nombre||"Sistema"}/>}
  </div>;
}

function ProyectosTab({obras,setObras,usuario,movs=[],usuarios=[],setMovs,empleados,setEmpleados,asistencia,setAsistencia,destajos,setDestajos,presupuestos=[],categorias,facturas=[],facturasApi}) {
  const [filtro,setFiltro]=useState("todos");
  const [busqueda,setBusqueda]=useState("");
  const [modal,setModal]=useState(null);
  const [editObra,setEditObra]=useState(null);
  const [detalleObra,setDetalleObra]=useState(null);
  const rol=usuario?.rol;
  const obrasFiltradas=useMemo(()=>{
    let r=obras;
    if(filtro!=="todos") r=r.filter(o=>o.status===filtro);
    if(busqueda) r=r.filter(o=>o.nombre.toLowerCase().includes(busqueda.toLowerCase())||o.cliente.toLowerCase().includes(busqueda.toLowerCase()));
    return r;
  },[obras,filtro,busqueda]);
  const saveObra=(obra)=>{
    const previa=obras.find(o=>o.id===obra.id);
    const seFinalizaAhora=previa&&previa.status!=="terminada"&&obra.status==="terminada";
    setObras(p=>{const idx=p.findIndex(x=>x.id===obra.id);return idx>=0?p.map(x=>x.id===obra.id?obra:x):[obra,...p];});
    if(seFinalizaAhora){
      const util=(obra.cobrado||0)-(obra.gastos||0);
      fireToast(`🏁 ${obra.folio} finalizada — utilidad: ${cur(util)}. Su saldo ya forma parte de tus cajas generales.`);
    } else {
      fireToast(editObra?"✅ Proyecto actualizado":"✅ Proyecto creado");
    }
    setModal(null);setEditObra(null);
  };
  const counts=Object.keys(OBRA_STATUS).reduce((acc,k)=>({...acc,[k]:obras.filter(o=>o.status===k).length}),{});
  const deleteObra=(id)=>{
    setObras(p=>p.filter(x=>x.id!==id));
    setDetalleObra(null);
    fireToast("🗑 Proyecto eliminado");
  };
  if(detalleObra) return <>
    <ObraDetalle obra={detalleObra} onClose={()=>setDetalleObra(null)}
      onSave={(obra)=>{setDetalleObra(obra);saveObra(obra);}}
      onEdit={(obra)=>{setEditObra(obra);setModal("editar");}}
      onDelete={deleteObra}
      usuario={usuario} movs={movs} usuarios={usuarios}
      setMovs={setMovs} empleados={empleados} setEmpleados={setEmpleados}
      asistencia={asistencia} setAsistencia={setAsistencia}
      destajos={destajos} setDestajos={setDestajos}
      presupuestos={presupuestos} categorias={categorias}
      facturas={facturas} facturasApi={facturasApi}/>
    {(modal==="editar")&&<ObraModal onClose={()=>{setModal(null);setEditObra(null);}}
      onSave={(o)=>{saveObra(o);setDetalleObra(o);}} editObra={editObra} folioNext={nextFolio(obras,"OBR")} rol={rol}/>}
  </>;
  return <div style={{padding:"20px 20px 0"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div>
        <div style={{fontWeight:900,fontSize:22}}>Proyectos & Obras</div>
        <div style={{color:C.muted,fontSize:13}}>{obras.length} proyecto{obras.length!==1?"s":""} registrado{obras.length!==1?"s":""}</div>
      </div>
      {(rol==="director"||rol==="asistente")&&<Btn ch="+ Nuevo" v="primary" onClick={()=>{setEditObra(null);setModal("nueva");}}/>}
    </div>
    <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
      {[{v:"todos",label:"Todos",color:C.text,bg:C.surfaceAlt},...Object.entries(OBRA_STATUS).map(([v,s])=>({v,...s}))].map(s=>(
        <button key={s.v} onClick={()=>setFiltro(s.v)}

  borrador:   {label:"Borrador",   color:"#8A95A3", bg:"#F0F2F5", icon:"📝"},
  seguimiento:{label:"Enviado",    color:"#2563EB", bg:"#EFF6FF", icon:"📤"},

// PU = (Σmateriales + Σmano_obra + Σequipo) × (1 + indirectos%)
function calcAPU(apu) {
  if(!apu) return {mat:0,mo:0,eq:0,directo:0,indirecto:0,pu:0};
  const mat = (apu.materiales||[]).reduce((s,m)=>s+num(m.cantidad)*num(m.precio),0);
  const mo  = (apu.manoObra||[]).reduce((s,m)=>s+num(m.cantidad)*num(m.costo),0);
  const eq  = (apu.equipo||[]).reduce((s,m)=>s+num(m.cantidad)*num(m.costo),0);
  const directo = mat+mo+eq;
  const indirecto = directo*(num(apu.indirectosPct)/100);
  return {mat,mo,eq,directo,indirecto,pu:directo+indirecto};
}

  const dateStr = new Date((p.fecha||today)+"T12:00:00").toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"});
  const subtotal = p.grupos.reduce((s,g)=>s+g.conceptos.reduce((s2,c)=>s2+getPU(c)*num(c.cantidad),0),0);
  const ivaM = p.iva ? subtotal*0.16 : 0;
  const total = subtotal + ivaM;
  const ivaLabel = p.iva ? "IVA 16%" : "Sin IVA";

  let rowsHTML = "";
  p.grupos.forEach((g,gi)=>{
    const letra = String.fromCharCode(65+gi);
    rowsHTML += "<tr><td colspan='6' style='background:#E8EDF2;color:#374151;padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.3px;border-left:3px solid #8B1A1A'>"+letra+". "+(g.nombre||"")+"</td></tr>";
    g.conceptos.forEach((c,ci)=>{
      if(!c.desc) return;
      const pu = getPU(c);
      const bg = ci%2===0?"#FFFFFF":"#F8FAFC";
      rowsHTML += "<tr style='background:"+bg+"'>"
        + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:10px;color:#94A3B8;width:44px;text-align:center'>"+letra+"."+(ci+1)+"</td>"
        + "<td style='padding:6px 10px;border-bottom:1px solid #E2E8F0;font-size:11px'>"+(c.clave?"<b>"+c.clave+"</b> — ":"")+(c.desc||"")+"</td>"
        + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:center;width:50px'>"+(c.unidad||"")+"</td>"
        + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:center;width:45px'>"+(c.cantidad||1)+"</td>"
        + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:right;width:85px'>"+cur(pu)+"</td>"
        + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:right;font-weight:700;width:95px'>"+cur(pu*num(c.cantidad))+"</td>"

  const clausSrc = p.clausulasSelec||[];

      + "</div>" : "";

  const st = PRES_ST[p.status]||PRES_ST.borrador;
  const sBg = p.status==="autorizada"?"#D1FAE5":p.status==="rechazada"?"#FEE2E2":"#FEF3C7";
  const sColor = p.status==="autorizada"?"#065F46":p.status==="rechazada"?"#991B1B":"#92400E";

  const notHTML = p.notas ? "<div class='notas-bloque' style='margin-bottom:12px'><div style='font-size:11px;font-weight:800;color:#1E293B;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px'>Notas adicionales</div><div style='background:#FFFBEB;border-left:4px solid #F59E0B;padding:10px 14px;font-size:11px;color:#78350F;line-height:1.6;white-space:pre-wrap'>"+p.notas+"</div></div>" : "";

function imprimirPresupuesto(p, getPU) {
  const html = buildPresupuestoHTML(p, getPU);
  try {
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const limpiar = s => String(s||"").trim().replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g,"").replace(/ +/g,"_").slice(0,28);
    const proyectoNombre = limpiar(p.obra) || "";
    const clienteNombre = limpiar(p.cliente) || "Cliente";
    const fechaArchivo = (p.fecha||today).replace(/-/g,"");
    a.download = p.folio+(proyectoNombre?"_"+proyectoNombre:"")+"_"+clienteNombre+"_"+fechaArchivo+".html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    fireToast("📄 Descargado — ábrelo y usa Ctrl+P para PDF");
  } catch(e) {
    fireToast("⚠ Error al generar — intenta de nuevo");
  }
}

function PresupuestosTab({presupuestos,setPresupuestos,clausulas,setClausulas,usuario,obras=[],setObras}) {
  const esDirector=usuario?.rol==="director";
  const [volum,setVolum]=useState(null);
  const [editor,setEditor]=useState(null);
  const [filtro,setFiltro]=useState("todos");
  const getPUof=p=>c=>c.usaAPU&&c.apu?calcAPU(c.apu).pu:num(c.puManual);
  const getTotal=p=>{
    const g=getPUof(p);
    const sub=p.grupos.reduce((s,gr)=>s+gr.conceptos.reduce((s2,c)=>s2+g(c)*num(c.cantidad),0),0);
    return p.iva?sub*1.16:sub;
  };
  // El equipo solo ve presupuestos AUTORIZADOS de obras activas a las que tiene acceso
  const presVisibles=useMemo(()=>{
    if(esDirector) return presupuestos;
    return presupuestos.filter(p=>{
      if(p.status!=="autorizada") return false;
      const ligadas=obras.filter(o=>o.id===p.obraGeneradaId||o.presupuestoId===p.id);
      return ligadas.some(o=>obraVisible(o,usuario)&&o.status!=="terminada"&&o.status!=="cancelada");
    });
  },[presupuestos,obras,usuario]);
  const filtrados=filtro==="todos"?presVisibles:presVisibles.filter(p=>p.status===filtro);
  const generarProyecto=(pres)=>{
    const g=getPUof(pres);
    const total=pres.grupos.reduce((s,gr)=>s+gr.conceptos.reduce((s2,c)=>s2+g(c)*num(c.cantidad),0),0)*(pres.iva?1.16:1);
    const obra={
      id:uid(), folio:nextFolio(obras,"OBR"),

// ═══ CAJAS Y PRÉSTAMOS ═══════════════════════════════════════════
// Los saldos se derivan de los movimientos: nada se captura dos veces.
// Préstamos: entran/salen de caja pero NO cuentan como cobro ni gasto
// de obra (no ensucian la utilidad).
const CAJAS_DEF = [
  {id:"efectivo", label:"Efectivo",    icon:"💵", metodos:["efectivo"]},
  {id:"banco",    label:"TDD / Banco", icon:"💳", metodos:["tdd","transferencia","cheque"]},
  {id:"tdc",      label:"TDC",         icon:"💳", metodos:["tdc"]},
];
// Visibilidad: director ve todo; los demás solo obras con acceso y registros propios
const obraVisible = (obra, usuario) => usuario?.rol==="director" || (obra?.acceso||[]).includes(usuario?.id);
const registroPropio = (rec, usuario) => usuario?.rol==="director"
  || rec?.creadoPor===usuario?.id
  || (!rec?.creadoPor && !!rec?.registro && rec?.registro===usuario?.nombre); // registros antiguos: por nombre

const esPrestamoIn   = m => m.tipo==="ingreso" && m.subtipo==="prestamo";
const esPagoPrestamo = m => m.tipo==="egreso" && (m.esPagoPrestamo===true || m.categoria==="Pago de préstamo");

function saldosPorCaja(movs, obraId) {
  const mm = (movs||[]).filter(x=>x.status==="realizado"&&(!obraId||x.obraId===obraId));
  return CAJAS_DEF.map(c=>{
    const ing = mm.filter(x=>x.tipo==="ingreso"&&c.metodos.includes(x.metodo)).reduce((s,x)=>s+x.monto,0);
    const egr = mm.filter(x=>x.tipo==="egreso"&&c.metodos.includes(x.metodo)).reduce((s,x)=>s+x.monto,0);
    return {...c, saldo:ing-egr, tieneMovs:ing>0||egr>0};
  });
}

// De lo que hay en cada caja, cuánto sigue siendo préstamo sin pagar (no es utilidad todavía)
function pendientePrestamoPorCaja(movs, obraId) {
  const mm = (movs||[]).filter(x=>x.status==="realizado"&&(!obraId||x.obraId===obraId));
  const res={};
  CAJAS_DEF.forEach(c=>{
    const entradas = mm.filter(x=>esPrestamoIn(x)&&c.metodos.includes(x.metodo)).reduce((s,x)=>s+x.monto,0);
    const salidas  = mm.filter(x=>esPagoPrestamo(x)&&c.metodos.includes(x.metodo)).reduce((s,x)=>s+x.monto,0);
    res[c.id]=Math.max(0,entradas-salidas);
  });
  return res;
}

const esRetiro = m => m.tipo==="egreso" && m.esRetiroUtilidad===true;

const CAJA_META = {
  efectivo: {label:"Efectivo", metodo:"efectivo", icon:"💵"},

        const base={fecha:today,status:"realizado",registro:usuario?.nombre||"",creadoPor:usuario?.id||"",obraId:"__general",esTraspaso:true};
        onSave([

function resumenRetiros(movs) {
  const mm=(movs||[]).filter(x=>x.status==="realizado"&&esRetiro(x));
  const total=mm.reduce((s,x)=>s+x.monto,0);
  const lista=[...mm].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return {lista, total};
}

function resumenPrestamos(movs) {
  const mm = (movs||[]).filter(x=>x.status==="realizado");
  const por = {};
  mm.forEach(x=>{
    if(esPrestamoIn(x)) { const k=(x.prestamista||"Sin nombre").trim()||"Sin nombre"; (por[k]=por[k]||{prestado:0,pagado:0}).prestado+=x.monto; }
    else if(esPagoPrestamo(x)) { const k=(x.prestamista||"Sin nombre").trim()||"Sin nombre"; (por[k]=por[k]||{prestado:0,pagado:0}).pagado+=x.monto; }
  });
  const lista = Object.entries(por).map(([prestamista,v])=>({prestamista,...v,porPagar:v.prestado-v.pagado}))
    .sort((a,b)=>b.porPagar-a.porPagar);
  return {lista, totalPorPagar:lista.reduce((s,x)=>s+Math.max(0,x.porPagar),0)};
}

function SaldosCajasRow({movs, obraId, compact}) {
  const saldos = saldosPorCaja(movs, obraId).filter(c=>c.id!=="tdc"||c.tieneMovs);
  const pendPrestamo = pendientePrestamoPorCaja(movs, obraId);
  return <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
    {saldos.map(c=>{
      const p=pendPrestamo[c.id]||0;
      const hayPrestamo=p>0.5;
      return <div key={c.id} style={{flex:compact?"0 0 auto":1,minWidth:compact?110:(hayPrestamo?175:130),
        background:c.saldo<0?C.redBg:C.surfaceAlt,borderRadius:10,padding:compact?"7px 12px":"10px 14px"}}>
        <div style={{fontSize:10,color:C.muted,fontWeight:700}}>{c.icon} {c.label}</div>
        <div style={{fontWeight:900,fontSize:compact?14:16,color:c.saldo<0?C.red:C.text}}>{cur(c.saldo)}</div>
        {!compact&&hayPrestamo&&(
          <div style={{marginTop:5,paddingTop:5,borderTop:`1px solid ${C.border}`}}>
            <div style={{fontSize:10,color:C.orange,fontWeight:700}}>🤝 {cur(p)} es préstamo</div>
            <div style={{fontSize:10,color:C.green,fontWeight:700}}>✅ {cur(c.saldo-p)} es tuyo</div>
          </div>
        )}
      </div>;
    })}
  </div>;
}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
      <Inp label="Monto $ *" type="number" value={form.monto} onChange={e=>set("monto",e.target.value)} placeholder="0.00" step="0.01"/>
      <Inp label="Fecha" type="date" value={form.fecha} onChange={e=>set("fecha",e.target.value)}/>
      <Sel label="Caja / Método" value={form.metodo} onChange={e=>set("metodo",e.target.value)} options={Object.entries(METODOS).map(([v,{label,icon}])=>({v,l:`${icon} ${label}`}))}/>
      <Sel label="Estatus" value={form.status} onChange={e=>set("status",e.target.value)} options={[{v:"realizado",l:"✅ Realizado"},{v:"pendiente",l:"⏳ Pendiente"}]}/>
    </div>
    <div style={{display:"flex",gap:10,marginTop:6}}>
      <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
      <Btn ch="✅ Guardar" v={tipo==="ingreso"?"green":"primary"} style={{flex:1}} onClick={()=>{
        if(!esRetiroChk&&!form.obraId) return fireToast("⚠ Selecciona la obra");
        if(!form.concepto.trim()||!num(form.monto)) return fireToast("⚠ Falta concepto o monto");
        if((esPrestamoRecibido||(tipo==="egreso"&&esPago))&&!(form.prestamista||"").trim()) return fireToast("⚠ Indica el prestamista");
        onSave({...form,id:editMov?.id||uid(),tipo,monto:num(form.monto),
          obraId:esRetiroChk?"__general":form.obraId,
          categoria:tipo==="egreso"&&esPago?"Pago de préstamo":(esRetiroChk?"Retiro de utilidad":form.categoria),
          esPagoPrestamo:tipo==="egreso"&&esPago,
          esRetiroUtilidad:tipo==="egreso"&&esRetiroChk,
          prestamista:(esPrestamoRecibido||(tipo==="egreso"&&esPago))?(form.prestamista||"").trim():"",
          registro:editMov?.registro||usuario?.nombre||"",creadoPor:editMov?.creadoPor||usuario?.id||""});
        onClose();
      }}/>
    </div>
  </Modal>;
}

const PERIODOS_FIN = [
  {v:"todo",   l:"Todo"},
  {v:"dia",    l:"Hoy"},
  {v:"semana", l:"Semana"},
  {v:"mes",    l:"Mes"},
  {v:"anio",   l:"Año"},
];
function enPeriodoFin(fecha, periodo) {
  if(periodo==="todo") return true;
  if(!fecha) return false;
  if(periodo==="dia")    return fecha===today;
  if(periodo==="semana") { const d=semanaActual(); return fecha>=d[0]&&fecha<=d[6]; }
  if(periodo==="mes")    return fecha.slice(0,7)===today.slice(0,7);
  if(periodo==="anio")   return fecha.slice(0,4)===today.slice(0,4);
  return true;
}

function FinanzasTab({obras,movs,setMovs,usuario,categorias,setCategorias}) {

  const esDirector=rol==="director";

  const [periodo,setPeriodo]=useState("todo");
  const [modal,setModal]=useState(false);
  const [editMov,setEditMov]=useState(null);
  const [modalCat,setModalCat]=useState(false);
  const [prefPago,setPrefPago]=useState(null);
  const [showTraspaso,setShowTraspaso]=useState(false);
  // Todos los cálculos usan los movimientos DEL PERIODO seleccionado
  const movsPeriodo=useMemo(()=>movs.filter(m=>enPeriodoFin(m.fecha,periodo)),[movs,periodo]);
  const resumenObra=(obraId)=>{
    const m=movsPeriodo.filter(x=>x.obraId===obraId&&x.status==="realizado");
    const cobrado=m.filter(x=>x.tipo==="ingreso"&&!esPrestamoIn(x)).reduce((s,x)=>s+x.monto,0);
    const gastado=m.filter(x=>x.tipo==="egreso"&&!esPagoPrestamo(x)).reduce((s,x)=>s+x.monto,0);
    const pendientes=movsPeriodo.filter(x=>x.obraId===obraId&&x.status==="pendiente"&&x.tipo==="ingreso").reduce((s,x)=>s+x.monto,0);
    return {cobrado,gastado,utilidad:cobrado-gastado,pendientes};
  };
  const global=useMemo(()=>{
    const realizados=movsPeriodo.filter(x=>x.status==="realizado");
    const ingresos=realizados.filter(x=>x.tipo==="ingreso"&&!esPrestamoIn(x)&&!x.esTraspaso).reduce((s,x)=>s+x.monto,0);
    const egresos=realizados.filter(x=>x.tipo==="egreso"&&!esPagoPrestamo(x)&&!esRetiro(x)&&!x.esTraspaso).reduce((s,x)=>s+x.monto,0);
    // Por cobrar es saldo acumulado: siempre contra el total histórico, no el periodo
    const cobradoHistorico=(obraId)=>movs.filter(x=>x.obraId===obraId&&x.status==="realizado"&&x.tipo==="ingreso").reduce((s,x)=>s+x.monto,0);
    const porCobrar=obras.reduce((s,o)=>s+Math.max(0,(o.montoContrato||0)-cobradoHistorico(o.id)),0);
    return {ingresos,egresos,flujo:ingresos-egresos,porCobrar};
  },[movsPeriodo,movs,obras]);
  const movsFiltrados=useMemo(()=>{
    let r=[...movsPeriodo].sort((a,b)=>b.fecha.localeCompare(a.fecha));
    if(!esDirector){
      // Solo gastos, solo de obras con acceso, y solo los capturados por este usuario
      r=r.filter(m=>m.tipo==="egreso"&&!esPagoPrestamo(m)&&obras.some(o=>o.id===m.obraId)&&registroPropio(m,usuario));
    }
    if(obraSel==="__huerfanos") r=r.filter(m=>m.obraId!=="__general"&&!obras.some(o=>o.id===m.obraId));
    else if(obraSel==="__general") r=r.filter(m=>m.obraId==="__general");
    else if(obraSel!=="todas") r=r.filter(m=>m.obraId===obraSel);
    return r;
  },[movsPeriodo,obraSel,obras,usuario]);
  // Movimientos de obras que fueron eliminadas: siguen sumando en KPIs y saldos
  const huerfanos=useMemo(()=>movs.filter(m=>m.obraId!=="__general"&&!obras.some(o=>o.id===m.obraId)),[movs,obras]);
  const saveMov=(mov)=>{setMovs(p=>{const i=p.findIndex(x=>x.id===mov.id);return i>=0?p.map(x=>x.id===mov.id?mov:x):[mov,...p];});fireToast("✅ Movimiento guardado");};

}

function FlowStepper({status}) {
  const pasos=[
    {key:"solicitada",label:"Solicitada",icon:"📩"},
    {key:"aprobada",label:"Aprobada",icon:"👍"},
    {key:"ordenada",label:"Ordenada",icon:"🛒"},
    {key:"recibida",label:"Recibida",icon:"📦"},
  ];
  const pasoActual=COMPRA_ST[status]?.paso||0;
  if(status==="rechazada") return <div style={{background:C.redBg,borderRadius:10,padding:"8px 14px",textAlign:"center",color:C.red,fontWeight:700,fontSize:12}}>❌ Solicitud rechazada</div>;
  return <div style={{display:"flex",alignItems:"center",gap:0}}>
    {pasos.map((p,i)=>{
      const done=i+1<=pasoActual;
      return <div key={p.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",position:"relative"}}>
        {i>0&&<div style={{position:"absolute",left:"-50%",top:13,width:"100%",height:2.5,background:done?C.green:C.border,zIndex:0}}/>}
        <div style={{width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,zIndex:1,background:done?C.green:C.surfaceAlt,border:`2px solid ${done?C.green:C.border}`,color:done?"#fff":C.muted}}>{done?"✓":p.icon}</div>
        <div style={{fontSize:9,fontWeight:700,marginTop:4,color:done?C.green:C.muted}}>{p.label}</div>
      </div>;
    })}
  </div>;
}
