function buildOCHTML(sol, obra) {
  const dateStr = new Date((sol.fecha||today)+"T12:00:00").toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"});
  const total = sol.items.reduce((s,i)=>s+num(i.cantidad)*num(i.precio),0);
  const tienePrecios = sol.items.some(i=>num(i.precio)>0);

  let rowsHTML = "";
  sol.items.forEach((it,i)=>{
    const bg = i%2===0?"#FFFFFF":"#F8FAFC";
    rowsHTML += "<tr style='background:"+bg+"'>"
      + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:10px;color:#94A3B8;width:36px;text-align:center'>"+(i+1)+"</td>"
      + "<td style='padding:6px 10px;border-bottom:1px solid #E2E8F0;font-size:11px'>"+(it.desc||"")+"</td>"
      + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:center;width:55px'>"+(it.unidad||"")+"</td>"
      + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:center;width:50px'>"+(it.cantidad||1)+"</td>"
      + (tienePrecios
        ? "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:right;width:85px'>"+cur(it.precio)+"</td>"
          + "<td style='padding:6px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:right;font-weight:700;width:95px'>"+cur(num(it.cantidad)*num(it.precio))+"</td>"
        : "")
      + "</tr>";
  });

  const totHTML = tienePrecios
    ? "<div style='text-align:right;margin-bottom:12px'><div style='font-size:20px;font-weight:900;color:#8B1A1A'>TOTAL: "+cur(total)+"</div></div>"
    : "";

  const notasHTML = sol.notas ? "<div style='margin-bottom:12px;background:#FFFBEB;border-left:4px solid #F59E0B;padding:10px 14px;font-size:11px;color:#78350F;line-height:1.6'>"+sol.notas+"</div>" : "";

  const css = "* {margin:0;padding:0;box-sizing:border-box}"
    + "body {font-family:'Segoe UI',Arial,sans-serif;color:#1A202C;font-size:12px;line-height:1.5}"
    + "@page {size:letter;margin:12mm 15mm}"
    + "table {width:100%;border-collapse:collapse;margin-bottom:14px}"
    + "thead tr {background:#8B1A1A;color:#fff}"
    + "th {padding:8px 10px;text-align:left;font-size:11px;font-weight:800}"
    + ".firma-wrap {display:flex;justify-content:space-between;margin-top:26px;padding-top:14px;border-top:1px solid #E2E8F0;gap:20px}"
    + ".firma {flex:1;text-align:center}"
    + ".firma-line {border-top:1px solid #1A202C;margin-top:36px;padding-top:6px;font-size:10px;color:#64748B}"
    + ".footer {margin-top:12px;text-align:center;font-size:10px;color:#94A3B8;border-top:1px solid #E2E8F0;padding-top:8px}"
    + ".nop {text-align:center;padding:20px;background:#F8FAFC;border-top:1px solid #E2E8F0;margin-top:16px}"
    + "@media print { body {-webkit-print-color-adjust:exact;print-color-adjust:exact} .nop {display:none!important} }";

  return "<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'/><title>OC "+sol.folio+"</title><style>"+css+"</style></head><body><div class='page'>"
    + "<div style='display:flex;position:relative;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:3px solid #8B1A1A;margin-bottom:18px'>"
    + "<div style='display:flex;align-items:center'><img src='"+COMINS_LOGO_B64+"' style='height:130px;width:auto;flex-shrink:0' alt='COMINS'/><div style='position:absolute;left:50%;transform:translateX(-50%);text-align:center'><div style='font-size:18px;font-weight:900;color:#8B1A1A;letter-spacing:1.5px'>COMINS</div><div style='font-size:9px;color:#64748B;line-height:1.9;margin-top:3px'>Comercial Industrial y de Servicios<br/>Cd. Madero, Tamaulipas<br/>comins.madero@gmail.com | 833 381 39 89</div></div></div>"

    + "</div><div class='nop'><button onclick='window.print()' style='background:#8B1A1A;color:#fff;border:none;border-radius:8px;padding:12px 32px;font-size:15px;font-weight:700;cursor:pointer'>Imprimir / Guardar PDF</button></div></body></html>";
}

function imprimirOC(sol, obra) {
  const html = buildOCHTML(sol, obra);
  try {
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "OC-"+String(sol.folio||"").replace("SC-","")+"_"+(sol.proveedor||"Proveedor").replace(/ +/g,"_").slice(0,25)+".html";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    fireToast("📄 OC descargada — ábrela y Ctrl+P para PDF");
  } catch(e) { fireToast("⚠ Error al generar"); }
}

function correoOC(sol, obra) {
  const items = sol.items.map((i,n)=>(n+1)+". "+i.desc+" — "+i.cantidad+" "+i.unidad).join("%0D%0A");

  window.open("mailto:?subject="+asunto+"&body="+cuerpo, "_blank");
}

          {Object.entries(METODOS).map(([v,{label,icon}])=>(
            <button key={v} onClick={()=>setMetodoPago(v)}
              style={{background:metodoPago===v?C.green:C.surface,color:metodoPago===v?"#fff":C.sub,
                border:`1.5px solid ${metodoPago===v?C.green:C.border}`,borderRadius:9,padding:"6px 11px",
                fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{icon} {label}</button>

            registrarGasto("realizado",metodoPago);
            avanzar("recibida",`Material recibido · pagado (${METODOS[metodoPago]?.label})`,{status:"pagada",metodo:metodoPago});

        <Btn ch="💰 Registrar pago de esta OC" v="primary" style={{flex:1}} onClick={()=>setPagoStep("recibir")}/>

function ComprasTab({compras,setCompras,obras,usuario,setMovs}) {
  const [filtro,setFiltro]=useState("activas");
  const [obraSel,setObraSel]=useState("todas");
  const [modal,setModal]=useState(false);
  const [detalle,setDetalle]=useState(null);
  const rol=usuario?.rol;
  const filtradas=useMemo(()=>{
    let r=[...compras].sort((a,b)=>b.fecha.localeCompare(a.fecha));
    if(usuario?.rol!=="director") r=r.filter(c=>obras.some(o=>o.id===c.obraId));
    if(obraSel!=="todas") r=r.filter(c=>c.obraId===obraSel);
    if(filtro==="activas") r=r.filter(c=>!["recibida","rechazada"].includes(c.status));
    else if(filtro!=="todas") r=r.filter(c=>c.status===filtro);
    return r;
  },[compras,filtro,obraSel]);
  const totalObra=useMemo(()=>{
    if(obraSel==="todas") return null;
    return compras.filter(c=>c.obraId===obraSel&&["aprobada","ordenada","recibida"].includes(c.status))
      .reduce((s,c)=>s+c.items.reduce((s2,i)=>s2+num(i.cantidad)*num(i.precio),0),0);
  },[compras,obraSel]);
  const save=(sol)=>{
    setCompras(p=>{const i=p.findIndex(x=>x.id===sol.id);return i>=0?p.map(x=>x.id===sol.id?sol:x):[sol,...p];});
    fireToast("✅ Guardado");
  };
  const pendientesCount=compras.filter(c=>c.status==="solicitada").length;
  return <div style={{padding:"20px 20px 40px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div>
        <div style={{fontWeight:900,fontSize:22}}>Compras</div>
        <div style={{color:C.muted,fontSize:13}}>{pendientesCount>0?`${pendientesCount} solicitud${pendientesCount>1?"es":""} por aprobar`:"Sin pendientes"}</div>
      </div>
      <Btn ch="+ Solicitud" v="primary" onClick={()=>setModal(true)}/>
    </div>
    {/* Filtro por proyecto/obra */}
    <div style={{display:"flex",gap:8,marginBottom:10,overflowX:"auto",paddingBottom:4}}>
      {[{id:"todas",folio:"🏗 Todas las obras"},...obras].map(o=>(
        <button key={o.id} onClick={()=>setObraSel(o.id)}
          style={{background:obraSel===o.id?C.accentBg:"transparent",border:`1.5px solid ${obraSel===o.id?C.accent:C.border}`,color:obraSel===o.id?C.accent:C.muted,borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>
          {o.id==="todas"?o.folio:`${o.folio} — ${(o.nombre||"").slice(0,18)}${(o.nombre||"").length>18?"…":""}`}
        </button>
      ))}
    </div>
    {obraSel!=="todas"&&totalObra!==null&&rol!=="supervisor"&&(
      <div style={{background:C.blueBg,borderRadius:12,padding:"10px 16px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:13,fontWeight:700,color:C.blue}}>💰 Total comprado en esta obra</span>
        <span style={{fontSize:16,fontWeight:900,color:C.blue}}>{cur(totalObra)}</span>
      </div>
    )}
    <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
      {[{v:"activas",label:"Activas",color:C.text},{v:"todas",label:"Todas",color:C.text},...Object.entries(COMPRA_ST).map(([v,s])=>({v,...s}))].map(s=>(
        <button key={s.v} onClick={()=>setFiltro(s.v)}
          style={{background:filtro===s.v?(s.bg||C.surfaceAlt):"transparent",border:`1.5px solid ${filtro===s.v?s.color:C.border}`,color:filtro===s.v?s.color:C.muted,borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>
          {s.icon||""} {s.label}
        </button>
      ))}
    </div>
    {filtradas.length===0&&<Card style={{textAlign:"center",padding:40}}><div style={{fontSize:40,marginBottom:10}}>🛒</div><div style={{fontWeight:700,color:C.muted}}>Sin solicitudes en este filtro</div></Card>}
    {filtradas.map(sol=>{
      const st=COMPRA_ST[sol.status];
      const urg=URGENCIAS[sol.urgencia];
      const obra=obras.find(o=>o.id===sol.obraId);
      const total=sol.items.reduce((s,i)=>s+num(i.cantidad)*num(i.precio),0);
      return <Card key={sol.id} style={{marginBottom:12}} onClick={()=>setDetalle(sol)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
              <span style={{color:C.muted,fontSize:11,fontWeight:700}}>{sol.folio}</span>
              <Bdg label={st.label} color={st.color} bg={st.bg} icon={st.icon}/>
              {sol.urgencia!=="normal"&&<Bdg label={urg.label} color={urg.color} bg={urg.bg} icon="⚡"/>}
              {rol!=="supervisor"&&sol.pago?.status==="pagada"&&<Bdg label="Pagada" color={C.green} bg={C.greenBg} icon="💰"/>}
              {rol!=="supervisor"&&sol.pago?.status==="pendiente"&&sol.status!=="rechazada"&&<Bdg label="Por pagar" color={C.red} bg={C.redBg} icon="💰"/>}
              {rol!=="supervisor"&&sol.pago?.status==="contra_entrega"&&sol.status==="ordenada"&&<Bdg label="Contra entrega" color={C.orange} bg={C.orangeBg} icon="💰"/>}
            </div>
            <div style={{fontWeight:800,fontSize:14,marginBottom:2}}>
              {sol.items.length} material{sol.items.length!==1?"es":""} — {sol.items.slice(0,2).map(i=>i.desc).join(", ")}{sol.items.length>2?"...":""}
            </div>
            <div style={{fontSize:12,color:C.muted}}>🏗 {obra?.folio} · {sol.solicitante} · {fmtD(sol.fecha)}</div>
          </div>
          {rol!=="supervisor"&&total>0&&(
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:10,color:C.muted}}>Estimado</div>
              <div style={{fontWeight:900,fontSize:15}}>{cur(total)}</div>
            </div>
          )}
        </div>
        <FlowStepper status={sol.status}/>
      </Card>;
    })}
    {modal&&<SolicitudModal onClose={()=>setModal(false)} onSave={save} obras={obras} usuario={usuario} folioNext={nextFolio(compras,"SC")}/>}
    {detalle&&<SolicitudDetalle sol={detalle} onClose={()=>setDetalle(null)} onSave={save} obras={obras} usuario={usuario}
      onAddGasto={(g)=>setMovs&&setMovs(p=>[g,...p])}/>}
  </div>;
}

function semanaActual() {
  const d = new Date();
  const dia = d.getDay()||7;
  const lunes = new Date(d); lunes.setDate(d.getDate()-dia+1);
  const dias = [];
  for(let i=0;i<7;i++){
    const x = new Date(lunes); x.setDate(lunes.getDate()+i);
    dias.push(x.toISOString().split("T")[0]);
  }
  return dias;
}

function PagoCajaModal({titulo, monto, montoMax=null, onConfirm, onClose}) {
  const editable = montoMax!==null;
  const [metodo,setMetodo]=useState("efectivo");
  const [montoTxt,setMontoTxt]=useState(editable?String(montoMax):String(monto));
  const montoFinal = num(montoTxt);
  const esParcial = editable && montoFinal>0 && montoFinal < montoMax-0.005;
  return <Modal title={titulo} onClose={onClose}>
    {editable?(
      <div style={{marginBottom:14}}>
        <Lbl t={`Monto a pagar (saldo pendiente: ${cur(montoMax)})`}/>
        <input type="number" value={montoTxt} onChange={e=>setMontoTxt(e.target.value)} max={montoMax} min="0.01" step="0.01"
          style={{width:"100%",background:C.surfaceAlt,border:`1.5px solid ${C.border}`,borderRadius:10,
            padding:"12px 14px",fontSize:20,fontWeight:800,fontFamily:"inherit",color:C.green,boxSizing:"border-box",textAlign:"center"}}/>
        {esParcial&&<div style={{fontSize:12,color:C.orange,fontWeight:700,marginTop:6,textAlign:"center"}}>🤝 Es un anticipo — quedará pendiente {cur(montoMax-montoFinal)}</div>}
      </div>
    ):(
      <div style={{background:C.greenBg,borderRadius:12,padding:"14px 16px",marginBottom:14,textAlign:"center"}}>
        <div style={{fontSize:10,color:C.green,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>Monto a pagar</div>
        <div style={{fontWeight:900,fontSize:24,color:C.green}}>{cur(monto)}</div>
      </div>
    )}
    <Lbl t="¿De qué caja sale?"/>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
      {Object.entries(METODOS).map(([v,{label,icon}])=>(
        <button key={v} onClick={()=>setMetodo(v)}
          style={{background:metodo===v?C.green:C.surface,color:metodo===v?"#fff":C.sub,
            border:`1.5px solid ${metodo===v?C.green:C.border}`,borderRadius:10,padding:"9px 14px",
            fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{icon} {label}</button>
      ))}
    </div>
    <div style={{display:"flex",gap:10}}>
      <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
      <Btn ch={esParcial?"🤝 Confirmar anticipo":"💵 Confirmar pago"} v="green" style={{flex:1}} onClick={()=>{
        if(editable&&(montoFinal<=0||montoFinal>montoMax+0.01)) return fireToast("⚠ Monto inválido");
        onConfirm(metodo,montoFinal);onClose();
      }}/>
    </div>
  </Modal>;
}

function buildInsumosHTML(obra, pres) {
  const dateStr = new Date(today+"T12:00:00").toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"});
  let cuerpo = "";
  pres.grupos.forEach((g,gi)=>{
    const letra = String.fromCharCode(65+gi);
    const conAPU = g.conceptos.filter(c=>c.desc&&c.usaAPU&&c.apu&&(c.apu.materiales||[]).length>0);
    if(conAPU.length===0) return;
    cuerpo += "<tr><td colspan='4' style='background:#E8EDF2;color:#374151;padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.3px;border-left:3px solid #8B1A1A'>"+letra+". "+(g.nombre||"")+"</td></tr>";
    conAPU.forEach((c,ci)=>{
      cuerpo += "<tr><td colspan='4' style='background:#F9F0F0;padding:7px 10px;font-size:10.5px;font-weight:700;color:#8B1A1A'>"
        + letra+"."+(ci+1)+" "+(c.clave?c.clave+" — ":"")+c.desc+" &nbsp;·&nbsp; Volumen: "+c.cantidad+" "+(c.unidad||"")+"</td></tr>";
      (c.apu.materiales||[]).forEach((mat,mi)=>{
        const total = num(mat.cantidad)*num(c.cantidad);
        const bg = mi%2===0?"#FFFFFF":"#F8FAFC";
        cuerpo += "<tr style='background:"+bg+"'>"
          + "<td style='padding:5px 8px;border-bottom:1px solid #E2E8F0;font-size:10px;color:#94A3B8;width:36px;text-align:center'>"+(mi+1)+"</td>"
          + "<td style='padding:5px 10px;border-bottom:1px solid #E2E8F0;font-size:11px'>"+(mat.desc||"")+"</td>"
          + "<td style='padding:5px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:center;width:60px'>"+(mat.unidad||"")+"</td>"
          + "<td style='padding:5px 8px;border-bottom:1px solid #E2E8F0;font-size:11px;text-align:right;font-weight:700;width:90px'>"+total.toLocaleString("es-MX",{maximumFractionDigits:2})+"</td>"
          + "</tr>";
      });
    });
  });

  const css = "* {margin:0;padding:0;box-sizing:border-box}"
    + "body {font-family:'Segoe UI',Arial,sans-serif;color:#1A202C;font-size:12px;line-height:1.5}"
    + "@page {size:letter;margin:12mm 15mm}"
    + "table {width:100%;border-collapse:collapse;margin-bottom:14px}"
    + "thead {display:table-header-group}"
    + "thead tr {background:#8B1A1A;color:#fff}"
    + "th {padding:8px 10px;text-align:left;font-size:11px;font-weight:800}"
    + "tr {page-break-inside:avoid}"
    + ".footer {margin-top:12px;text-align:center;font-size:10px;color:#94A3B8;border-top:1px solid #E2E8F0;padding-top:8px}"
    + ".nop {text-align:center;padding:20px;background:#F8FAFC;border-top:1px solid #E2E8F0;margin-top:16px}"
    + "@media print { body {-webkit-print-color-adjust:exact;print-color-adjust:exact} .nop {display:none!important} }";

  return "<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'/><title>Explosión de Insumos "+(obra?.folio||"")+"</title><style>"+css+"</style></head><body><div class='page'>"
    + "<div style='display:flex;position:relative;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:3px solid #8B1A1A;margin-bottom:18px'>"
    + "<div style='display:flex;align-items:center'><img src='"+COMINS_LOGO_B64+"' style='height:130px;width:auto;flex-shrink:0' alt='COMINS'/><div style='position:absolute;left:50%;transform:translateX(-50%);text-align:center'><div style='font-size:18px;font-weight:900;color:#8B1A1A;letter-spacing:1.5px'>COMINS</div><div style='font-size:9px;color:#64748B;line-height:1.9;margin-top:3px'>Comercial Industrial y de Servicios<br/>Cd. Madero, Tamaulipas<br/>comins.madero@gmail.com | 833 381 39 89</div></div></div>"
    + "<div style='text-align:right'><div style='font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:1px'>Explosión de Insumos</div><div style='color:#8B1A1A;font-size:14px;font-weight:900;margin-top:2px'>"+(obra?.folio||"")+"</div><div style='font-size:10px;color:#64748B;margin-top:3px'>Presupuesto: "+(pres.folio||"")+"</div><div style='font-size:10px;color:#64748B;margin-top:2px'>Fecha: "+dateStr+"</div></div></div>"
    + "<div style='background:#F9F0F0;border-left:4px solid #8B1A1A;border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:16px'><div style='font-size:14px;font-weight:800'>"+(obra?.nombre||pres.obra||"")+"</div><div style='font-size:11px;color:#64748B;margin-top:3px'>Cliente: "+(pres.cliente||"")+"</div></div>"
    + "<table><thead><tr><th style='width:36px;text-align:center'>No.</th><th>Material / Insumo</th><th style='width:60px;text-align:center'>Unidad</th><th style='width:90px;text-align:right'>Cantidad</th></tr></thead><tbody>"+cuerpo+"</tbody></table>"
    + "<div class='footer'>Cantidades calculadas desde los análisis de precios unitarios (APU) · Documento interno de obra<br/>COMINS — Cd. Madero, Tamaulipas</div>"
    + "</div><div class='nop'><button onclick='window.print()' style='background:#8B1A1A;color:#fff;border:none;border-radius:8px;padding:12px 32px;font-size:15px;font-weight:700;cursor:pointer'>Imprimir / Guardar PDF</button></div></body></html>";
}

function imprimirInsumos(obra, pres) {
  const html = buildInsumosHTML(obra, pres);
  try {
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "EXPLOSION_INSUMOS_"+(obra?.folio||"")+"_"+today.replace(/-/g,"")+".html";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    fireToast("📄 Explosión descargada — ábrela y Ctrl+P para PDF");
  } catch(e) { fireToast("⚠ Error al generar"); }
}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
      <Sel label="Tipo de pago" value={form.tipo} onChange={e=>set("tipo",e.target.value)}

function DestajoModal({onClose,onSave,empleados,obras,verMontos,usuario,editDest=null,onEditGasto=null}) {
  const destajistas=empleados.filter(e=>e.tipo==="destajo"&&e.activo);
  const [form,setForm]=useState(editDest||{empleadoId:destajistas[0]?.id||"",obraId:obras[0]?.id||"",desc:"",monto:"",fecha:today});
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));
  const pagosArr=editDest?.pagos||[];
  const pagoUnicoTotal = pagosArr.length===1 && Math.abs(pagosArr[0].monto-(editDest?.monto||0))<0.01 ? pagosArr[0] : null;
  const [syncFinanzas,setSyncFinanzas]=useState(!!pagoUnicoTotal);
  return <Modal title={editDest?"✏ Editar destajo":"🔨 Nuevo destajo"} onClose={onClose}>
    {pagosArr.length>0&&!pagoUnicoTotal&&(
      <div style={{background:C.orangeBg,borderRadius:11,padding:"10px 13px",marginBottom:14,fontSize:12,color:C.orange,fontWeight:700}}>
        ⚠ Este destajo ya tiene {pagosArr.length} pagos parciales registrados en Finanzas.
        Si cambias el monto aquí, esos movimientos NO se ajustan solos — edítalos también en Finanzas si hace falta.
      </div>
    )}
    {pagoUnicoTotal&&onEditGasto&&(
      <label style={{display:"flex",alignItems:"flex-start",gap:8,cursor:"pointer",fontSize:12,fontWeight:700,color:C.blue,marginBottom:14,background:C.blueBg,borderRadius:11,padding:"10px 13px"}}>
        <input type="checkbox" checked={syncFinanzas} onChange={e=>setSyncFinanzas(e.target.checked)} style={{width:16,height:16,accentColor:C.blue,marginTop:2}}/>
        <span>🔄 Actualizar también el pago ya registrado en Finanzas ({cur(pagoUnicoTotal.monto)} → nuevo monto)</span>
      </label>
    )}
    <Sel label="Destajista *" value={form.empleadoId} onChange={e=>set("empleadoId",e.target.value)} options={destajistas.map(e=>({v:e.id,l:e.nombre}))}/>
    <Sel label="Obra" value={form.obraId} onChange={e=>set("obraId",e.target.value)} options={obras.map(o=>({v:o.id,l:`${o.folio} — ${o.nombre}`}))}/>
    <Inp label="Descripción del trabajo *" value={form.desc} onChange={e=>set("desc",e.target.value)} placeholder="Ej: Soldadura de estructura..."/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}>
      {verMontos&&<Inp label="Monto acordado $ *" type="number" value={form.monto} onChange={e=>set("monto",e.target.value)} placeholder="0.00"/>}
      <Inp label="Fecha" type="date" value={form.fecha} onChange={e=>set("fecha",e.target.value)}/>
    </div>
    <div style={{display:"flex",gap:10,marginTop:6}}>
      <Btn ch="Cancelar" v="ghost" onClick={onClose}/>
      <Btn ch={editDest?"💾 Guardar cambios":"✅ Asignar"} v="primary" style={{flex:1}} onClick={()=>{
        if(!form.desc.trim()) return fireToast("⚠ Falta la descripción");
        const montoNuevo=num(form.monto);
        let pagosFinal=form.pagos;
        if(pagoUnicoTotal&&syncFinanzas&&Math.abs(montoNuevo-pagoUnicoTotal.monto)>0.005){
          pagosFinal=[{...pagoUnicoTotal,monto:montoNuevo}];
          onEditGasto&&onEditGasto(pagoUnicoTotal.gastoId,{monto:montoNuevo});
          fireToast("🔄 Pago en Finanzas actualizado");
        }
        onSave({...form,pagos:pagosFinal,id:editDest?.id||uid(),monto:montoNuevo,status:editDest?.status||"asignado",creadoPor:editDest?.creadoPor||usuario?.id||"",registro:editDest?.registro||usuario?.nombre||""});
        onClose();
      }}/>
    </div>
  </Modal>;
}

function PersonalTab({empleados:empleadosAll,setEmpleados,asistencia,setAsistencia,destajos:destajosAll,setDestajos,obras,usuario,soloObraId=null,onAddGasto=null,onEditGasto=null,onRemoveGasto=null,embedded=false}) {

  const dias=semanaActual();

    (soloObraId?e.obraId===soloObraId:(esDirector||obras.some(o=>o.id===e.obraId)))&&registroPropio(e,usuario)
  ),[empleadosAll,obras,usuario,soloObraId]);

    (soloObraId?d.obraId===soloObraId:(esDirector||obras.some(o=>o.id===d.obraId)))&&registroPropio(d,usuario)

  const [pagoNomina,setPagoNomina]=useState(false); // nómina de la semana
  const toggleAsistencia=(empId,fecha)=>{
    const key=`${empId}_${fecha}`;
    setAsistencia(p=>({...p,[key]:!p[key]}));
  };
  const nominaSemana=(emp)=>{
    const diasTrabajados=dias.filter(d=>asistencia[`${emp.id}_${d}`]).length;
    return {dias:diasTrabajados,total:diasTrabajados*emp.salarioDia};
  };
  const totalNominaSemana=empleados.filter(e=>e.tipo==="jornal"&&e.activo).reduce((s,e)=>s+nominaSemana(e).total,0);
  const totalDestajosPend=destajos.filter(d=>d.status==="terminado").reduce((s,d)=>s+d.monto,0);
  const jornaleros=empleados.filter(e=>e.tipo==="jornal"&&e.activo);
  const saveEmp=(emp)=>{
    setEmpleados(p=>{const i=p.findIndex(x=>x.id===emp.id);return i>=0?p.map(x=>x.id===emp.id?emp:x):[...p,emp];});
    fireToast("✅ Trabajador guardado");
  };
  const cambiarStatusDestajo=(id,status)=>{
    setDestajos(p=>p.map(d=>d.id===id?{...d,status}:d));
    fireToast(status==="terminado"?"✅ Marcado terminado":status==="pagado"?"💵 Marcado pagado":"Actualizado");
  };
  return <div style={{padding:"20px 20px 40px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div>
        <div style={{fontWeight:900,fontSize:22}}>Personal</div>
        <div style={{color:C.muted,fontSize:13}}>{empleados.filter(e=>e.activo).length} trabajadores activos</div>
      </div>
      <Btn ch="+ Trabajador" v="primary" onClick={()=>{setEditEmp(null);setModalEmp(true);}}/>
    </div>
    {verMontos&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
      <div style={{background:C.blueBg,borderRadius:14,padding:"14px 16px"}}>
        <div style={{fontSize:10,color:C.blue,fontWeight:700,textTransform:"uppercase"}}>📅 Nómina semana (jornal)</div>
        <div style={{fontWeight:900,fontSize:18,color:C.blue}}>{cur(totalNominaSemana)}</div>
      </div>
      <div style={{background:C.orangeBg,borderRadius:14,padding:"14px 16px"}}>
        <div style={{fontSize:10,color:C.orange,fontWeight:700,textTransform:"uppercase"}}>🔨 Destajos por pagar</div>
        <div style={{fontWeight:900,fontSize:18,color:C.orange}}>{cur(totalDestajosPend)}</div>
      </div>
    </div>}
    <div style={{display:"flex",background:C.surfaceAlt,borderRadius:12,padding:4,gap:4,marginBottom:16}}>
      {[{v:"asistencia",l:"📅 Asistencia"},{v:"destajos",l:"🔨 Destajos"},{v:"plantilla",l:"👷 Plantilla"}].map(t=>(
        <button key={t.v} onClick={()=>setVista(t.v)} style={{flex:1,background:vista===t.v?C.surface:"transparent",border:"none",borderRadius:9,padding:"9px 6px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:vista===t.v?C.accent:C.muted,boxShadow:vista===t.v?C.shadow:"none"}}>{t.l}</button>
      ))}
    </div>
    {vista==="asistencia"&&<>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
        <div style={{fontSize:12,color:C.muted,fontWeight:600}}>Semana del {fmtD(dias[0])} al {fmtD(dias[6])} — toca el día para marcar</div>
        {onAddGasto&&totalNominaSemana>0&&<Btn ch={`💵 Pagar nómina de la semana (${cur(totalNominaSemana)})`} v="green" sm onClick={()=>setPagoNomina(true)}/>}
      </div>
      {jornaleros.length===0&&<Card style={{textAlign:"center",padding:32}}><div style={{fontSize:32,marginBottom:8}}>📅</div><div style={{fontWeight:700,color:C.muted}}>Sin trabajadores por jornal</div></Card>}
      {jornaleros.map(emp=>{
        const nom=nominaSemana(emp);
        const obra=obras.find(o=>o.id===emp.obraId);
        return <Card key={emp.id} style={{marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div>
              <div style={{fontWeight:800,fontSize:14}}>{emp.nombre}</div>
              <div style={{fontSize:12,color:C.muted}}>{emp.puesto} · {obra?.folio||"—"}</div>
            </div>
            {verMontos?(
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:10,color:C.muted}}>{nom.dias} día{nom.dias!==1?"s":""} × {cur(emp.salarioDia)}</div>
                <div style={{fontWeight:900,fontSize:15,color:C.green}}>{cur(nom.total)}</div>
              </div>
            ):(
              <Bdg label={`${nom.dias} día${nom.dias!==1?"s":""}`} color={C.blue} bg={C.blueBg}/>
            )}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
            {dias.map((d,i)=>{
              const marcado=asistencia[`${emp.id}_${d}`];
              const esHoy=d===today;
              return <button key={d} onClick={()=>toggleAsistencia(emp.id,d)}
                style={{background:marcado?C.green:C.surfaceAlt,border:`2px solid ${esHoy?C.accent:marcado?C.green:C.border}`,borderRadius:10,padding:"8px 2px",cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:2,transition:"all .15s"}}>
                <span style={{fontSize:10,fontWeight:700,color:marcado?"#ffffffbb":C.muted}}>{DIAS_CORTOS[i]}</span>
                <span style={{fontSize:13,fontWeight:800,color:marcado?"#fff":C.sub}}>{d.split("-")[2]}</span>
              </button>;
            })}
          </div>
        </Card>;
      })}
    </>}
    {vista==="destajos"&&<>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
        <Btn ch="+ Destajo" v="primary" sm onClick={()=>setModalDest(true)}/>
      </div>
      {destajos.length===0&&<Card style={{textAlign:"center",padding:32}}><div style={{fontSize:32,marginBottom:8}}>🔨</div><div style={{fontWeight:700,color:C.muted}}>Sin destajos</div></Card>}
      {destajos.map(d=>{
        const emp=empleados.find(e=>e.id===d.empleadoId);
        const obra=obras.find(o=>o.id===d.obraId);
        const pagosArr=d.pagos||[];
        const montoPagado=pagosArr.reduce((s,p)=>s+p.monto,0);
        const saldoDest=Math.round((d.monto-montoPagado)*100)/100;
        const yaLiquidado=d.status==="pagado"||saldoDest<=0.005;
        const stColors={asignado:{c:C.blue,bg:C.blueBg,l:"Asignado",i:"📋"},terminado:{c:C.orange,bg:C.orangeBg,l:"Terminado — por pagar",i:"✅"},pagado:{c:C.green,bg:C.greenBg,l:"Pagado",i:"💵"}};
        const st=yaLiquidado?stColors.pagado:stColors[d.status];
        return <Card key={d.id} style={{marginBottom:10,borderLeft:`3px solid ${st.c}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:8}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:6,marginBottom:4,flexWrap:"wrap"}}>
                <Bdg label={st.l} color={st.c} bg={st.bg} icon={st.i}/>
                <Bdg label={obra?.folio||"—"} color={C.purple} bg={C.purpleBg}/>
                {!yaLiquidado&&montoPagado>0&&<Bdg label={`Anticipo: ${cur(montoPagado)}`} color={C.orange} bg={C.orangeBg} icon="🤝"/>}
              </div>
              <div style={{fontWeight:700,fontSize:14}}>{d.desc}</div>
              <div style={{fontSize:12,color:C.muted,marginTop:2}}>👷 {emp?.nombre||"—"} · {fmtD(d.fecha)}{d.registro?` · ✍ ${d.registro}`:""}</div>
            </div>
            <div style={{textAlign:"right"}}>
              {verMontos&&<div style={{fontWeight:900,fontSize:16,color:st.c,whiteSpace:"nowrap"}}>{cur(d.monto)}</div>}
              {!yaLiquidado&&montoPagado>0&&<div style={{fontSize:11,color:C.muted,marginTop:2}}>Saldo: {cur(saldoDest)}</div>}
            </div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <Btn ch="✏" v="ghost" sm onClick={()=>{setEditDest(d);setModalDest(true);}}/>
            {d.status==="asignado"&&<Btn ch="✅ Marcar terminado" v="ghost" sm style={{flex:1}} onClick={()=>cambiarStatusDestajo(d.id,"terminado")}/>}
            {!yaLiquidado&&verMontos&&<Btn ch={montoPagado>0?"💵 Abonar / Liquidar":"💵 Pagar"} v="green" sm style={{flex:1}} onClick={()=>onAddGasto?setPagoDest({...d,saldoDest}):cambiarStatusDestajo(d.id,"pagado")}/>}
            <Btn ch="🗑" v="ghost" sm style={{color:C.red}} onClick={()=>{
              const tieneGastos=pagosArr.length>0;
              const msg=tieneGastos
                ? `Este destajo tiene ${pagosArr.length} pago(s) por ${cur(montoPagado)} ya registrados en Finanzas.\n\n¿Eliminar TAMBIÉN esos movimientos de Finanzas?\n\nAceptar = borrar destajo y sus gastos ligados\nCancelar = solo borrar el destajo (los gastos quedan en Finanzas)`
                : `¿Eliminar el destajo "${d.desc}"?`;
              if(tieneGastos){
                const borrarTodo=window.confirm(msg);
                if(onRemoveGasto) pagosArr.forEach(p=>{if(borrarTodo) onRemoveGasto(p.gastoId);});
                setDestajos(prev=>prev.filter(x=>x.id!==d.id));
                fireToast(borrarTodo?"🗑 Destajo y gastos eliminados":"🗑 Destajo eliminado (gastos se quedan en Finanzas)");
              } else {
                if(window.confirm(msg)){
                  setDestajos(prev=>prev.filter(x=>x.id!==d.id));
                  fireToast("🗑 Destajo eliminado");
                }
              }
            }}/>
          </div>
        </Card>;
      })}
    </>}
    {vista==="plantilla"&&<>
      {empleados.map(emp=>{
        const obra=obras.find(o=>o.id===emp.obraId);
        return <Card key={emp.id} style={{marginBottom:10,opacity:emp.activo?1:.5}} onClick={registroPropio(emp,usuario)?()=>{setEditEmp(emp);setModalEmp(true);}:undefined}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:3}}>
                <span style={{fontWeight:800,fontSize:14}}>{emp.nombre}</span>
                <Bdg label={emp.tipo==="jornal"?"Jornal":"Destajo"} color={emp.tipo==="jornal"?C.blue:C.orange} bg={emp.tipo==="jornal"?C.blueBg:C.orangeBg} icon={emp.tipo==="jornal"?"📅":"🔨"}/>
                {!emp.activo&&<Bdg label="Inactivo" color={C.muted} bg={C.surfaceAlt}/>}
              </div>
              <div style={{fontSize:12,color:C.muted}}>{emp.puesto} · 🏗 {obra?.folio||"Sin obra"}{emp.registro?` · ✍ ${emp.registro}`:""}</div>
            </div>
            {verMontos&&emp.tipo==="jornal"&&(
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:10,color:C.muted}}>Por día</div>
                <div style={{fontWeight:900,fontSize:15}}>{cur(emp.salarioDia)}</div>
              </div>
            )}
          </div>
        </Card>;
      })}
    </>}
    {modalEmp&&<EmpleadoModal onClose={()=>{setModalEmp(false);setEditEmp(null);}} onSave={saveEmp} obras={obras} editEmp={editEmp} usuario={usuario}/>}
    {pagoDest&&(()=>{
      const emp=empleados.find(e=>e.id===pagoDest.empleadoId);
      return <PagoCajaModal titulo={`💵 Pagar destajo — ${emp?.nombre||""}`} monto={pagoDest.saldoDest} montoMax={pagoDest.saldoDest}
        onClose={()=>setPagoDest(null)}
        onConfirm={(metodo,montoElegido)=>{
          const gastoId=uid();
          const esLiquidacion=montoElegido>=pagoDest.saldoDest-0.005;
          onAddGasto({id:gastoId,obraId:pagoDest.obraId,tipo:"egreso",categoria:"Mano de obra",
            concepto:`${esLiquidacion?"Destajo":"Anticipo destajo"} — ${pagoDest.desc} (${emp?.nombre||""})`,monto:montoElegido,fecha:today,
            metodo,status:"realizado",registro:usuario?.nombre||"",creadoPor:usuario?.id||""});
          setDestajos(prev=>prev.map(x=>x.id!==pagoDest.id?x:{
            ...x,
            pagos:[...(x.pagos||[]),{monto:montoElegido,fecha:today,metodo,registro:usuario?.nombre||"",creadoPor:usuario?.id||"",gastoId}],
            status:esLiquidacion?"pagado":x.status,
          }));
          fireToast(esLiquidacion?"💰 Destajo liquidado y registrado en Finanzas":"🤝 Anticipo registrado en Finanzas");
        }}/>;
    })()}
    {pagoNomina&&<PagoCajaModal titulo="💵 Pagar nómina de la semana" monto={totalNominaSemana}
      onClose={()=>setPagoNomina(false)}
      onConfirm={(metodo)=>{
        // Un gasto por obra, con el total de sus jornaleros
        const porObra={};
        jornaleros.forEach(e=>{const n=nominaSemana(e);if(n.total>0)porObra[e.obraId]=(porObra[e.obraId]||0)+n.total;});
        Object.entries(porObra).forEach(([obraId,monto])=>{
          onAddGasto({id:uid(),obraId,tipo:"egreso",categoria:"Mano de obra",
            concepto:`Nómina semana ${fmtD(dias[0])} – ${fmtD(dias[6])}`,monto,fecha:today,
            metodo,status:"realizado",registro:usuario?.nombre||"",creadoPor:usuario?.id||""});
        });
        fireToast("💰 Nómina registrada en Finanzas por obra");
      }}/>}
    {modalDest&&<DestajoModal onClose={()=>{setModalDest(false);setEditDest(null);}} obras={obras} empleados={empleados} verMontos={verMontos} usuario={usuario} editDest={editDest} onEditGasto={onEditGasto}
      onSave={(d)=>{setDestajos(p=>{const i=p.findIndex(x=>x.id===d.id);return i>=0?p.map(x=>x.id===d.id?d:x):[d,...p];});fireToast(editDest?"✅ Destajo actualizado":"✅ Destajo asignado");}}/>}
  </div>;
}

function InventarioModal({onClose,onSave,obras,editItem=null}) {
  const [form,setForm]=useState(editItem||{nombre:"",unidad:"PZA",cantidad:"",min:"",obraId:obras[0]?.id||"",categoria:"Material"});

function getDeviceId() {
  try {
    let id = localStorage.getItem("comins_device_id");
    if(!id) {
      id = Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2);
      localStorage.setItem("comins_device_id", id);
    }
    return id;
  } catch(e) { return "sin-storage-" + Date.now().toString(36); }
}
const DEVICE_ID = getDeviceId();
const codigoDisp = id => String(id||"").slice(-6).toUpperCase();

  const pendientes = dispositivos.filter(d=>!d.autorizado);

    {autorizados.map(d=><DispRow key={d.id} d={d}/>)}
  </Modal>;
}

// MÓDULO FACTURAS — Contador carga XML+PDF, Director consulta
// Archivos por documento propio en Firestore (colecciones aparte)
// ═══════════════════════════════════════════════════════════════
function parseCFDI(xmlText) {
  try {
    const doc = new DOMParser().parseFromString(xmlText, "text/xml");
    if(doc.getElementsByTagName("parsererror").length) return null;
    const one = tag => doc.getElementsByTagName("cfdi:"+tag)[0] || doc.getElementsByTagName(tag)[0] || null;
    const all = tag => {
      let r = Array.from(doc.getElementsByTagName("cfdi:"+tag));
      if(r.length===0) r = Array.from(doc.getElementsByTagName(tag));
      return r;
    };
    const at = (el,a) => el ? (el.getAttribute(a)||"") : "";
    const comp = doc.documentElement;
    const emisor = one("Emisor"), receptor = one("Receptor");
    const tfd = doc.getElementsByTagName("tfd:TimbreFiscalDigital")[0] || doc.getElementsByTagName("TimbreFiscalDigital")[0] || null;
    const conceptos = all("Concepto").map(c=>({
      cantidad: at(c,"Cantidad"), claveUnidad: at(c,"ClaveUnidad"), unidad: at(c,"Unidad"),
      claveProdServ: at(c,"ClaveProdServ"), descripcion: at(c,"Descripcion"),
      valorUnitario: at(c,"ValorUnitario"), importe: at(c,"Importe"), descuento: at(c,"Descuento"),
    }));
    let totalImpuestos = "";
    const imps = all("Impuestos");
    if(imps.length) totalImpuestos = at(imps[imps.length-1],"TotalImpuestosTrasladados") || at(imps[0],"TotalImpuestosTrasladados");
    return {
      version: at(comp,"Version"), serie: at(comp,"Serie"), folioFactura: at(comp,"Folio"),
      fecha: at(comp,"Fecha"), subTotal: at(comp,"SubTotal"), descuento: at(comp,"Descuento"),
      total: at(comp,"Total"), moneda: at(comp,"Moneda"), tipoComprobante: at(comp,"TipoDeComprobante"),
      formaPago: at(comp,"FormaPago"), metodoPago: at(comp,"MetodoPago"),
      lugarExpedicion: at(comp,"LugarExpedicion"), condicionesDePago: at(comp,"CondicionesDePago"),
      noCertificado: at(comp,"NoCertificado"), sello: at(comp,"Sello"),
      emisor: { rfc: at(emisor,"Rfc"), nombre: at(emisor,"Nombre"), regimen: at(emisor,"RegimenFiscal") },
      receptor: { rfc: at(receptor,"Rfc"), nombre: at(receptor,"Nombre"), usoCFDI: at(receptor,"UsoCFDI"),
        domicilio: at(receptor,"DomicilioFiscalReceptor"), regimen: at(receptor,"RegimenFiscalReceptor") },
      conceptos, totalImpuestos,
      uuid: at(tfd,"UUID"), fechaTimbrado: at(tfd,"FechaTimbrado"), selloSAT: at(tfd,"SelloSAT"),
      selloCFD: at(tfd,"SelloCFD"), noCertificadoSAT: at(tfd,"NoCertificadoSAT"), rfcProvCertif: at(tfd,"RfcProvCertif"),
    };
  } catch(e) { return null; }
}

const fmtHora = iso => { try { return new Date(iso).toLocaleString("es-MX",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); } catch(e){ return iso; } };
const curX = v => cur(parseFloat(v)||0);

  return "<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'/><title>Factura "+(d.serie||"")+(d.folioFactura||"")+"</title><style>"+css+"</style></head><body>"
    + "<div style='display:flex;position:relative;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:3px solid #8B1A1A;margin-bottom:16px'>"
    + "<div style='display:flex;align-items:center'><img src='"+COMINS_LOGO_B64+"' style='height:120px;width:auto' alt='COMINS'/><div style='position:absolute;left:50%;transform:translateX(-50%);text-align:center'><div style='font-size:18px;font-weight:900;color:#8B1A1A;letter-spacing:1.5px'>COMINS</div><div style='font-size:9px;color:#64748B;line-height:1.9;margin-top:3px'>Comercial Industrial y de Servicios<br/>"+(d.emisor?.rfc?("RFC: "+d.emisor.rfc+"<br/>"):"")+"Cd. Madero, Tamaulipas | 833 381 39 89</div></div></div>"
    + "<div style='text-align:right'><div style='font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:1px'>Factura</div><div style='color:#8B1A1A;font-size:14px;font-weight:900;margin-top:2px'>"+(d.serie||"")+" "+(d.folioFactura||"")+"</div><div style='font-size:10px;color:#64748B;margin-top:3px'>Fecha: "+dateStr+"</div>"+(d.metodoPago?"<div style='font-size:10px;color:#64748B'>Método: "+d.metodoPago+" · Forma: "+(d.formaPago||"")+"</div>":"")+"</div></div>"
    + "<div style='background:#F9F0F0;border-left:4px solid #8B1A1A;border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:14px'>"
    + "<div style='font-size:13px;font-weight:800'>"+(d.receptor?.nombre||"")+"</div>"

    + "<table><thead><tr><th style='width:50px;text-align:center'>Cant.</th><th style='width:70px;text-align:center'>Clave</th><th>Descripción</th><th style='width:85px;text-align:right'>V. Unitario</th><th style='width:95px;text-align:right'>Importe</th></tr></thead><tbody>"+rows+"</tbody></table>"
    + "<div style='text-align:right;margin-bottom:14px'><div style='font-size:11px;color:#64748B'>Subtotal: "+curX(d.subTotal)+"</div>"+(d.totalImpuestos?"<div style='font-size:11px;color:#64748B'>Impuestos: "+curX(d.totalImpuestos)+"</div>":"")+"<div style='font-size:20px;font-weight:900;color:#8B1A1A'>TOTAL: "+curX(d.total)+" "+(d.moneda||"")+"</div></div>"
    + "<div style='border-top:2px solid #E2E8F0;padding-top:10px;page-break-inside:avoid'>"

    + fiscalRow("Sello SAT", d.selloSAT ? d.selloSAT.slice(0,120)+"..." : "")
    + "</div>"
    + "<div style='margin-top:12px;text-align:center;font-size:9px;color:#94A3B8;border-top:1px solid #E2E8F0;padding-top:8px'>Este documento es una representación impresa de un CFDI · El XML es el comprobante fiscal digital válido<br/>COMINS — Cd. Madero, Tamaulipas</div>"
    + "<div class='nop'><button onclick='window.print()' style='background:#8B1A1A;color:#fff;border:none;border-radius:8px;padding:12px 32px;font-size:15px;font-weight:700;cursor:pointer'>Imprimir / Guardar PDF</button></div></body></html>";
}

function descargarBlob(contenido, nombre, tipo) {
  try {
    let blob;
    if(tipo==="pdfb64"){
      const b = contenido.split(",")[1]||contenido;
      const bin = atob(b); const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      blob = new Blob([arr], {type:"application/pdf"});
    } else blob = new Blob([contenido], {type: tipo});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
  } catch(e) { fireToast("⚠ Error al descargar"); }
}

// ── Hook: facturas en tiempo real (metadatos+xml; PDF aparte bajo demanda) ──
function useFacturas() {
  const [facturas, setFacturas] = useState([]);
  useEffect(()=>{
    if(!window._db) return;
    let unsub;
    try {
      unsub = window._db.collection("comins_facturas").onSnapshot(
        s => setFacturas(s.docs.map(d=>({id:d.id, ...d.data()}))),
        err => console.warn("Facturas read error:", err)
      );
    } catch(e){}
    return ()=>unsub&&unsub();
  },[]);

  const api = useMemo(()=>({
    guardar: async (f, pdfBase64) => {
      if(!window._db) throw new Error("sin conexión");
      await window._db.collection("comins_facturas").doc(f.id).set(f);
      if(pdfBase64) await window._db.collection("comins_facturas_files").doc(f.id).set({pdf:pdfBase64});
    },
    actualizar: async (id, cambios) => {
      if(!window._db) throw new Error("sin conexión");
      await window._db.collection("comins_facturas").doc(id).set(cambios, {merge:true});
    },
    getPdf: async (id) => {
      if(!window._db) return null;
      const doc = await window._db.collection("comins_facturas_files").doc(id).get();
      return doc.exists ? doc.data().pdf : null;
    },
    eliminarDefinitivo: async (id) => {
      if(!window._db) throw new Error("sin conexión");
      await window._db.collection("comins_facturas").doc(id).delete();
      try { await window._db.collection("comins_facturas_files").doc(id).delete(); } catch(e){}
    },
  }),[]);
  return [facturas, api];
}

function FacturasTab({facturas, facturasApi, obras, usuario}) {

  const esContador=rol==="contador";
  const [obraSel,setObraSel]=useState("todas");
  const [preview,setPreview]=useState(null);
  const [histVisible,setHistVisible]=useState(null);
  // Carga (contador)
  const [obraCarga,setObraCarga]=useState("");
  const [xmlData,setXmlData]=useState(null);   // {texto, datos, nombre}
  const [pdfData,setPdfData]=useState(null);   // {base64, nombre, kb}
  const [subiendo,setSubiendo]=useState(false);
  const [reemplazando,setReemplazando]=useState(null); // factura a reemplazar

  const ahora=()=>new Date().toISOString();
  const logEntry=(accion)=>({fecha:ahora(),accion,usuario:usuario?.nombre||""});

  // Obras según rol: contador/asistente solo con acceso
  const obrasDisp=useMemo(()=>esDirector?obras:obras.filter(o=>(o.acceso||[]).includes(usuario?.id)),[obras,usuario]);

  const visibles=useMemo(()=>{
    let r=[...facturas].sort((a,b)=>(b.creada||"").localeCompare(a.creada||""));
    if(esContador) r=r.filter(f=>!f.eliminada&&obrasDisp.some(o=>o.id===f.obraId));
    else if(!esDirector) r=r.filter(f=>!f.eliminada&&obrasDisp.some(o=>o.id===f.obraId)); // asistente: estado solamente
    if(obraSel!=="todas") r=r.filter(f=>f.obraId===obraSel);
    return r;
  },[facturas,obrasDisp,obraSel,usuario]);

  const leerXML=(ev)=>{
    const file=ev.target.files?.[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{
      const datos=parseCFDI(r.result);
      if(!datos||!datos.total) return fireToast("⚠ El archivo no parece un CFDI válido");
      setXmlData({texto:r.result,datos,nombre:file.name});
      fireToast("✅ XML leído — datos extraídos");
    };
    r.readAsText(file); ev.target.value="";
  };
  const leerPDF=(ev)=>{
    const file=ev.target.files?.[0]; if(!file) return;
    if(file.size>900*1024) return fireToast("⚠ PDF muy pesado (máx 900 KB)");
    const r=new FileReader();
    r.onload=()=>setPdfData({base64:r.result,nombre:file.name,kb:Math.round(file.size/1024)});
    r.readAsDataURL(file); ev.target.value="";
  };

  const subirFactura=async()=>{
    if(!obraCarga&&!reemplazando) return fireToast("⚠ Selecciona la obra");
    if(!xmlData) return fireToast("⚠ Falta el XML de la factura");
    setSubiendo(true);
    try {
      if(reemplazando){
        const cambios={xml:xmlData.texto,datos:xmlData.datos,tienePdf:!!pdfData||reemplazando.tienePdf,
          historial:[...(reemplazando.historial||[]),logEntry("Archivos reemplazados"+(pdfData?" (XML y PDF)":" (XML)"))]};
        await facturasApi.actualizar(reemplazando.id,cambios);
        if(pdfData) await facturasApi.guardar({...reemplazando,...cambios},pdfData.base64);
        fireToast("✅ Factura reemplazada");
      } else {
        const f={id:uid(),obraId:obraCarga,creada:ahora(),estado:"emitida",eliminada:false,
          xml:xmlData.texto,datos:xmlData.datos,tienePdf:!!pdfData,
          subioNombre:usuario?.nombre||"",subioId:usuario?.id||"",
          historial:[logEntry("Factura cargada")]};
        await facturasApi.guardar(f,pdfData?.base64);
        fireToast("✅ Factura cargada — el Director ya la ve");
      }
      setXmlData(null);setPdfData(null);setObraCarga("");setReemplazando(null);
    } catch(e){ fireToast("⚠ Error al subir — revisa conexión y reglas de Firebase"); }
    setSubiendo(false);
  };

  const softDelete=async(f)=>{
    if(!window.confirm("¿Eliminar esta factura? El Director conservará el registro con el historial.")) return;
    await facturasApi.actualizar(f.id,{eliminada:true,historial:[...(f.historial||[]),logEntry("Eliminada por contador")]});
    fireToast("🗑 Factura eliminada (registro conservado)");

  const EstadoBdg=({f})=>f.estado==="enviada"

    :<Bdg label="Emitida" color={C.blue} bg={C.blueBg} icon="🧾"/>;

  return <div style={{padding:"20px 20px 40px"}}>
    <div style={{marginBottom:16}}>
      <div style={{fontWeight:900,fontSize:22}}>Facturas</div>
      <div style={{color:C.muted,fontSize:13}}>
        {esContador?"Carga el XML y PDF de cada factura, vinculada a su obra":esDirector?`${facturas.length} factura${facturas.length!==1?"s":""} registradas`:"Seguimiento de facturación"}
      </div>
    </div>

    {/* ── CARGA (contador) ── */}
    {esContador&&<Card style={{marginBottom:18}}>
      <div style={{fontWeight:800,fontSize:15,marginBottom:12}}>{reemplazando?`♻ Reemplazar archivos de ${reemplazando.datos?.serie||""} ${reemplazando.datos?.folioFactura||""}`:"⬆ Cargar factura"}</div>
      {!reemplazando&&<Sel label="Obra *" value={obraCarga} onChange={e=>setObraCarga(e.target.value)}
        options={[{v:"",l:"Selecciona la obra..."},...obrasDisp.map(o=>({v:o.id,l:`${o.folio} — ${o.nombre}`}))]}/>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        <label style={{border:`2px dashed ${xmlData?C.green:C.borderStrong}`,background:xmlData?C.greenBg:C.surfaceAlt,borderRadius:12,padding:"18px 12px",textAlign:"center",cursor:"pointer"}}>
          <input type="file" accept=".xml,text/xml" onChange={leerXML} style={{display:"none"}}/>
          <div style={{fontSize:22,marginBottom:4}}>{xmlData?"✅":"📑"}</div>

          {xmlData&&<div style={{fontSize:11,color:C.green,marginTop:2}}>{xmlData.datos.receptor?.nombre} · {curX(xmlData.datos.total)}</div>}
        </label>
        <label style={{border:`2px dashed ${pdfData?C.green:C.borderStrong}`,background:pdfData?C.greenBg:C.surfaceAlt,borderRadius:12,padding:"18px 12px",textAlign:"center",cursor:"pointer"}}>

          <div style={{fontWeight:800,fontSize:13}}>{pdfData?`${pdfData.nombre} (${pdfData.kb} KB)`:"PDF de la factura"}</div>
        </label>
      </div>
      <div style={{display:"flex",gap:8}}>
        {reemplazando&&<Btn ch="Cancelar" v="ghost" onClick={()=>{setReemplazando(null);setXmlData(null);setPdfData(null);}}/>}
        <Btn ch={subiendo?"Subiendo...":"⬆ Guardar factura"} v="primary" style={{flex:1}} disabled={subiendo} onClick={subirFactura}/>
      </div>

    {/* Filtro por obra */}
    <div style={{display:"flex",gap:8,marginBottom:14,overflowX:"auto",paddingBottom:4}}>
      {[{id:"todas",folio:"Todas"},...obrasDisp].map(o=>(
        <button key={o.id} onClick={()=>setObraSel(o.id)}
          style={{background:obraSel===o.id?C.accentBg:"transparent",border:`1.5px solid ${obraSel===o.id?C.accent:C.border}`,color:obraSel===o.id?C.accent:C.muted,borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>

    </div>

    {visibles.length===0&&<Card style={{textAlign:"center",padding:40}}><div style={{fontSize:40,marginBottom:10}}>🧾</div><div style={{fontWeight:700,color:C.muted}}>Sin facturas</div></Card>}

    {visibles.map(f=>{
      const obra=obras.find(o=>o.id===f.obraId);
      const d=f.datos||{};
      return <Card key={f.id} style={{marginBottom:12,opacity:f.eliminada?.75:1,borderLeft:f.eliminada?`3px solid ${C.red}`:"none"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:180}}>
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:3}}>

// RESPALDO — Exportar / Importar todos los datos (solo director)
// ═══════════════════════════════════════════════════════════════
function BackupModal({data, onImport, onClose}) {
  const fileRef = useRef();

  const exportar = () => {
    try {
      const payload = {...data, _exportado: new Date().toISOString(), _sistema: "COMINS Industrial"};
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const f = today.replace(/-/g,"");
      a.href = url; a.download = `COMINS_respaldo_${f}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 30000);
      fireToast("💾 Respaldo descargado");
    } catch(e) { fireToast("⚠ Error al exportar"); }
  };

  const importar = (ev) => {
    const file = ev.target.files?.[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== "object") throw new Error("Formato inválido");
        const resumen = ["obras","presupuestos","movimientos","compras","empleados","destajos","inventario"]
          .map(k => `${(parsed[k]||[]).length} ${k}`).join(", ");
        if(window.confirm(`Este respaldo contiene: ${resumen}.\n\n⚠ IMPORTAR REEMPLAZARÁ todos los datos actuales del sistema. ¿Continuar?`)) {
          onImport(parsed);
          fireToast("✅ Datos restaurados desde el respaldo");
          onClose();
        }
      } catch(e) { fireToast("⚠ Archivo inválido — debe ser un respaldo COMINS (.json)"); }
    };
    reader.readAsText(file);
    ev.target.value = "";
  };

  return <Modal title="🗂 Respaldo de datos" onClose={onClose}>
    <div style={{fontSize:13,color:C.sub,lineHeight:1.6,marginBottom:16}}>
      Descarga una copia completa de todo el sistema (proyectos, presupuestos, finanzas, compras, personal, inventario, usuarios y cláusulas) o restaura desde un respaldo anterior.
    </div>
    <div style={{background:C.greenBg,borderRadius:12,padding:"14px 16px",marginBottom:12}}>
      <div style={{fontWeight:800,fontSize:14,color:C.green,marginBottom:4}}>⬇ Exportar</div>
      <div style={{fontSize:12,color:C.sub,marginBottom:10}}>Descarga un archivo .json con todos los datos. Guárdalo en un lugar seguro — hazlo cada semana.</div>
      <Btn ch="💾 Descargar respaldo completo" v="green" style={{width:"100%"}} onClick={exportar}/>
    </div>
    <div style={{background:C.orangeBg,borderRadius:12,padding:"14px 16px"}}>
      <div style={{fontWeight:800,fontSize:14,color:C.orange,marginBottom:4}}>⬆ Importar</div>
      <div style={{fontSize:12,color:C.sub,marginBottom:10}}>⚠ Reemplaza TODOS los datos actuales con los del archivo. Úsalo solo para restaurar.</div>
      <input ref={fileRef} type="file" accept="application/json,.json" onChange={importar} style={{display:"none"}}/>
      <Btn ch="📂 Seleccionar archivo de respaldo" v="ghost" style={{width:"100%"}} onClick={()=>fileRef.current?.click()}/>
    </div>
  </Modal>;
}

// ═══════════════════════════════════════════════════════════════
// GESTIÓN DE USUARIOS Y PINS (solo director)
// ═══════════════════════════════════════════════════════════════
function UsuariosModal({usuarios, setUsuarios, usuarioActual, onClose}) {
  const [editando, setEditando] = useState(null); // usuario en edición o "nuevo"
  const [form, setForm] = useState({nombre:"",usuario:"",pin:"",rol:"supervisor"});
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));

  const empezarEdicion=(u)=>{setEditando(u.id);setForm({nombre:u.nombre,usuario:u.usuario,pin:u.pin,rol:u.rol});};
  const empezarNuevo=()=>{setEditando("nuevo");setForm({nombre:"",usuario:"",pin:"",rol:"supervisor"});};

  const guardar=()=>{
    if(!form.nombre.trim()||!form.usuario.trim()||!String(form.pin).trim()) return fireToast("⚠ Todos los campos son obligatorios");
    const usuarioLimpio=form.usuario.toLowerCase().trim().replace(/\s+/g,"");
    const duplicado=usuarios.some(u=>u.usuario.toLowerCase()===usuarioLimpio&&u.id!==editando);
    if(duplicado) return fireToast("⚠ Ese nombre de usuario ya existe");
    if(editando==="nuevo") {
      setUsuarios(p=>[...p,{id:uid(),nombre:form.nombre.trim(),usuario:usuarioLimpio,pin:String(form.pin).trim(),rol:form.rol}]);
      fireToast("✅ Usuario creado");
    } else {
      setUsuarios(p=>p.map(u=>u.id===editando?{...u,nombre:form.nombre.trim(),usuario:usuarioLimpio,pin:String(form.pin).trim(),rol:form.rol}:u));
      fireToast("✅ Usuario actualizado");
    }
    setEditando(null);
  };

  const eliminar=(u)=>{
    if(u.id===usuarioActual?.id) return fireToast("⚠ No puedes eliminar tu propio usuario");
    if(usuarios.filter(x=>x.rol==="director").length===1&&u.rol==="director") return fireToast("⚠ Debe existir al menos un director");
    if(window.confirm(`¿Eliminar el usuario ${u.nombre}?`)) {
      setUsuarios(p=>p.filter(x=>x.id!==u.id));
      fireToast("🗑 Usuario eliminado");
    }
  };

  return <Modal title="👥 Usuarios y PINs" onClose={onClose} wide>
    <div style={{fontSize:13,color:C.muted,marginBottom:14}}>
      Administra quién puede entrar al sistema y con qué rol. Los cambios se guardan en la nube y aplican de inmediato.
    </div>

    {usuarios.map(u=>(
      <div key={u.id} style={{border:`1.5px solid ${editando===u.id?C.accent:C.border}`,borderRadius:12,padding:"12px 14px",marginBottom:10,background:editando===u.id?C.accentLight:C.surface}}>
        {editando===u.id?(
          <>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
              <Inp label="Nombre" value={form.nombre} onChange={e=>set("nombre",e.target.value)}/>
              <Inp label="Usuario (para entrar)" value={form.usuario} onChange={e=>set("usuario",e.target.value)}/>
              <Inp label="PIN" value={form.pin} onChange={e=>set("pin",e.target.value)} maxLength={8}/>
              <Sel label="Rol" value={form.rol} onChange={e=>set("rol",e.target.value)}
                options={Object.entries(ROLES).map(([v,{label,icon}])=>({v,l:`${icon} ${label}`}))}/>
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn ch="Cancelar" v="ghost" sm onClick={()=>setEditando(null)}/>
              <Btn ch="✅ Guardar" v="primary" sm style={{flex:1}} onClick={guardar}/>
            </div>
          </>
        ):(
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
            <div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <span style={{fontWeight:800,fontSize:14}}>{u.nombre}</span>
                <Bdg label={ROLES[u.rol]?.label||u.rol} color={u.rol==="director"?C.accent:u.rol==="asistente"?C.blue:C.orange}
                  bg={u.rol==="director"?C.accentBg:u.rol==="asistente"?C.blueBg:C.orangeBg} icon={ROLES[u.rol]?.icon}/>
                {u.id===usuarioActual?.id&&<Bdg label="Tú" color={C.green} bg={C.greenBg}/>}
              </div>
              <div style={{fontSize:12,color:C.muted,marginTop:3}}>Usuario: <b>{u.usuario}</b> · PIN: <b>{"•".repeat(String(u.pin).length)}</b></div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <Btn ch="✏ Editar" v="ghost" sm onClick={()=>empezarEdicion(u)}/>
              {u.id!==usuarioActual?.id&&<Btn ch="🗑" v="ghost" sm style={{color:C.red}} onClick={()=>eliminar(u)}/>}
            </div>
          </div>
        )}
      </div>
    ))}

    {editando==="nuevo"?(
      <div style={{border:`1.5px solid ${C.green}`,borderRadius:12,padding:"12px 14px",marginBottom:10,background:C.greenBg}}>
        <div style={{fontWeight:800,fontSize:13,color:C.green,marginBottom:10}}>➕ Nuevo usuario</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
          <Inp label="Nombre" value={form.nombre} onChange={e=>set("nombre",e.target.value)} placeholder="Nombre completo"/>
          <Inp label="Usuario (para entrar)" value={form.usuario} onChange={e=>set("usuario",e.target.value)} placeholder="sin espacios"/>
          <Inp label="PIN" value={form.pin} onChange={e=>set("pin",e.target.value)} placeholder="4-8 dígitos" maxLength={8}/>
          <Sel label="Rol" value={form.rol} onChange={e=>set("rol",e.target.value)}
            options={Object.entries(ROLES).map(([v,{label,icon}])=>({v,l:`${icon} ${label}`}))}/>
        </div>
        <div style={{display:"flex",gap:8}}>
          <Btn ch="Cancelar" v="ghost" sm onClick={()=>setEditando(null)}/>
          <Btn ch="✅ Crear usuario" v="green" sm style={{flex:1}} onClick={guardar}/>
        </div>
      </div>
    ):(
      <Btn ch="+ Agregar usuario" v="dark" style={{width:"100%"}} onClick={empezarNuevo}/>
    )}
  </Modal>;
}

// ═══════════════════════════════════════════════════════════════
// APP PRINCIPAL — Integración de los 6 módulos
// ═══════════════════════════════════════════════════════════════
function App() {
  const [usuario, setUsuario] = useState(() => {
    try { const s = sessionStorage.getItem("comins_sesion"); return s ? JSON.parse(s) : null; } catch(e){ return null; }
  });
  const [tab, setTab] = useState("dashboard");
  const [showUsuarios, setShowUsuarios] = useState(false);
  const [showBackup, setShowBackup] = useState(false);

  // ── Datos globales en Firebase ──
  const [obras,        setObras]        = useStored("obras", []);
  const [presupuestos, setPresupuestos] = useStored("presupuestos", []);
  const [movs,         setMovs]         = useStored("movimientos", []);
  const [compras,      setCompras]      = useStored("compras", []);
  const [empleados,    setEmpleados]    = useStored("empleados", []);
  const [asistencia,   setAsistencia]   = useStored("asistencia", {});
  const [destajos,     setDestajos]     = useStored("destajos", []);
  const [inventario,   setInventario]   = useStored("inventario", []);
  const [usuarios,     setUsuarios]     = useStored("usuarios", USUARIOS_DEFAULT);
  const [dispositivos, setDispositivos, dispReady] = useStored("dispositivos", []);
  const [showDispositivos, setShowDispositivos] = useState(false);
  const [clausulas,    setClausulas]    = useStored("clausulas", CLAUSULAS_DEFAULT);
  const [catGasto,     setCatGasto]     = useStored("categoriasGasto", CAT_GASTO_DEFAULT);
  const [facturas, facturasApi] = useFacturas();
  // El contador entra directo a su módulo
  useEffect(()=>{ if(usuario?.rol==="contador"&&tab!=="facturas") setTab("facturas"); },[usuario]);

  const obrasEnriquecidas = useMemo(() => obras.map(o => {
    const m = movs.filter(x => x.obraId === o.id && x.status === "realizado");
    // Préstamos y sus pagos NO cuentan como cobro/gasto de obra (solo mueven caja)
    const cobrado = m.filter(x => x.tipo === "ingreso" && x.subtipo !== "prestamo").reduce((s,x) => s + x.monto, 0);
    const gastos  = m.filter(x => x.tipo === "egreso" && !(x.esPagoPrestamo === true || x.categoria === "Pago de préstamo")).reduce((s,x) => s + x.monto, 0);
    return {...o, cobrado, gastos};
  }), [obras, movs]);

  // Obras que el usuario actual puede ver (director: todas)
  const obrasVisibles = useMemo(() => obrasEnriquecidas.filter(o => obraVisible(o, usuario)), [obrasEnriquecidas, usuario]);

  const handleLogin = (u) => {
    setUsuario(u);
    try { sessionStorage.setItem("comins_sesion", JSON.stringify(u)); } catch(e){}
    // Primer dispositivo del sistema: se autoriza automáticamente
    if(dispositivos.length === 0) {
      setDispositivos([{
        id: DEVICE_ID, autorizado: true, nombre: "Dispositivo de "+u.nombre,
        solicitado: today, autorizadoFecha: today,
        info: (navigator.userAgent||"").slice(0,90),
      }]);
    }
  };
  const handleLogout = () => {
    setUsuario(null); setTab("dashboard");
    try { sessionStorage.removeItem("comins_sesion"); } catch(e){}
  };

  // ── Cierre de sesión por inactividad ──────────────────────────
  // 30 min sin interacción → logout. Al despertar la pantalla/lap
  // de suspensión se verifica de inmediato el tiempo transcurrido.
  const SESION_TIMEOUT_MIN = 30;
  useEffect(() => {
    if(!usuario) return;
    let ultimaActividad = Date.now();
    const marcar = () => { ultimaActividad = Date.now(); };
    const eventos = ["click","keydown","touchstart","scroll","mousemove"];
    eventos.forEach(e => window.addEventListener(e, marcar, {passive:true}));
    const verificar = () => {
      if(Date.now() - ultimaActividad > SESION_TIMEOUT_MIN*60*1000) {
        handleLogout();
        fireToast("🔒 Sesión cerrada por inactividad");
      }
    };
    const intervalo = setInterval(verificar, 60*1000);
    const alDespertar = () => { if(document.visibilityState === "visible") verificar(); };
    document.addEventListener("visibilitychange", alDespertar);
    return () => {
      eventos.forEach(e => window.removeEventListener(e, marcar));
      clearInterval(intervalo);
      document.removeEventListener("visibilitychange", alDespertar);
    };
  }, [usuario]);

  // ── Candado de dispositivo ────────────────────────────────────
  const esteDisp = dispositivos.find(d => d.id === DEVICE_ID);
  const dispositivoAutorizado = esteDisp?.autorizado === true;
  const sistemaSinDispositivos = dispReady && dispositivos.length === 0;

  // Registrar este dispositivo como pendiente si no está en la lista
  useEffect(() => {
    if(dispReady && dispositivos.length > 0 && !esteDisp) {
      setDispositivos(p => p.some(d => d.id === DEVICE_ID) ? p : [...p, {
        id: DEVICE_ID, autorizado: false, nombre: "",
        solicitado: today, info: (navigator.userAgent||"").slice(0,90),
      }]);
    }
  }, [dispReady, dispositivos.length, esteDisp]);

  if(!dispReady) return <DeviceCheckScreen/>;
  if(!sistemaSinDispositivos && !dispositivoAutorizado) return <><DeviceLockScreen pendiente={!!esteDisp}/><Toast/></>;

  if(!usuario) return <><LoginScreen onLogin={handleLogin} usuarios={usuarios}/><Toast/></>;

  const TAB_TITLES = {
    dashboard:"Panel", proyectos:"Proyectos", cotizaciones:"Presupuestos",
    finanzas:"Finanzas", compras:"Compras", personal:"Personal", inventario:"Inventario", facturas:"Facturas",
  };

  const renderTab = () => {
    switch(tab) {
      case "dashboard":
        return <DashboardTab obras={obrasVisibles} proyectos={obrasVisibles} finanzas={movs} compras={compras} usuario={usuario}/>;
      case "proyectos":
        return <ProyectosTab obras={obrasVisibles} setObras={setObras} usuario={usuario} movs={movs} usuarios={usuarios}
          setMovs={setMovs} empleados={empleados} setEmpleados={setEmpleados}
          asistencia={asistencia} setAsistencia={setAsistencia}
          destajos={destajos} setDestajos={setDestajos}
          presupuestos={presupuestos} categorias={catGasto}
          facturas={facturas} facturasApi={facturasApi}/>;
      case "cotizaciones":
        return <PresupuestosTab presupuestos={presupuestos} setPresupuestos={setPresupuestos} clausulas={clausulas} setClausulas={setClausulas} usuario={usuario} obras={obras} setObras={setObras}/>;
      case "finanzas":
        return <FinanzasTab obras={obrasVisibles} movs={movs} setMovs={setMovs} usuario={usuario} categorias={catGasto} setCategorias={setCatGasto}/>;
      case "compras":
        return <ComprasTab compras={compras} setCompras={setCompras} obras={obrasVisibles} usuario={usuario} setMovs={setMovs}/>;
      case "personal":
        return <PersonalTab empleados={empleados} setEmpleados={setEmpleados}
          asistencia={asistencia} setAsistencia={setAsistencia}
          destajos={destajos} setDestajos={setDestajos}
          obras={obrasVisibles} usuario={usuario} onAddGasto={(g)=>setMovs(p=>[g,...p])}
          onEditGasto={(id,cambios)=>setMovs(p=>p.map(x=>x.id===id?{...x,...cambios}:x))}
          onRemoveGasto={(id)=>setMovs(p=>p.filter(x=>x.id!==id))}/>;
      case "inventario":
        return <InventarioTab inventario={inventario} setInventario={setInventario} obras={obrasVisibles}/>;
      case "facturas":
        return <FacturasTab facturas={facturas} facturasApi={facturasApi} obras={obrasEnriquecidas} usuario={usuario}/>;
      default: return null;
    }
  };

  return (
    <div style={{minHeight:"100vh", background:C.bg, fontFamily:"'Inter',-apple-system,'Segoe UI',sans-serif"}}>
      <Header title={TAB_TITLES[tab]} usuario={usuario} onLogout={handleLogout} onUsuarios={()=>setShowUsuarios(true)} onBackup={()=>setShowBackup(true)} onDispositivos={()=>setShowDispositivos(true)}/>
      <div style={{paddingBottom:92, maxWidth:860, margin:"0 auto"}}>
        {renderTab()}
      </div>
      <NavBar tab={tab} setTab={setTab} usuario={usuario} onLogout={handleLogout}/>
      {showUsuarios&&<UsuariosModal usuarios={usuarios} setUsuarios={setUsuarios} usuarioActual={usuario} onClose={()=>setShowUsuarios(false)}/>}
      {showDispositivos&&<DispositivosModal dispositivos={dispositivos} setDispositivos={setDispositivos} onClose={()=>setShowDispositivos(false)}/>}
      {showBackup&&<BackupModal
        data={{obras,presupuestos,movimientos:movs,compras,empleados,asistencia,destajos,inventario,usuarios,clausulas,categoriasGasto:catGasto}}
        onImport={(d)=>{
          if(d.obras!==undefined) setObras(d.obras||[]);
          if(d.presupuestos!==undefined) setPresupuestos(d.presupuestos||[]);
          if(d.movimientos!==undefined) setMovs(d.movimientos||[]);
          if(d.compras!==undefined) setCompras(d.compras||[]);
          if(d.empleados!==undefined) setEmpleados(d.empleados||[]);
          if(d.asistencia!==undefined) setAsistencia(d.asistencia||{});
          if(d.destajos!==undefined) setDestajos(d.destajos||[]);
          if(d.inventario!==undefined) setInventario(d.inventario||[]);
          if(d.usuarios!==undefined&&(d.usuarios||[]).length>0) setUsuarios(d.usuarios);
          if(d.clausulas!==undefined) setClausulas(d.clausulas||[]);
          if(d.categoriasGasto!==undefined&&(d.categoriasGasto||[]).length>0) setCatGasto(d.categoriasGasto);
        }}
        onClose={()=>setShowBackup(false)}/>}
      <Toast/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
  </script>
</body>
